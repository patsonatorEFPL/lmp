# Test profile — sync enabled with mock external client
ADMIN_PASSWORD=testpass123
lmp.sync.enabled=true
lmp.sync.external.base-url=http://localhost:9999
lmp.sync.external.api-key=test-key
lmp.sync.external.api-secret=test-secret
lmp.sync.external.currency=EUR
lmp.sync.external.company=Test Company

# Stripe dummy key for test context startup
stripe.secret.key=sk_test_dummy
stripe.publishable.key=pk_test_dummy
stripe.webhook.secret=whsec_dummy

# Disable scheduling during tests
lmp.sync.purge.enabled=false
lmp.sync.queue.poll-interval-ms=999999
lmp.sync.retry.delay-seconds=999
lmp.sync.monitor.interval-ms=999999

# Datasource — H2 in-memory with PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Initialize OAuth2 schema before Hibernate
spring.sql.init.schema-locations=classpath:schema-test.sql
spring.sql.init.mode=always

# OAuth2 dummy registrations so ClientRegistrationRepository is created in tests
spring.security.oauth2.client.registration.google.client-id=test-google-id
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.client-id=test-ms-id
spring.security.oauth2.client.registration.microsoft.client-secret=test-ms-secret
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.client-name=Microsoft
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-name-attribute=email

# Logging
logging.level.com.lmp.integration.sync=DEBUG
