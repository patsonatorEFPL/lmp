# ========================================
# CONFIGURATION TEST - LMP SERVICES
# ========================================

# Configuration du serveur de test
server.port=0
spring.main.web-application-type=servlet

# Base de données H2 en mémoire pour les tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Configuration JPA/Hibernate pour tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# Configuration Flyway désactivée pour les tests
spring.flyway.enabled=false

# Configuration SQL init pour les tests
spring.sql.init.enabled=false

# Configuration Thymeleaf pour tests
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# DevTools désactivé en test
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ========================================
# CONFIGURATION EMAIL TEST (MOCK)
# ========================================

# Configuration SMTP Mock pour tests
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.debug=false

# Configuration des adresses email de test
mail.from.name=LMP Test Services
mail.from.noreply=noreply@test.lmp-services.ca
mail.from.support=support@test.lmp-services.ca
mail.replyto.support=support@test.lmp-services.ca

# Variables de test (remplacent les variables d'environnement)
mailtrap.api.token=test-api-token
mailtrap.account.id=12345

# ========================================
# CONFIGURATION STRIPE TEST
# ========================================

# Clés Stripe de test
stripe.secret.key=sk_test_123456789
stripe.publishable.key=pk_test_123456789
stripe.webhook.secret=whsec_test_123456789
stripe.api.version=2023-10-16
stripe.max.network.retries=3
stripe.connect.timeout=30000
stripe.read.timeout=80000

# URLs de test
stripe.checkout.success.url=/test/checkout/success
stripe.checkout.cancel.url=/test/checkout/cancel

# ========================================
# CONFIGURATION APPLICATION TEST
# ========================================

# URLs et informations de test
app.base.url=http://localhost:8080
app.name=LMP Test Services
app.version=1.0.1-TEST

# Configuration paiements test
payment.default.currency=CAD
payment.max.amount=10000.00
payment.min.amount=1.00
payment.processing.timeout=300000

# Configuration entreprise test
company.name=LMP Test Services
company.logo.path=/images/Logo LMP.png
company.address=123 Test Street, Test City, Test Province, T1T 1T1
company.phone=+1 (555) 123-TEST
company.email=test@lmp-services.ca
company.website=http://localhost:8080

# Configuration factures test
invoice.template.path=classpath:templates/invoices/
invoice.output.path=./test-invoices/
invoice.number.prefix=TEST-
invoice.due.days=30

# ========================================
# SÉCURITÉ TEST
# ========================================

# JWT Configuration de test
security.jwt.secret=test-jwt-secret-key-for-testing-purposes-only-not-for-production-use
security.jwt.expiration=86400000

# Configuration sécurité des mots de passe
security.password.min.length=8
security.max.login.attempts=5
security.account.lockout.duration=300000

# ========================================
# LOGGING TEST
# ========================================

# Logs réduits pour les tests
logging.level.root=WARN
logging.level.com.lmp=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ========================================
# INTERNATIONALISATION
# ========================================

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ========================================
# CONFIGURATION H2 CONSOLE (pour debug des tests si nécessaire)
# ========================================

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ========================================
# PERFORMANCE TEST
# ========================================

spring.jpa.open-in-view=false
server.servlet.session.timeout=30m
