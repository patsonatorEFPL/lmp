# =============================================
# LMP — Profil PROD (Dokploy / Production)
# =============================================
# Tous les secrets sont injectés via variables d'environnement.
# Aucune valeur sensible ne doit apparaître dans ce fichier.

# ===== SERVEUR =====
server.port=${PORT:8080}
server.forward-headers-strategy=FRAMEWORK
# Tarification par IP : le reverse proxy (Traefik / Caddy / Nginx) doit transmettre
# X-Forwarded-For et/ou Forwarded ; Cloudflare doit transmettre CF-Connecting-IP.

# ===== BASE DE DONNÉES POSTGRESQL =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lmp_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP (Pool de connexions — production)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=LmpHikariPool-Prod

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.repair-on-migrate=true

# ===== THYMELEAF (legacy — sera remplacé par Angular) =====
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Ressources statiques
spring.web.resources.static-locations=classpath:/static/

# DevTools désactivé en production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ===== LOGGING =====
logging.level.root=INFO
logging.level.com.lmp=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=WARN

# ===== STRIPE (secrets via ${ENV_VAR}) =====
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
stripe.api.version=2024-06-20
stripe.max.network.retries=3
stripe.connect.timeout=30000
stripe.read.timeout=80000

# Configuration Stripe Checkout (Angular SPA routes)
stripe.checkout.success.url=/payment/success
stripe.checkout.cancel.url=/payment/cancel

# ===== EMAIL (SMTP — secrets via ${ENV_VAR}) =====
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Mailtrap
mailtrap.api.token=${MAILTRAP_API_TOKEN:}
mailtrap.account.id=${MAILTRAP_ACCOUNT_ID:}

# ===== SITE (source unique de vérité) =====
# Obligatoire en production — toutes les URLs et emails en découlent.
lmp.site.url=${SITE_URL}

# ===== ADRESSES EMAIL =====
mail.from.name=LMP Digital Services
# Les adresses email sont dérivées du host de lmp.site.url si non définies.

# ===== APPLICATION =====
app.name=${APP_NAME:LMP Digital Services}
app.version=1.0.1

# Mode monolithique : le backend sert directement le frontend Angular
# embarqué dans le JAR. Laisser vide en production.
# En développement : http://localhost:4200
app.frontend.url=
app.base.url=${SITE_URL}

# OAuth2 Social Login (Google / Microsoft)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:MISSING}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:MISSING}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID:MISSING}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:MISSING}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.client-name=Microsoft
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-name-attribute=email

# OAuth2 Authorization Server
app.oauth2.external.client-id=${OAUTH2_EXTERNAL_CLIENT_ID:oauth-external-client}
app.oauth2.external.client-secret=${OAUTH2_EXTERNAL_CLIENT_SECRET:}
app.oauth2.external.redirect-uri=${OAUTH2_EXTERNAL_REDIRECT_URI:}
app.oauth2.jwk.path=${OAUTH2_JWK_PATH:/var/lib/lmp/oauth2-jwk.json}

# OIDC issuer + external CRM SSO redirect — explicites par profil
# (idéalement dérivés par SiteEnvironmentPostProcessor depuis SITE_URL,
# mais le imports file est mal placé dans le JAR — à investiguer plus tard)
app.oauth2.issuer-uri=https://auth.lmp-services.ca
app.oauth2.erp.redirect-uri=https://crm.lmp-services.ca/api/method/external CRM.integrations.oauth2_logins.custom/lmp_sso

# Configuration des paiements
payment.default.currency=EUR
payment.max.amount=10000.00
payment.min.amount=1.00
payment.processing.timeout=300000

# ===== ENTREPRISE =====
company.name=${COMPANY_NAME:LMP Digital Services}
company.logo.path=${COMPANY_LOGO_PATH:/images/Logo LMP.png}
company.tagline=${COMPANY_TAGLINE:Marketing Digital & Solutions Web}
company.address=${COMPANY_ADDRESS:123 Rue Principale, Ville, Province, Code Postal}
company.phone=${COMPANY_PHONE:+1 (555) 123-4567}
# company.email et company.website dérivés de lmp.site.url
company.city=${COMPANY_CITY:Ville, Province}

# Emails internes dérivés de lmp.site.url

# ===== FACTURES =====
invoice.template.path=classpath:templates/invoices/
invoice.output.path=./invoices/
invoice.number.prefix=LMP-
invoice.due.days=30

# ===== SÉCURITÉ =====
security.password.min.length=8
security.max.login.attempts=5
security.account.lockout.duration=300000
security.remember-me.secret=${REMEMBER_ME_SECRET}

# ===== SESSION PERSISTENCE (PostgreSQL-backed sessions survive deployments) =====
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.table-name=SPRING_SESSION
server.servlet.session.timeout=24h
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ===== COMPRESSION =====
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ===== INTERNATIONALISATION =====
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ===== SWAGGER UI (désactivé en production) =====
springdoc.swagger-ui.enabled=false

# ===== ACTUATOR =====
# En production : uniquement health (requis pour le healthcheck Docker/Dokploy)
# info et metrics sont désactivés pour ne pas exposer d'informations internes
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=false
