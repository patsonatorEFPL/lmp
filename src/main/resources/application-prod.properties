# =============================================
# LMP — Profil PROD (Dokploy / Production)
# =============================================
# Tous les secrets sont injectés via variables d'environnement.
# Aucune valeur sensible ne doit apparaître dans ce fichier.

# ===== SERVEUR =====
server.port=${PORT:8080}
server.forward-headers-strategy=FRAMEWORK

# ===== BASE DE DONNÉES POSTGRESQL =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lmp_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP (Pool de connexions — production)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=LmpHikariPool-Prod

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ===== THYMELEAF (legacy — sera remplacé par Angular) =====
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Ressources statiques
spring.web.resources.static-locations=classpath:/static/

# DevTools désactivé en production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ===== LOGGING =====
logging.level.root=INFO
logging.level.com.lmp=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=WARN

# ===== STRIPE (secrets via ${ENV_VAR}) =====
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
stripe.api.version=2024-06-20
stripe.max.network.retries=3
stripe.connect.timeout=30000
stripe.read.timeout=80000

# Configuration Stripe Checkout
stripe.checkout.success.url=/stripe/checkout/processing
stripe.checkout.cancel.url=/stripe/checkout/cancel

# ===== EMAIL (SMTP — secrets via ${ENV_VAR}) =====
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Mailtrap
mailtrap.api.token=${MAILTRAP_API_TOKEN:}
mailtrap.account.id=${MAILTRAP_ACCOUNT_ID:}

# ===== ADRESSES EMAIL =====
mail.from.name=LMP Digital Services
mail.from.noreply=noreply@lmp-services.be
mail.from.support=support@lmp-services.be
mail.replyto.support=support@lmp-services.be

# ===== APPLICATION =====
app.base.url=${APP_BASE_URL:https://lmp-services.be}
app.name=LMP Digital Services
app.version=1.0.1

# Configuration des paiements
payment.default.currency=EUR
payment.max.amount=10000.00
payment.min.amount=1.00
payment.processing.timeout=300000

# ===== ENTREPRISE =====
company.name=LMP Digital Services
company.logo.path=/images/Logo LMP.png
company.address=123 Rue Principale, Ville, Province, Code Postal
company.phone=+32 (0) 2 123 45 67
company.email=support@lmp-services.be
company.website=https://lmp-services.be

# ===== FACTURES =====
invoice.template.path=classpath:templates/invoices/
invoice.output.path=./invoices/
invoice.number.prefix=LMP-
invoice.due.days=30

# ===== SÉCURITÉ =====
security.password.min.length=8
security.max.login.attempts=5
security.account.lockout.duration=300000

# ===== SESSIONS =====
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# ===== COMPRESSION =====
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ===== INTERNATIONALISATION =====
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ===== SWAGGER UI (désactivé en production) =====
springdoc.swagger-ui.enabled=false

# ===== ACTUATOR =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
