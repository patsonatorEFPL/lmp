# ========================================
# CONFIGURATION PRODUCTION RAILWAY.COM
# Application Spring Boot LMP
# ========================================

# Configuration du serveur
server.port=${PORT:8080}
server.servlet.context-path=

# Configuration de la base de données MySQL Railway avec variables exactes
spring.datasource.url=jdbc:${MYSQL_URL}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration HikariCP optimisée pour Railway
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=LmpProductionPool

# Configuration JPA/Hibernate pour production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Configuration Flyway ACTIVÉE pour production
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
spring.flyway.ignore-missing-migrations=false
spring.flyway.ignore-ignored-migrations=false
spring.flyway.ignore-pending-migrations=false
spring.flyway.ignore-future-migrations=true

# Configuration Thymeleaf pour production
spring.thymeleaf.cache=true
spring.thymeleaf.check-template=false
spring.thymeleaf.check-template-location=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Configuration des ressources statiques
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=31536000
spring.web.resources.cache.cachecontrol.max-age=31536000
spring.web.resources.cache.cachecontrol.cache-public=true

# DevTools DÉSACTIVÉ en production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Configuration de logging pour production
logging.level.root=WARN
logging.level.com.lmp=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Configuration des logs pour Railway
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Configuration Stripe PRODUCTION avec vraies clés LIVE
stripe.secret.key=${STRIPE_SECRET_KEY:***STRIPE_LIVE_SECRET_KEY_REMOVED***}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:***STRIPE_LIVE_PUBLISHABLE_KEY_REMOVED***}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:***STRIPE_LIVE_WEBHOOK_SECRET_REMOVED***}
stripe.api.version=2023-10-16
stripe.max.network.retries=3
stripe.connect.timeout=30000
stripe.read.timeout=80000

# Configuration Stripe Checkout PRODUCTION
stripe.checkout.success.url=${APP_BASE_URL:http://localhost:8080}/stripe/checkout/success
stripe.checkout.cancel.url=${APP_BASE_URL:http://localhost:8080}/stripe/checkout/cancel

# Configuration de l'application
app.base.url=${APP_BASE_URL:http://localhost:8080}
app.name=LMP Digital Services
app.version=1.0.0
app.environment=production

# Configuration des paiements
payment.default.currency=CAD
payment.max.amount=10000.00
payment.min.amount=1.00
payment.processing.timeout=300000

# Configuration des emails Gmail pour production
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:lmp.assistance@gmail.com}
spring.mail.password=${MAIL_PASSWORD:ajygabgmlarbzqzf}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.starttls.required=true

# Configuration expéditeur par défaut
mail.from.address=${MAIL_FROM_ADDRESS:lmp.assistance@gmail.com}
mail.from.name=${MAIL_FROM_NAME:LMP Digital Services}

# Configuration de l'entreprise
company.name=LMP Digital Services
company.logo.path=/images/Logo LMP.png
company.address=${COMPANY_ADDRESS:123 Rue Principale, Ville, Province, Code Postal}
company.phone=${COMPANY_PHONE:+1 (555) 123-4567}
company.email=${COMPANY_EMAIL:contact@lmp-digital.ca}
company.website=${APP_BASE_URL}

# Configuration des factures
invoice.template.path=classpath:templates/invoices/
invoice.output.path=./invoices/
invoice.number.prefix=LMP-
invoice.due.days=30

# Configuration de la sécurité
security.jwt.secret=${JWT_SECRET:default-jwt-secret-for-development-only-change-in-production}
security.jwt.expiration=86400000
security.password.min.length=8
security.max.login.attempts=5
security.account.lockout.duration=300000

# Configuration SSL/TLS pour production
server.ssl.enabled=false
server.use-forward-headers=true
server.tomcat.use-relative-redirects=true

# Configuration des sessions pour production
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Configuration des threads et performance
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.connection-timeout=20000
server.tomcat.accept-count=100
server.tomcat.max-connections=8192

# Configuration JVM pour Railway
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false

# Configuration monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.export.simple.enabled=true