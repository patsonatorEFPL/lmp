# Configuration du serveur
server.port=${PORT:8080}
# Configuration pour reverse proxy - interprète les en-têtes X-Forwarded-*
server.forward-headers-strategy=FRAMEWORK

# Configuration de la base de donnees MySQL Coolify (URL INTERNE)
spring.datasource.url=jdbc:mysql://mysql:1GBYR8g3wFlPTIsX2oGyPlYwMpgpjib1FRPCQF3kgtKRbhdTJ7YhmuZsYAuIuYxi@179.61.246.91:5432/default
spring.datasource.username=mysql
spring.datasource.password=1GBYR8g3wFlPTIsX2oGyPlYwMpgpjib1FRPCQF3kgtKRbhdTJ7YhmuZsYAuIuYxi
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration HikariCP (Pool de connexions)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=LmpHikariPool

# Configuration de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Configuration de Flyway optimisee pour la production
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
spring.flyway.ignore-missing-migrations=false
spring.flyway.ignore-ignored-migrations=false
spring.flyway.ignore-pending-migrations=false
spring.flyway.ignore-future-migrations=true
spring.flyway.ignore-migration-patterns=*:failed

# Configuration Thymeleaf
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Configuration des ressources statiques
spring.web.resources.static-locations=classpath:/static/

# Configuration de developpement
spring.devtools.restart.enabled=false

# Configuration Spring DevTools
spring.devtools.livereload.enabled=false

# Logging pour le developpement et debugging authentification
logging.level.com.lmp=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# LOGS DE DIAGNOSTIC STRIPE ET REVERSE PROXY (PRODUCTION)
logging.level.DIAGNOSTIC=INFO
logging.level.SECURITY=INFO
logging.level.com.lmp.web.controller.DiagnosticController=INFO
logging.level.com.lmp.config.RequestLoggingFilter=WARN

# Configuration Stripe (LIVE KEYS pour production)
