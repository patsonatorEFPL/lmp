# Configuration du serveur
server.port=8080
# Configuration pour reverse proxy - interprète les en-têtes X-Forwarded-*
server.forward-headers-strategy=FRAMEWORK

# Configuration du profil actif (dev par défaut pour développement local)
spring.profiles.active=prod

# Configuration de la base de donnees MySQL Coolify (URL INTERNE)
spring.datasource.url=jdbc:mysql://mysql:1GBYR8g3wFlPTIsX2oGyPlYwMpgpjib1FRPCQF3kgtKRbhdTJ7YhmuZsYAuIuYxi@179.61.246.91:5432/default
spring.datasource.username=mysql
spring.datasource.password=1GBYR8g3wFlPTIsX2oGyPlYwMpgpjib1FRPCQF3kgtKRbhdTJ7YhmuZsYAuIuYxi
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration HikariCP (Pool de connexions)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=LmpHikariPool

# Configuration de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuration de Flyway optimisee pour la production
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
spring.flyway.ignore-missing-migrations=false
spring.flyway.ignore-ignored-migrations=false
spring.flyway.ignore-pending-migrations=false
spring.flyway.ignore-future-migrations=true
spring.flyway.ignore-migration-patterns=*:failed

# Configuration Thymeleaf pour production
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Configuration des ressources statiques
spring.web.resources.static-locations=classpath:/static/

# Configuration pour production (DevTools désactivé)
spring.devtools.restart.enabled=false

# Configuration Spring DevTools
spring.devtools.livereload.enabled=false

# Logging pour la production (optimisé)
logging.level.root=INFO
logging.level.com.lmp=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Logs email pour production (niveau INFO)
logging.level.org.springframework.mail=INFO
logging.level.org.springframework.mail.javamail=INFO
logging.level.com.sun.mail=WARN

# Logs spécialisés pour auto-répondeur noreply
logging.level.com.lmp.service.email.NoReplyAutoResponder=INFO

# LOGS DE DIAGNOSTIC - CONFIGURATION ACTIVE
logging.level.org.springframework.boot.context.config=DEBUG
logging.level.org.springframework.core.env=DEBUG
logging.level.org.springframework.context=DEBUG

# LOGS DE DIAGNOSTIC STRIPE ET REVERSE PROXY
logging.level.DIAGNOSTIC=INFO
logging.level.SECURITY=INFO
logging.level.AUDIT=INFO
logging.level.com.lmp.web.controller.DiagnosticController=DEBUG
logging.level.com.lmp.config.RequestLoggingFilter=INFO

# 🆕 LOGS SPÉCIFIQUES POUR ANALYSE WEBHOOKS
logging.level.com.lmp.service.payment.webhook=DEBUG
logging.level.com.lmp.web.controller.payment.WebhookController=DEBUG
logging.level.com.lmp.service.payment.PaymentServiceImpl=DEBUG

# Configuration Stripe (TEST KEYS - a remplacer en production)
stripe.secret.key=***STRIPE_LIVE_SECRET_KEY_REMOVED***
stripe.publishable.key=***STRIPE_LIVE_PUBLISHABLE_KEY_REMOVED***
stripe.webhook.secret=***STRIPE_LIVE_WEBHOOK_SECRET_REMOVED***
stripe.api.version=2023-10-16
stripe.max.network.retries=3
stripe.connect.timeout=30000
stripe.read.timeout=80000

# Configuration Stripe Checkout
stripe.checkout.success.url=/stripe/checkout/success
stripe.checkout.cancel.url=/stripe/checkout/cancel

# Configuration de l'application
app.base.url=https://lmp-services.ca
app.name=LMP Digital Services
app.version=1.0.1

# Configuration des paiements
payment.default.currency=EUR
payment.max.amount=10000.00
payment.min.amount=1.00
payment.processing.timeout=300000

# Configuration SMTP Mailtrap pour domaine lmp-services.ca
spring.mail.host=live.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=api
spring.mail.password=***MAILTRAP_TOKEN_REMOVED***
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=live.smtp.mailtrap.io
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Configuration additionnelle pour Mailtrap
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false

# Configuration expéditeur par défaut (OBSOLÈTE - remplacé par routing Cloudflare)
# mail.from.address=lmp.assistance@gmail.com
mail.from.name=LMP Digital Services

# ===== CONFIGURATION EMAIL ROUTING CLOUDFLARE =====
# Adresses visibles par les clients (routing Cloudflare vers lmp.assistance@gmail.com)
mail.from.noreply=noreply@lmp-services.ca
mail.from.support=support@lmp-services.ca
mail.replyto.support=support@lmp-services.ca

# Configuration MAILTRAP (remplace Gmail pour authentification domaine)
mailtrap.api.token=***MAILTRAP_TOKEN_REMOVED***
mailtrap.account.id=YOUR_MAILTRAP_ACCOUNT_ID_HERE

# Configuration IMAP pour auto-répondeur noreply (optionnel avec Mailtrap)
mail.imap.host=imap.gmail.com
mail.imap.port=993
mail.imap.username=${spring.mail.username}
mail.imap.password=${spring.mail.password}
mail.imap.ssl.enable=true
mail.imap.folder=INBOX

# Configuration auto-répondeur noreply
mail.noreply.autoresponder.enabled=true
mail.noreply.autoresponder.check.interval=300000
# Intervalle de vérification en millisecondes (5 minutes = 300000ms)

# Configuration de l'entreprise
company.name=LMP Digital Services
company.logo.path=/images/Logo LMP.png
company.address=123 Rue Principale, Ville, Province, Code Postal
company.phone=+1 (555) 123-4567
company.email=support@lmp-services.ca
company.website=https://lmp-services.ca

# Configuration des factures
invoice.template.path=classpath:templates/invoices/
invoice.output.path=./invoices/
invoice.number.prefix=LMP-
invoice.due.days=30

# Configuration de la securite avancee
security.jwt.secret=mySecretKey123456789012345678901234567890
security.jwt.expiration=86400000
security.password.min.length=8
security.max.login.attempts=5
security.account.lockout.duration=300000

# Configuration de nettoyage des commandes
# Temps maximum (en minutes) avant qu'une commande PAYMENT_PENDING soit annulée automatiquement
lmp.order.payment.pending.timeout.minutes=30
# Durée de rétention (en jours) des commandes CANCELLED avant suppression automatique
lmp.order.cancelled.retention.days=5

# ===== INTERNATIONALISATION (i18n) =====
# Configuration Spring Boot native pour le multilangue
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
