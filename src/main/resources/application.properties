# =============================================
# LMP Digital Services — Configuration Commune
# =============================================
# Ce fichier contient UNIQUEMENT des valeurs non-sensibles et des références ${ENV_VAR}.
# Les secrets sont dans application-secrets.properties (gitignored) ou dans les variables d'environnement (prod).

# Configuration du serveur
server.port=8080
server.forward-headers-strategy=FRAMEWORK

# Importer les secrets locaux (ignoré par Git, optionnel en prod)
spring.config.import=optional:file:src/main/resources/application-secrets.properties

# Configuration du profil actif (dev par défaut)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===== BASE DE DONNÉES POSTGRESQL =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lmp_db}
spring.datasource.username=${DB_USERNAME:lmp_dev}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP (Pool de connexions)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=LmpHikariPool

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== FLYWAY MIGRATIONS =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ===== THYMELEAF (utilisé uniquement pour les emails et pages d'erreur) =====
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Ressources statiques (favicon, images)
spring.web.resources.static-locations=classpath:/static/

# ===== LOGGING =====
logging.level.root=INFO
logging.level.com.lmp=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=WARN

# ===== STRIPE =====
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.api.version=2024-06-20
stripe.max.network.retries=3
stripe.connect.timeout=30000
stripe.read.timeout=80000

# Configuration Stripe Checkout (Angular frontend routes)
stripe.checkout.success.url=/payment/success
stripe.checkout.cancel.url=/payment/cancel

# ===== APPLICATION =====
app.base.url=${APP_BASE_URL:http://localhost:8080}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}
app.name=LMP Digital Services
app.version=1.0.1

# CORS — origines autorisées (patterns séparés par des virgules)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}

# OAuth2 Authorization Server
app.oauth2.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:8080}
app.oauth2.erpnext.client-id=${OAUTH2_ERPNEXT_CLIENT_ID:erpnext-client}
app.oauth2.erpnext.client-secret=${OAUTH2_ERPNEXT_CLIENT_SECRET:}
app.oauth2.erpnext.redirect-uri=${OAUTH2_ERPNEXT_REDIRECT_URI:http://localhost:8069/api/method/frappe.integrations.oauth2_logins.login_via_oauth2}

# Configuration des paiements
payment.default.currency=EUR
payment.max.amount=10000.00
payment.min.amount=1.00
payment.processing.timeout=300000

# ===== EMAIL (SMTP) =====
spring.mail.host=${SMTP_HOST:live.smtp.mailtrap.io}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:api}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

mail.from.name=${MAIL_FROM_NAME:LMP Digital Services}
mail.from.noreply=${MAIL_FROM_NOREPLY:noreply@localhost}
mail.from.support=${MAIL_FROM_SUPPORT:support@localhost}
mail.replyto.support=${MAIL_REPLYTO_SUPPORT:noreply@localhost}

# Mailtrap
mailtrap.api.token=${MAILTRAP_API_TOKEN:}
mailtrap.account.id=${MAILTRAP_ACCOUNT_ID:}

# ===== ENTREPRISE =====
company.name=${COMPANY_NAME:LMP Digital Services}
company.logo.path=${COMPANY_LOGO_PATH:/images/Logo LMP.png}
company.tagline=${COMPANY_TAGLINE:Marketing Digital & Solutions Web}
company.address=${COMPANY_ADDRESS:123 Rue Principale, Ville, Province, Code Postal}
company.phone=${COMPANY_PHONE:+1 (555) 123-4567}
company.email=${COMPANY_EMAIL:support@localhost}
company.website=${COMPANY_WEBSITE:http://localhost:8080}
company.city=${COMPANY_CITY:Ville, Province}

# Emails internes (équipe / admin)
company.team.email=${COMPANY_TEAM_EMAIL:support@localhost}
company.admin.email=${COMPANY_ADMIN_EMAIL:admin@localhost}

# ===== FACTURES =====
invoice.template.path=classpath:templates/invoices/
invoice.output.path=./invoices/
invoice.number.prefix=LMP-
invoice.due.days=30

# ===== SÉCURITÉ =====
security.password.min.length=8
security.max.login.attempts=5
security.account.lockout.duration=300000

# ===== NETTOYAGE COMMANDES =====
lmp.order.payment.pending.timeout.minutes=30
lmp.order.cancelled.retention.days=5

# ===== RÉCONCILIATION STRIPE =====
lmp.reconciliation.interval.ms=300000
lmp.reconciliation.pending.delay.minutes=2
lmp.reconciliation.cancelled.lookback.hours=24

# ===== INTERNATIONALISATION =====
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ===== SPRINGDOC OPENAPI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}

# ===== ACTUATOR =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
