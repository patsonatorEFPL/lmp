# =============================================
# LMP Digital Services — Configuration Commune
# =============================================
# Ce fichier contient UNIQUEMENT des valeurs non-sensibles et des références ${ENV_VAR}.
# Les secrets sont dans application-secrets.properties (gitignored) ou dans les variables d'environnement (prod).

# Configuration du serveur
server.port=8080
server.forward-headers-strategy=FRAMEWORK

# Les secrets locaux sont importés uniquement en dev (voir application-dev.properties)

# Configuration du profil actif (dev par défaut)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===== BASE DE DONNÉES POSTGRESQL =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lmp_db}
spring.datasource.username=${DB_USERNAME:lmp_dev}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP (Pool de connexions)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=LmpHikariPool

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== FLYWAY MIGRATIONS =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.repair-on-migrate=true

# ===== THYMELEAF (utilisé uniquement pour les emails et pages d'erreur) =====
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Ressources statiques (favicon, images)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ===== SESSION PERSISTENCE (PostgreSQL-backed sessions survive deployments) =====
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.table-name=SPRING_SESSION
server.servlet.session.timeout=24h
server.servlet.session.cookie.same-site=lax

# ===== LOGGING =====
logging.level.root=INFO
logging.level.com.lmp=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=WARN

# ===== STRIPE =====
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.api.version=2026-03-25.dahlia
stripe.max.network.retries=3
stripe.connect.timeout=30000
stripe.read.timeout=80000

# Configuration Stripe Checkout (Angular frontend routes)
stripe.checkout.success.url=/payment/success
stripe.checkout.cancel.url=/payment/cancel

# ===== SITE (source unique de vérité) =====
# Toutes les URLs et emails sont dérivés de cette valeur si non explicitement définis.
lmp.site.url=${SITE_URL:http://localhost:8080}

# ===== APPLICATION =====
app.name=LMP Digital Services
app.version=1.0.1

# OAuth2 Authorization Server — client satellite (déployé à part)
app.oauth2.external.client-id=${OAUTH2_EXTERNAL_CLIENT_ID:oauth-external-client}
app.oauth2.external.client-secret=${OAUTH2_EXTERNAL_CLIENT_SECRET:}
app.oauth2.external.redirect-uri=${OAUTH2_EXTERNAL_REDIRECT_URI:}

# Configuration des paiements
payment.default.currency=EUR
payment.max.amount=10000.00
payment.min.amount=1.00
payment.processing.timeout=300000

# ===== TARIFICATION RÉGIONALE (prix catalogue stockés en EUR) =====
# Pays : CF-IPCountry (Cloudflare) → GeoLite2 (geoip.country-db) → pricing.fallback-country.
pricing.base-currency=EUR
pricing.fallback-country=FR

# Taux de change automatiques via Frankfurter (BCE) — rafraîchi quotidiennement à 07h00 UTC.
# Les taux ci-dessous sont utilisés comme fallback si Frankfurter est indisponible.
pricing.fx.auto-refresh=true

# Marge FX appliquée sur le taux brut (ex. 0.015 = +1,5 %) — couvre le risque de change.
pricing.fx-margin=0.015

# Arrondi psychologique des prix (false = simple HALF_UP).
pricing.psychological-rounding=true

# GeoIP : chemin vers GeoLite2-Country.mmdb (optionnel, fallback si pas de CF-IPCountry).
geoip.country-db=
# geoip.country-test-override=CA

# Cache géolocalisation IP (Caffeine)
geoip.cache.max-size=10000
geoip.cache.ttl-minutes=15

# Grille par pays : devise + taux fallback (si Frankfurter est indisponible)
pricing.region.CA.currency=CAD
pricing.region.CA.eur-rate=1.48
pricing.region.US.currency=USD
pricing.region.US.eur-rate=1.09
pricing.region.GB.currency=GBP
pricing.region.GB.eur-rate=0.85

# ===== EMAIL (SMTP) =====
spring.mail.host=${SMTP_HOST:live.smtp.mailtrap.io}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:api}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

mail.from.name=${MAIL_FROM_NAME:LMP Digital Services}
mail.from.noreply=${MAIL_FROM_NOREPLY:noreply@lmp-services.ca}
mail.from.support=${MAIL_FROM_SUPPORT:support@lmp-services.ca}
# Les adresses email sont dérivées du host de lmp.site.url si non définies.

# Mailtrap
mailtrap.api.token=${MAILTRAP_API_TOKEN:}
mailtrap.account.id=${MAILTRAP_ACCOUNT_ID:}

# ===== ENTREPRISE =====
company.name=${COMPANY_NAME:LMP Digital Services}
company.logo.path=${COMPANY_LOGO_PATH:/images/Logo LMP.png}
company.tagline=${COMPANY_TAGLINE:Marketing Digital & Solutions Web}
company.address=${COMPANY_ADDRESS:123 Rue Principale, Ville, Province, Code Postal}
company.phone=${COMPANY_PHONE:+1 (555) 123-4567}
# company.email et company.website dérivés de lmp.site.url
company.city=${COMPANY_CITY:Ville, Province}

# Emails internes (équipe / admin)
# company.team.email et company.admin.email dérivés de lmp.site.url

# ===== TVA =====
# Taux de TVA applicable (0.20 = 20 %). Les prix catalogue (ServiceOffer.price) sont HT.
pricing.vat.rate=${PRICING_VAT_RATE:0.20}
# Optionnel — clé apilayer VATLayer (rate_list). Utilisé seulement si VATComply échoue au refresh.
# https://vatlayer.com/documentation — ne pas committer la clé en clair (env PRICING_VATLAYER_ACCESS_KEY).
pricing.vat.vatlayer.access-key=${PRICING_VATLAYER_ACCESS_KEY:}

# ===== FACTURES =====
invoice.template.path=classpath:templates/invoices/
invoice.output.path=./invoices/
invoice.number.prefix=LMP-
invoice.due.days=30

# ===== SÉCURITÉ =====
# Mot de passe admin : ADMIN_PASSWORD (variable d'environnement) prioritaire sur le hash en base.
# Bootstrap initial : ADMIN_PASSWORD obligatoire si aucun admin n'existe en base.
security.password.min.length=8
security.max.login.attempts=5
security.account.lockout.duration=300000

# ===== NETTOYAGE COMMANDES =====
lmp.order.payment.pending.timeout.minutes=30
lmp.order.cancelled.retention.days=5

# ===== RÉCONCILIATION STRIPE =====
lmp.reconciliation.interval.ms=300000
lmp.reconciliation.pending.delay.minutes=2
lmp.reconciliation.cancelled.lookback.hours=24

# ===== INTERNATIONALISATION =====
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ===== SPRINGDOC OPENAPI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.default-produces-media-type=application/json

# ===== FRAUD / VPN DETECTION =====
# GetIPIntel — email de contact obligatoire (plan gratuit 500 req/jour)
getipintel.contact-email=${GETIPINTEL_CONTACT_EMAIL:}
# IPHub — clé API (plan gratuit Basic 1000 req/jour)
iphub.api-key=${IPHUB_API_KEY:}

# ===== SYNCHRONISATION SYSTÈME EXTERNE (agnostique ERP) =====
# Désactivé par défaut — activer en staging/production
lmp.sync.enabled=${SYNC_ENABLED:false}

# Système externe — URLs et credentials
lmp.sync.external.base-url=${EXTERNAL_SYSTEM_URL:}
lmp.sync.external.api-key=${EXTERNAL_SYSTEM_API_KEY:}
lmp.sync.external.api-secret=${EXTERNAL_SYSTEM_API_SECRET:}
lmp.sync.external.currency=${EXTERNAL_SYSTEM_CURRENCY:EUR}
lmp.sync.external.company=${EXTERNAL_SYSTEM_COMPANY:LMP Services}
lmp.sync.external.tax-account=${EXTERNAL_SYSTEM_TAX_ACCOUNT:}
lmp.sync.external.tax-accounts.21=${EXTERNAL_SYSTEM_TAX_ACCOUNT_21:}
lmp.sync.external.tax-accounts.12=${EXTERNAL_SYSTEM_TAX_ACCOUNT_12:}
lmp.sync.external.tax-accounts.20=${EXTERNAL_SYSTEM_TAX_ACCOUNT_20:}
lmp.sync.external.auto-submit=${EXTERNAL_SYSTEM_AUTO_SUBMIT:true}

# Webhook inbound — secret HMAC pour validation
lmp.sync.webhook.hmac-secret=${WEBHOOK_HMAC_SECRET:}

# SSO ERP — client OAuth2 pour le staff (Social Login côté ERP)
# client-id : non-secret, identifiant de l'app côté Frappe ; commit-able
# client-secret : VRAI secret, env var seulement
# redirect-uri : dérivé de ${lmp.crm.url} par SiteEnvironmentPostProcessor (pas de binding explicite ici
#                pour ne pas shadower la dérivation). Override possible via APP_OAUTH2_ERP_REDIRECT_URI env var.
app.oauth2.erp.client-id=${ERP_OAUTH2_CLIENT_ID:frappe-erp-client}
app.oauth2.erp.client-secret=${ERP_OAUTH2_CLIENT_SECRET:}
app.oauth2.jwk.path=${OAUTH2_JWK_PATH:lmp-oauth2-jwk.json}

# URL publique de l'instance Frappe/CRM. Dérivée par SiteEnvironmentPostProcessor
# comme "crm.<host>" depuis SITE_URL. Override LMP_CRM_URL pour Frappe partagée
# (ex. staging utilise crm.lmp-services.ca au lieu du dérivé crm.dev.lmp-services.ca).
lmp.crm.url=${LMP_CRM_URL:}

# Issuer URI pour OAuth2/OIDC : NON BINDÉ ici intentionnellement.
# Dérivé comme https://auth.<host> depuis ${lmp.site.url} par SiteEnvironmentPostProcessor.
# Override possible via env var APP_OAUTH2_ISSUER_URI (relaxed binding Spring) ou en profile.
# La legacy env var OAUTH2_ISSUER_URI n'est plus lue — à supprimer côté Dokploy.

# Feature flags — activer/désactiver par domaine
lmp.sync.features.user-provisioning=true
lmp.sync.features.catalog-sync=true
lmp.sync.features.order-sync=true
lmp.sync.features.project-sync=true
lmp.sync.features.ticket-sync=true

# Retry — paramètres de reprise sur échec
lmp.sync.retry.max-attempts=5
lmp.sync.retry.delay-seconds=60

# Queue FIFO — paramètres du processor
lmp.sync.queue.batch-size=10
lmp.sync.queue.poll-interval-ms=5000

# Réconciliation périodique — backoff incrémental 30s → 15min
lmp.sync.reconciliation.enabled=false
lmp.sync.reconciliation.initial-interval-seconds=30
lmp.sync.reconciliation.max-interval-seconds=900
lmp.sync.reconciliation.increment-seconds=30

# Monitoring & Alerting de synchronisation
lmp.sync.monitor.interval-ms=300000
lmp.sync.alert.enabled=true
lmp.sync.alert.dead.threshold=1
lmp.sync.alert.failed-stale.threshold=5
lmp.sync.alert.unverified.threshold=3
lmp.sync.alert.unknown-error=true
lmp.sync.alert.cooldown-minutes=60
# lmp.sync.alert.admin-email dérivé de lmp.site.url
lmp.sync.alert.webhook-url=${SYNC_ALERT_WEBHOOK_URL:}
lmp.sync.alert.sentry-dsn=${SENTRY_DSN:}
lmp.sync.alert.sentry-environment=${SENTRY_ENVIRONMENT:production}

# Purge scheduler (hard delete old sync data)
lmp.sync.purge.enabled=true
lmp.sync.purge.cron=0 0 3 * * *
lmp.sync.purge.retention-days=90

# Resilience4j Circuit Breaker — ERP client
resilience4j.circuitbreaker.configs.erp.register-health-indicator=true
resilience4j.circuitbreaker.configs.erp.sliding-window-size=10
resilience4j.circuitbreaker.configs.erp.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.erp.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.erp.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.erp.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.erp.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.erp.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.erp.base-config=erp

# Spring Cache — Caffeine for ERP aggregates
spring.cache.cache-names=erp-aggregates
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60s

# ===== GRACEFUL SHUTDOWN =====
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ===== ACTUATOR =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
