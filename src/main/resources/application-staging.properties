# =============================================
# LMP — Profil STAGING (Test)
# =============================================
# Instance de test pré-production avec clés Stripe test.
# Tous les secrets sont injectés via variables d'environnement.

# ===== SERVEUR =====
server.port=${PORT:8080}
server.forward-headers-strategy=FRAMEWORK

# ===== BASE DE DONNÉES POSTGRESQL =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lmp_test_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP (Pool de connexions — staging, moins agressif que prod)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=LmpHikariPool-Staging
# SSL désactivé — PostgreSQL en conteneur interne sans cert TLS configuré
spring.datasource.hikari.data-source-properties.sslmode=disable

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.repair-on-migrate=true

# ===== THYMELEAF =====
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Ressources statiques
spring.web.resources.static-locations=classpath:/static/

# DevTools désactivé
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ===== LOGGING (plus verbose qu'en prod pour debugging) =====
# logging.level.com.lmp=DEBUG + org.hibernate.SQL=DEBUG ont coûté ~30-40% CPU sous
# load test : chaque INSERT/SELECT formate une string complète + écrit synchrone.
# Repassés à INFO. Activer via env var LOGGING_LEVEL_COM_LMP=DEBUG si besoin.
logging.level.root=INFO
logging.level.com.lmp=${LOG_LEVEL_LMP:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE_SQL:INFO}
# Bruit SMTP/ERP : ces composants gèrent l'erreur fonctionnellement; on ne perd
# rien en WARN (40k+ stacktraces sous load test sinon).
logging.level.com.lmp.auth.service.AuthServiceImpl=WARN
logging.level.com.lmp.integration.event.ErpEventListener=WARN
logging.level.org.springframework.mail=WARN
# Désactive le RequestLoggingFilter sous load. Active via DIAGNOSTIC_LOGGING=DEBUG
# en cas d'investigation X-Forwarded-* / CORS.
logging.level.DIAGNOSTIC=${DIAGNOSTIC_LOGGING:WARN}

# ===== STRIPE (TEST KEYS via ${ENV_VAR}) =====
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
stripe.api.version=2024-06-20
stripe.max.network.retries=3
stripe.connect.timeout=30000
stripe.read.timeout=80000

# Configuration Stripe Checkout (Angular SPA routes)
stripe.checkout.success.url=/payment/success
stripe.checkout.cancel.url=/payment/cancel

# ===== EMAIL (SMTP — staging cible MailHog catch-all par défaut) =====
# MailHog SMTP n'exige ni auth ni TLS. Pour pointer un autre relais SMTP en
# staging (Gmail, Brevo, etc.), surcharger SMTP_AUTH=true / SMTP_STARTTLS=true
# via env vars Dokploy.
spring.mail.host=${SMTP_HOST:lmp-mailhog}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Mailtrap
mailtrap.api.token=${MAILTRAP_API_TOKEN:}
mailtrap.account.id=${MAILTRAP_ACCOUNT_ID:}

# ===== SITE (source unique de vérité) =====
lmp.site.url=${SITE_URL:http://localhost:8080}

# ===== ADRESSES EMAIL =====
mail.from.name=LMP Digital Services (TEST)
mail.from.noreply=${MAIL_FROM_NOREPLY:noreply@lmp-services.ca}
mail.from.support=${MAIL_FROM_SUPPORT:support@lmp-services.ca}
mail.from.contact=${MAIL_FROM_CONTACT:info@lmp-services.ca}
# Les adresses email sont dérivées du host de lmp.site.url si non définies.

# ===== APPLICATION =====
app.name=${APP_NAME:LMP Digital Services (TEST)}
app.version=1.0.1-staging

# OAuth2 Social Login (Google / Microsoft)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:MISSING}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:MISSING}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID:MISSING}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:MISSING}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.client-name=Microsoft
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-name-attribute=email

# app.frontend.url volontairement non-défini → cascade @Value vers app.base.url
# (= SITE_URL dérivé). FrontendRedirectController détecte le mode monolithique
# en comparant frontendUrl == baseUrl. Templates Thymeleaf utilisent ${frontendUrl}
# avec la valeur cascade complète (URL absolue OK pour les liens emails).

# OAuth2 Authorization Server
# issuer-uri + erp.redirect-uri sont dérivés par SiteEnvironmentPostProcessor depuis
# lmp.site.url + lmp.crm.url. Override via env var (OAUTH2_ISSUER_URI, ERP_OAUTH2_REDIRECT_URI)
# si nécessaire (ex. external CRM partagée pointée par LMP_CRM_URL).
app.oauth2.jwk.path=${OAUTH2_JWK_PATH:./lmp-oauth2-jwk-staging.json}

# Configuration des paiements
payment.default.currency=EUR
payment.max.amount=10000.00
payment.min.amount=1.00
payment.processing.timeout=300000

# ===== ENTREPRISE =====
company.name=${COMPANY_NAME:LMP Digital Services}
company.logo.path=${COMPANY_LOGO_PATH:/images/Logo LMP.png}
company.tagline=${COMPANY_TAGLINE:Marketing Digital & Solutions Web}
company.address=${COMPANY_ADDRESS:123 Rue Principale, Ville, Province, Code Postal}
company.phone=${COMPANY_PHONE:+1 (555) 123-4567}
# company.email et company.website dérivés de lmp.site.url
company.city=${COMPANY_CITY:Ville, Province}

# Emails internes dérivés de lmp.site.url

# ===== FACTURES =====
invoice.template.path=classpath:templates/invoices/
invoice.output.path=./invoices/
invoice.number.prefix=LMP-TEST-
invoice.due.days=30

# ===== SÉCURITÉ =====
security.password.min.length=8
security.max.login.attempts=5
security.account.lockout.duration=300000

# ===== SESSIONS =====
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
# same-site=lax (single-host monolith, plus de cross-subdomain auth.* à supporter).
# Si external CRM SSO requiert cross-site (crm.* ↔ site), repasser à none.
server.servlet.session.cookie.same-site=lax

# ===== COMPRESSION =====
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ===== THREADS =====
# Virtual threads (spring.threads.virtual.enabled) testés sur ce workload
# CPU-bound (bcrypt domine) : régression mesurée -67% RPS / +4× p95 sur bench
# 50 VUs. Re-tester quand on aura déplacé bcrypt hors du thread requête
# (queue async + 202 Accepted) ou retiré 2 cores supplémentaires.
# spring.threads.virtual.enabled=true

# ===== INTERNATIONALISATION =====
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ===== SWAGGER UI (activé en staging pour tests) =====
springdoc.swagger-ui.enabled=true

# ===== ACTUATOR =====
# Staging = canary de prod. Mêmes endpoints que prod + info/metrics pour debug.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoint.prometheus.access=read_only

# ===== MICROMETER (tags globaux — pas de tags par tenant/user) =====
management.metrics.tags.application=lmp-backend
management.metrics.tags.env=staging

# ===== METRICS BASIC AUTH (Prometheus scrape) =====
lmp.metrics.basic-auth.username=${PROMETHEUS_BASIC_USER:prometheus}
lmp.metrics.basic-auth.password=${PROMETHEUS_BASIC_PASS:}
