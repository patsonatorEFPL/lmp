# ========================================
# CONFIGURATION PRODUCTION - LMP SERVICES  
# ========================================

# Configuration du serveur
server.port=${PORT:8080}
server.forward-headers-strategy=FRAMEWORK

# Configuration du profil actif
# Note: spring.profiles.active ne peut pas être dans un fichier profile-specific
# Le profil sera activé lors du démarrage avec --spring.profiles.active=production

# Configuration de la base de données (utilise les valeurs de Cooliffy)
spring.datasource.url=jdbc:mysql://mysql:1GBYR8g3wFlPTIsX2oGyPlYwMpgpjib1FRPCQF3kgtKRbhdTJ7YhmuZsYAuIuYxi@179.61.246.91:5432/default
spring.datasource.username=mysql
spring.datasource.password=1GBYR8g3wFlPTIsX2oGyPlYwMpgpjib1FRPCQF3kgtKRbhdTJ7YhmuZsYAuIuYxi
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration HikariCP optimisée pour production
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=LmpHikariPool-Prod

# Configuration JPA/Hibernate pour production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Configuration Flyway désactivée (gestion manuelle en production)
spring.flyway.enabled=false

# Configuration Thymeleaf pour production (cache activé)
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Configuration des ressources statiques
spring.web.resources.static-locations=classpath:/static/

# DevTools désactivé en production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ========================================
# CONFIGURATION SMTP MAILTRAP PRODUCTION
# ========================================

# Configuration SMTP Mailtrap Live (valeurs concrètes)
spring.mail.host=live.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=api
spring.mail.password=***MAILTRAP_TOKEN_REMOVED***

# Propriétés SMTP optimisées pour production
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=live.smtp.mailtrap.io
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false

# ========================================
# CONFIGURATION DES ADRESSES EMAIL
# ========================================

# Nom de l'expéditeur
mail.from.name=LMP Digital Services

# Adresses email professionnelles (domaine lmp-services.ca)
mail.from.noreply=noreply@lmp-services.ca
mail.from.support=support@lmp-services.ca
mail.replyto.support=support@lmp-services.ca

# Configuration Mailtrap API (pour statistiques et gestion avancée)
mailtrap.api.token=***MAILTRAP_TOKEN_REMOVED***
mailtrap.account.id=YOUR_MAILTRAP_ACCOUNT_ID_HERE

# ========================================
# LOGGING PRODUCTION (Optimisé)
# ========================================

# Logs de base (niveau INFO)
logging.level.root=INFO
logging.level.com.lmp=INFO

# Logs spécialisés pour surveillance
logging.level.com.lmp.service.email=INFO
logging.level.com.lmp.web.controller=WARN
logging.level.org.springframework.mail=WARN

# Désactiver les logs de développement
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Logs de diagnostic essentiels
logging.level.SECURITY=INFO
logging.level.DIAGNOSTIC=INFO

# ========================================
# CONFIGURATION STRIPE PRODUCTION
# ========================================

# Clés Stripe LIVE (valeurs concrètes)
stripe.secret.key=***STRIPE_LIVE_SECRET_KEY_REMOVED***
stripe.publishable.key=***STRIPE_LIVE_PUBLISHABLE_KEY_REMOVED***
stripe.webhook.secret=***STRIPE_LIVE_WEBHOOK_SECRET_REMOVED***
stripe.api.version=2023-10-16
stripe.max.network.retries=3
stripe.connect.timeout=30000
stripe.read.timeout=80000

# URLs de redirection Stripe
stripe.checkout.success.url=/stripe/checkout/success
stripe.checkout.cancel.url=/stripe/checkout/cancel

# ========================================
# CONFIGURATION APPLICATION
# ========================================

# URLs et informations de base
app.base.url=https://lmp-services.ca
app.name=LMP Digital Services
app.version=1.0.1

# Configuration paiements
payment.default.currency=CAD
payment.max.amount=10000.00
payment.min.amount=1.00
payment.processing.timeout=300000

# Configuration entreprise
company.name=LMP Digital Services
company.logo.path=/images/Logo LMP.png
company.address=123 Rue Principale, Ville, Province, Code Postal
company.phone=+1 (555) 123-4567
company.email=support@lmp-services.ca
company.website=https://lmp-services.ca

# Configuration factures
invoice.template.path=classpath:templates/invoices/
invoice.output.path=./invoices/
invoice.number.prefix=LMP-
invoice.due.days=30

# ========================================
# SÉCURITÉ PRODUCTION
# ========================================

# JWT Configuration (valeur concrète)
security.jwt.secret=mySecretKey123456789012345678901234567890
security.jwt.expiration=86400000

# Configuration sécurité des mots de passe
security.password.min.length=8
security.max.login.attempts=5
security.account.lockout.duration=300000

# ========================================
# INTERNATIONALISATION
# ========================================

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ========================================
# MONITORING ET PERFORMANCE
# ========================================

# Configuration JPA pour production
spring.jpa.open-in-view=false

# Configuration des sessions
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Configuration de compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
