# =============================================
# LMP — Profil DEV (développement local)
# =============================================
# La base de données est fournie par Testcontainers (PostgreSQL éphémère).
# Lancer via : mvn spring-boot:test-run  (ou exécuter TestLmpApplication depuis l'IDE)

server.port=8080

# ===== BASE DE DONNÉES =====
# PAS de datasource configuré ici — Testcontainers fournit un PostgreSQL éphémère
# via @ServiceConnection dans TestcontainersConfiguration.java

# ===== JPA / HIBERNATE =====
# En dev, utiliser 'update' pour laisser Hibernate synchroniser le schéma
# après que Flyway ait créé les tables de base
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== THYMELEAF (pas de cache en dev) =====
spring.thymeleaf.cache=false

# ===== DEVTOOLS =====
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ===== LOGGING (verbose en dev) =====
logging.level.com.lmp=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===== STRIPE (TEST KEYS — depuis application-secrets.properties) =====
stripe.api.version=2024-06-20

# ===== APPLICATION =====
app.base.url=http://localhost:8080

# ===== OAUTH2 =====
# Les identifiants Google/Microsoft OAuth2 sont dans application-secrets.properties
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Microsoft OAuth2
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.client-name=Microsoft
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-name-attribute=email

# ===== ENTREPRISE (dev) =====
company.website=http://localhost:8080

# ===== SWAGGER UI (activé en dev) =====
springdoc.swagger-ui.enabled=true
