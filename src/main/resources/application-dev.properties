# =============================================
# LMP — Profil DEV (développement local)
# =============================================
# Base PostgreSQL persistante : docker compose -f docker-compose.dev.yml up -d
# (volume lmp-dev-pgdata — les données survivent aux redémarrages du conteneur et de Spring Boot).
#
# Optionnel — PostgreSQL éphémère (Testcontainers) : LMP_DEV_TESTCONTAINERS=true
# puis lancer TestLmpApplication ou : ./mvnw spring-boot:test-run

server.port=8080

# ===== BASE DE DONNÉES =====
# 127.0.0.1 : sur Windows, « localhost » peut résoudre en ::1 et atteindre wslrelay:5433 au lieu du port publié Docker.
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/lmp_db}
spring.datasource.username=${DB_USERNAME:lmp_dev}
spring.datasource.password=${DB_PASSWORD:lmp_dev_local}

# ===== JPA / HIBERNATE =====
# En dev, utiliser 'update' pour laisser Hibernate synchroniser le schéma
# après que Flyway ait créé les tables de base
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== THYMELEAF (pas de cache en dev) =====
spring.thymeleaf.cache=false

# ===== DEVTOOLS =====
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ===== LOGGING (verbose en dev) =====
logging.level.com.lmp=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===== STRIPE (TEST KEYS — depuis application-secrets.properties) =====
stripe.api.version=2026-03-25.dahlia

# ===== APPLICATION =====
app.base.url=http://localhost:8080
app.frontend.url=http://localhost:4200

# ===== OAUTH2 =====
# Les identifiants Google/Microsoft OAuth2 sont dans application-secrets.properties
# En dev, les placeholders ci-dessous permettent le démarrage sans application-secrets.properties.
# L'authentification OAuth2 ne fonctionnera pas sans de vrais client-id/client-secret.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-placeholder}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Microsoft OAuth2
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID:dev-placeholder}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:dev-placeholder}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.client-name=Microsoft
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-name-attribute=email

# ===== ENTREPRISE (dev) =====
company.website=http://localhost:8080

# ===== SWAGGER UI (activé en dev) =====
springdoc.swagger-ui.enabled=true

# ===== SIMULATION PAYS / DEVISE (dev uniquement) =====
