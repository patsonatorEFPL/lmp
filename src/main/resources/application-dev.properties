# Configuration de développement local avec base de données H2
# Pour activer : java -jar app.jar --spring.profiles.active=dev
# Ou variable d'environnement : SPRING_PROFILES_ACTIVE=dev

# Configuration du serveur pour développement
server.port=8080

# Configuration de la base de données H2 en mémoire (pour développement local)
spring.datasource.url=jdbc:h2:mem:lmptestdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuration HikariCP (Pool de connexions)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=LmpHikariPool

# Configuration de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Activer H2 Console pour le développement
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuration de Flyway pour le développement local
# Comment out Flyway for in-memory database to avoid conflicts
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=true
# spring.flyway.validate-on-migrate=true
# spring.flyway.clean-on-validation-error=true
spring.flyway.enabled=false

# Configuration Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Configuration des ressources statiques
spring.web.resources.static-locations=classpath:/static/

# Configuration de developpement
spring.devtools.restart.enabled=true

# Configuration Spring DevTools
spring.devtools.livereload.enabled=true

# Logging pour le developpement et debugging authentification
logging.level.com.lmp=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# LOGS DE DIAGNOSTIC - CONFIGURATION ACTIVE
logging.level.org.springframework.boot.context.config=DEBUG
logging.level.org.springframework.core.env=DEBUG
logging.level.org.springframework.context=DEBUG

# Configuration Stripe (TEST KEYS - a remplacer en production)
stripe.secret.key=***STRIPE_SECRET_KEY_REMOVED***
stripe.publishable.key=***STRIPE_PUBLISHABLE_KEY_REMOVED***
stripe.webhook.secret=***STRIPE_WEBHOOK_SECRET_REMOVED***
stripe.api.version=2024-06-20
stripe.max.network.retries=3
stripe.connect.timeout=30000
stripe.read.timeout=80000

# Configuration Stripe Checkout
stripe.checkout.success.url=/stripe/checkout/processing
stripe.checkout.cancel.url=/stripe/checkout/cancel

# Configuration de l'application
app.base.url=http://localhost:8080
app.name=LMP Digital Services
app.version=1.0.1

# Configuration des paiements
payment.default.currency=EUR
payment.max.amount=10000.00
payment.min.amount=1.00
payment.processing.timeout=300000

# Configuration SMTP Mailtrap pour domaine lmp-services.ca (copié de production)
spring.mail.host=live.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=api
spring.mail.password=***MAILTRAP_TOKEN_REMOVED***
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=live.smtp.mailtrap.io
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Configuration additionnelle pour Mailtrap
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false

# Configuration expéditeur par défaut
mail.from.name=LMP Digital Services

# ===== CONFIGURATION EMAIL ROUTING CLOUDFLARE (DEV) =====
# Adresses visibles par les clients (routing Cloudflare vers lmp.assistance@gmail.com)
mail.from.noreply=noreply@lmp-services.ca
mail.from.support=support@lmp-services.ca
mail.replyto.support=support@lmp-services.ca

# Configuration de l'entreprise
company.name=LMP Digital Services
company.logo.path=/images/Logo LMP.png
company.address=123 Rue Principale, Ville, Province, Code Postal
company.phone=+1 (555) 123-4567
company.email=support@lmp-services.ca
company.website=http://localhost:8080

# Configuration des factures
invoice.template.path=classpath:templates/invoices/
invoice.output.path=./invoices/
invoice.number.prefix=LMP-
invoice.due.days=30

# Configuration de la securite avancee
security.jwt.secret=mySecretKey123456789012345678901234567890
security.jwt.expiration=86400000
security.password.min.length=8
security.max.login.attempts=5
security.account.lockout.duration=300000

# Configuration de nettoyage des commandes
# Temps maximum (en minutes) avant qu'une commande PAYMENT_PENDING soit annulée automatiquement
lmp.order.payment.pending.timeout.minutes=30

# ===== CONFIGURATION OAUTH2 =====
# Google OAuth2 (remplacer par vos identifiants Google Cloud Console)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-client-id-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Microsoft OAuth2 (remplacer par vos identifiants Azure AD)
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID:microsoft-client-id-placeholder}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:microsoft-client-secret-placeholder}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.client-name=Microsoft
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-name-attribute=email
