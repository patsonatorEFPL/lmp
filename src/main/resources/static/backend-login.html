<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion LMP</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 360px;
        }
        h1 {
            margin: 0 0 1.5rem;
            font-size: 1.5rem;
            text-align: center;
            color: #f8fafc;
        }
        label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.875rem;
            color: #94a3b8;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 0.65rem;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            background: #3b82f6;
            color: white;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
        }
        button:hover {
            background: #2563eb;
        }
        .error {
            color: #ef4444;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Connexion LMP</h1>
        <p style="text-align:center; color:#94a3b8; font-size:0.875rem; margin-bottom:1.5rem;">
            SSO — Authentification requise
        </p>
        <form action="/perform-login" method="post">
            <label for="email">Adresse email</label>
            <input type="email" id="email" name="email" required autofocus>

            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Se connecter</button>
        </form>
    </div>
</body>
</html>
