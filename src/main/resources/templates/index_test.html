<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[#{home.title}]] - Test LMP i18n</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <!-- Header Simple -->
    <header class="bg-white shadow-sm p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600">LMP</h1>
            <div class="flex items-center space-x-4">
                <a href="?lang=fr" class="text-lg" th:classappend="${#locale.language == 'fr' ? 'opacity-100' : 'opacity-50'}">🇫🇷</a>
                <a href="?lang=en" class="text-lg" th:classappend="${#locale.language == 'en' ? 'opacity-100' : 'opacity-50'}">🇺🇸</a>
            </div>
        </div>
    </header>
        <section class="py-16 bg-white">
            <div class="container mx-auto px-4">
                <div class="text-center">
                    <h1 class="text-4xl font-bold text-gray-800 mb-4" th:text="#{home.title}">
                        Services de Marketing Digital Local
                    </h1>
                    <p class="text-lg text-gray-600 mb-8" th:text="#{home.subtitle}">
                        Boostez votre visibilité sur Google Maps et attirez plus de clients locaux
                    </p>
                    <div class="space-y-4">
                        <p><strong>Langue actuelle:</strong> <span th:text="${#locale.language}">fr</span></p>
                        <p><strong>Tests de navigation:</strong></p>
                        <nav class="space-x-4">
                            <span th:text="#{nav.home}">Accueil</span> |
                            <span th:text="#{nav.services}">Services</span> |
                            <span th:text="#{nav.contact}">Contact</span> |
                            <span th:text="#{nav.about}">À propos</span>
                        </nav>
                    </div>
                </div>
            </div>
        </section>
        
        <!-- Footer Simple -->
        <footer class="bg-gray-800 text-white p-4 mt-8">
            <div class="container mx-auto text-center">
                <p>&copy; 2025 LMP Digital Services - Test Internationalisation</p>
                <p class="text-sm mt-2">Langue active: <span th:text="${#locale.language}">fr</span></p>
            </div>
        </footer>
    </body>
</html>
