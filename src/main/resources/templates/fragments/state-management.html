<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>State Management & API Integration</title>
</head>
<body>

<!-- State Management Fragment -->
<div th:fragment="state-manager">
    <script>
        // Modern State Management System for LMP Dashboard
        class LMPStateManager {
            constructor() {
                this.state = {
                    user: null,
                    orders: [],
                    reviews: [],
                    dashboard: {
                        stats: {},
                        charts: {},
                        notifications: []
                    },
                    ui: {
                        loading: false,
                        activeView: 'dashboard',
                        sidebarCollapsed: false,
                        theme: 'light'
                    },
                    cache: new Map(),
                    notifications: []
                };
                
                this.subscribers = new Map();
                this.middleware = [];
                this.api = new LMPApiClient();
                this.initialize();
            }

            // State Management Core
            initialize() {
                this.loadPersistedState();
                this.setupEventListeners();
                this.startAutoSync();
                console.log('LMP State Manager initialized');
            }

            subscribe(path, callback) {
                if (!this.subscribers.has(path)) {
                    this.subscribers.set(path, new Set());
                }
                this.subscribers.get(path).add(callback);
                
                // Return unsubscribe function
                return () => {
                    const subs = this.subscribers.get(path);
                    if (subs) {
                        subs.delete(callback);
                    }
                };
            }

            setState(path, value) {
                const oldValue = this.getState(path);
                this.setNestedValue(this.state, path, value);
                
                // Apply middleware
                this.middleware.forEach(fn => fn(path, value, oldValue));
                
                // Notify subscribers
                this.notifySubscribers(path, value, oldValue);
                
                // Persist important state changes
                this.persistState();
            }

            getState(path) {
                return this.getNestedValue(this.state, path);
            }

            setNestedValue(obj, path, value) {
                const keys = path.split('.');
                let current = obj;
                
                for (let i = 0; i < keys.length - 1; i++) {
                    if (!(keys[i] in current)) {
                        current[keys[i]] = {};
                    }
                    current = current[keys[i]];
                }
                
                current[keys[keys.length - 1]] = value;
            }

            getNestedValue(obj, path) {
                return path.split('.').reduce((current, key) => {
                    return current && current[key] !== undefined ? current[key] : null;
                }, obj);
            }

            notifySubscribers(path, newValue, oldValue) {
                // Notify exact path subscribers
                const subscribers = this.subscribers.get(path);
                if (subscribers) {
                    subscribers.forEach(callback => {
                        try {
                            callback(newValue, oldValue, path);
                        } catch (error) {
                            console.error('Error in state subscriber:', error);
                        }
                    });
                }

                // Notify parent path subscribers
                const pathParts = path.split('.');
                for (let i = pathParts.length - 1; i > 0; i--) {
                    const parentPath = pathParts.slice(0, i).join('.');
                    const parentSubscribers = this.subscribers.get(parentPath);
                    if (parentSubscribers) {
                        parentSubscribers.forEach(callback => {
                            try {
                                callback(this.getState(parentPath), oldValue, parentPath);
                            } catch (error) {
                                console.error('Error in parent state subscriber:', error);
                            }
                        });
                    }
                }
            }

            // Middleware
            addMiddleware(fn) {
                this.middleware.push(fn);
            }

            // Persistence
            persistState() {
                const persistData = {
                    ui: this.state.ui,
                    user: this.state.user ? {
                        id: this.state.user.id,
                        preferences: this.state.user.preferences
                    } : null
                };
                
                try {
                    localStorage.setItem('lmp_state', JSON.stringify(persistData));
                } catch (error) {
                    console.warn('Failed to persist state:', error);
                }
            }

            loadPersistedState() {
                try {
                    const saved = localStorage.getItem('lmp_state');
                    if (saved) {
                        const data = JSON.parse(saved);
                        Object.assign(this.state.ui, data.ui || {});
                        if (data.user) {
                            this.state.user = { ...this.state.user, ...data.user };
                        }
                    }
                } catch (error) {
                    console.warn('Failed to load persisted state:', error);
                }
            }

            // Cache Management
            setCache(key, data, ttl = 300000) { // 5 minutes default
                this.state.cache.set(key, {
                    data,
                    timestamp: Date.now(),
                    ttl
                });
            }

            getCache(key) {
                const cached = this.state.cache.get(key);
                if (!cached) return null;
                
                if (Date.now() - cached.timestamp > cached.ttl) {
                    this.state.cache.delete(key);
                    return null;
                }
                
                return cached.data;
            }

            clearCache(pattern) {
                if (pattern) {
                    for (const key of this.state.cache.keys()) {
                        if (key.includes(pattern)) {
                            this.state.cache.delete(key);
                        }
                    }
                } else {
                    this.state.cache.clear();
                }
            }

            // Event Listeners
            setupEventListeners() {
                // Listen for online/offline status
                window.addEventListener('online', () => {
                    this.setState('ui.online', true);
                    this.syncOfflineActions();
                });

                window.addEventListener('offline', () => {
                    this.setState('ui.online', false);
                });

                // Listen for visibility changes
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) {
                        this.refreshData();
                    }
                });

                // Listen for storage changes (multi-tab sync)
                window.addEventListener('storage', (e) => {
                    if (e.key === 'lmp_state') {
                        this.loadPersistedState();
                    }
                });
            }

            // Auto-sync
            startAutoSync() {
                setInterval(() => {
                    if (navigator.onLine && !document.hidden) {
                        this.refreshData(true); // Silent refresh
                    }
                }, 30000); // Every 30 seconds
            }

            // Data Refresh
            async refreshData(silent = false) {
                try {
                    if (!silent) {
                        this.setState('ui.loading', true);
                    }

                    // Refresh user data
                    await this.loadUserData();
                    
                    // Refresh dashboard stats
                    await this.loadDashboardStats();
                    
                    // Refresh orders if on orders page
                    if (this.state.ui.activeView === 'orders') {
                        await this.loadOrders();
                    }

                    // Refresh reviews if on reviews page
                    if (this.state.ui.activeView === 'reviews') {
                        await this.loadReviews();
                    }

                } catch (error) {
                    console.error('Failed to refresh data:', error);
                    this.addNotification('error', 'Erreur lors de la mise à jour des données');
                } finally {
                    if (!silent) {
                        this.setState('ui.loading', false);
                    }
                }
            }

            // Data Loaders
            async loadUserData() {
                try {
                    const cached = this.getCache('user');
                    if (cached) {
                        this.setState('user', cached);
                        return;
                    }

                    const userData = await this.api.get('/api/user/profile');
                    this.setState('user', userData);
                    this.setCache('user', userData);
                } catch (error) {
                    console.error('Failed to load user data:', error);
                }
            }

            async loadDashboardStats() {
                try {
                    const cached = this.getCache('dashboard_stats');
                    if (cached) {
                        this.setState('dashboard.stats', cached);
                        return;
                    }

                    const stats = await this.api.get('/api/dashboard/stats');
                    this.setState('dashboard.stats', stats);
                    this.setCache('dashboard_stats', stats, 60000); // 1 minute cache
                } catch (error) {
                    console.error('Failed to load dashboard stats:', error);
                }
            }

            async loadOrders(page = 1, filters = {}) {
                try {
                    this.setState('ui.loading', true);
                    
                    const cacheKey = `orders_${page}_${JSON.stringify(filters)}`;
                    const cached = this.getCache(cacheKey);
                    if (cached) {
                        this.setState('orders', cached);
                        return;
                    }

                    const orders = await this.api.get('/api/orders', { page, ...filters });
                    this.setState('orders', orders);
                    this.setCache(cacheKey, orders);
                } catch (error) {
                    console.error('Failed to load orders:', error);
                    this.addNotification('error', 'Erreur lors du chargement des commandes');
                } finally {
                    this.setState('ui.loading', false);
                }
            }

            async loadReviews(page = 1) {
                try {
                    this.setState('ui.loading', true);
                    
                    const cacheKey = `reviews_${page}`;
                    const cached = this.getCache(cacheKey);
                    if (cached) {
                        this.setState('reviews', cached);
                        return;
                    }

                    const reviews = await this.api.get('/api/reviews', { page });
                    this.setState('reviews', reviews);
                    this.setCache(cacheKey, reviews);
                } catch (error) {
                    console.error('Failed to load reviews:', error);
                    this.addNotification('error', 'Erreur lors du chargement des avis');
                } finally {
                    this.setState('ui.loading', false);
                }
            }

            // Actions
            async updateProfile(profileData) {
                try {
                    this.setState('ui.loading', true);
                    
                    const updatedUser = await this.api.put('/api/user/profile', profileData);
                    this.setState('user', updatedUser);
                    this.clearCache('user');
                    
                    this.addNotification('success', 'Profil mis à jour avec succès');
                    return updatedUser;
                } catch (error) {
                    console.error('Failed to update profile:', error);
                    this.addNotification('error', 'Erreur lors de la mise à jour du profil');
                    throw error;
                } finally {
                    this.setState('ui.loading', false);
                }
            }

            async createReview(orderIdreak, reviewData) {
                try {
                    this.setState('ui.loading', true);
                    
                    const newReview = await this.api.post('/api/reviews', {
                        orderId,
                        ...reviewData
                    });
                    
                    // Update local state
                    const currentReviews = this.getState('reviews') || [];
                    this.setState('reviews', [newReview, ...currentReviews]);
                    
                    this.clearCache('reviews');
                    this.addNotification('success', 'Avis publié avec succès');
                    return newReview;
                } catch (error) {
                    console.error('Failed to create review:', error);
                    this.addNotification('error', 'Erreur lors de la publication de l\'avis');
                    throw error;
                } finally {
                    this.setState('ui.loading', false);
                }
            }

            async cancelOrder(orderId) {
                try {
                    this.setState('ui.loading', true);
                    
                    await this.api.put(`/api/orders/${orderId}/cancel`);
                    
                    // Update local state
                    const orders = this.getState('orders') || [];
                    const updatedOrders = orders.map(order => 
                        order.id === orderId 
                            ? { ...order, status: 'CANCELLED' }
                            : order
                    );
                    this.setState('orders', updatedOrders);
                    
                    this.clearCache('orders');
                    this.addNotification('success', 'Commande annulée avec succès');
                } catch (error) {
                    console.error('Failed to cancel order:', error);
                    this.addNotification('error', 'Erreur lors de l\'annulation de la commande');
                    throw error;
                } finally {
                    this.setState('ui.loading', false);
                }
            }

            // Notifications
            addNotification(type, message, duration = 5000) {
                const notification = {
                    id: Date.now() + Math.random(),
                    type,
                    message,
                    timestamp: Date.now()
                };
                
                const notifications = [...this.getState('notifications'), notification];
                this.setState('notifications', notifications);
                
                // Auto-remove after duration
                setTimeout(() => {
                    this.removeNotification(notification.id);
                }, duration);
                
                return notification.id;
            }

            removeNotification(id) {
                const notifications = this.getState('notifications').filter(n => n.id !== id);
                this.setState('notifications', notifications);
            }

            // Offline Actions
            syncOfflineActions() {
                // Implementation for syncing actions performed while offline
                console.log('Syncing offline actions...');
            }

            // UI Helpers
            setActiveView(view) {
                this.setState('ui.activeView', view);
                this.clearCache(`${view}_`); // Clear view-specific cache
            }

            toggleSidebar() {
                const collapsed = !this.getState('ui.sidebarCollapsed');
                this.setState('ui.sidebarCollapsed', collapsed);
            }

            setTheme(theme) {
                this.setState('ui.theme', theme);
                document.documentElement.setAttribute('data-theme', theme);
            }
        }

        // API Client
        class LMPApiClient {
            constructor() {
                this.baseURL = '';
                this.defaultHeaders = {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                };
            }

            async request(method, url, data = null, options = {}) {
                const config = {
                    method,
                    headers: { ...this.defaultHeaders, ...options.headers },
                    ...options
                };

                if (data && method !== 'GET') {
                    config.body = JSON.stringify(data);
                }

                if (method === 'GET' && data) {
                    const params = new URLSearchParams(data);
                    url += (url.includes('?') ? '&' : '?') + params.toString();
                }

                try {
                    const response = await fetch(this.baseURL + url, config);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    const contentType = response.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        return await response.json();
                    }
                    
                    return await response.text();
                } catch (error) {
                    console.error('API request failed:', error);
                    throw error;
                }
            }

            async get(url, params) {
                return this.request('GET', url, params);
            }

            async post(url, data) {
                return this.request('POST', url, data);
            }

            async put(url, data) {
                return this.request('PUT', url, data);
            }

            async delete(url) {
                return this.request('DELETE', url);
            }
        }

        // Global State Manager Instance
        window.lmpState = new LMPStateManager();

        // Export for modules
        if (typeof module !== 'undefined' && module.exports) {
            module.exports = { LMPStateManager, LMPApiClient };
        }
    </script>
</div>

<!-- State Management Integration Fragment -->
<div th:fragment="state-integration">
    <script>
        // Integration helpers for dashboard components
        class DashboardStateIntegration {
            constructor() {
                this.setupStateBindings();
                this.setupComponentIntegration();
            }

            setupStateBindings() {
                // Bind loading state to UI
                window.lmpState.subscribe('ui.loading', (loading) => {
                    if (loading) {
                        window.dashboardComponents?.showLoading('page');
                    } else {
                        window.dashboardComponents?.hideLoading('page');
                    }
                });

                // Bind notifications to toast system
                window.lmpState.subscribe('notifications', (notifications) => {
                    const latest = notifications[notifications.length - 1];
                    if (latest && Date.now() - latest.timestamp < 1000) {
                        window.dashboardComponents?.showToast(latest.type, latest.message);
                    }
                });

                // Bind user data to UI
                window.lmpState.subscribe('user', (user) => {
                    this.updateUserInterface(user);
                });

                // Bind dashboard stats to charts
                window.lmpState.subscribe('dashboard.stats', (stats) => {
                    this.updateDashboardCharts(stats);
                });

                // Bind orders to UI
                window.lmpState.subscribe('orders', (orders) => {
                    this.updateOrdersInterface(orders);
                });

                // Bind reviews to UI
                window.lmpState.subscribe('reviews', (reviews) => {
                    this.updateReviewsInterface(reviews);
                });
            }

            setupComponentIntegration() {
                // Enhanced form submissions
                this.enhanceFormSubmissions();
                
                // Enhanced data loading
                this.enhanceDataLoading();
                
                // Enhanced error handling
                this.enhanceErrorHandling();
            }

            enhanceFormSubmissions() {
                // Profile form
                const profileForm = document.getElementById('profileForm');
                if (profileForm) {
                    profileForm.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const formData = new FormData(profileForm);
                        const data = Object.fromEntries(formData);
                        
                        try {
                            await window.lmpState.updateProfile(data);
                            window.advancedFormHandler?.hideForm('profileEditForm');
                        } catch (error) {
                            // Error already handled by state manager
                        }
                    });
                }

                // Review form
                const reviewForm = document.getElementById('reviewSubmissionForm');
                if (reviewForm) {
                    reviewForm.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const formData = new FormData(reviewForm);
                        const data = Object.fromEntries(formData);
                        
                        try {
                            await window.lmpState.createReview(data.orderId, data);
                            window.advancedFormHandler?.hideForm('reviewForm');
                        } catch (error) {
                            // Error already handled by state manager
                        }
                    });
                }
            }

            enhanceDataLoading() {
                // Auto-load data based on current view
                const currentPath = window.location.pathname;
                
                if (currentPath.includes('/dashboard/orders')) {
                    window.lmpState.setActiveView('orders');
                    window.lmpState.loadOrders();
                } else if (currentPath.includes('/dashboard/reviews')) {
                    window.lmpState.setActiveView('reviews');
                    window.lmpState.loadReviews();
                } else if (currentPath.includes('/dashboard')) {
                    window.lmpState.setActiveView('dashboard');
                    window.lmpState.loadDashboardStats();
                }
            }

            enhanceErrorHandling() {
                // Global error handler
                window.addEventListener('error', (event) => {
                    console.error('Global error:', event.error);
                    window.lmpState.addNotification('error', 'Une erreur inattendue s\'est produite');
                });

                // Unhandled promise rejection handler
                window.addEventListener('unhandledrejection', (event) => {
                    console.error('Unhandled promise rejection:', event.reason);
                    window.lmpState.addNotification('error', 'Erreur de communication avec le serveur');
                });
            }

            updateUserInterface(user) {
                if (!user) return;

                // Update user display elements
                const userNameElements = document.querySelectorAll('[data-user-name]');
                userNameElements.forEach(el => {
                    el.textContent = user.firstName && user.lastName 
                        ? `${user.firstName} ${user.lastName}`
                        : user.email;
                });

                const userEmailElements = document.querySelectorAll('[data-user-email]');
                userEmailElements.forEach(el => {
                    el.textContent = user.email;
                });

                // Update form fields
                const firstNameField = document.getElementById('firstName');
                if (firstNameField) firstNameField.value = user.firstName || '';

                const lastNameField = document.getElementById('lastName');
                if (lastNameField) lastNameField.value = user.lastName || '';

                const emailField = document.getElementById('email');
                if (emailField) emailField.value = user.email || '';

                const phoneField = document.getElementById('phone');
                if (phoneField) phoneField.value = user.phone || '';
            }

            updateDashboardCharts(stats) {
                if (!stats || !window.dashboardCharts) return;

                // Update existing charts with new data
                if (window.dashboardCharts.ordersChart && stats.ordersData) {
                    window.dashboardCharts.ordersChart.data = stats.ordersData;
                    window.dashboardCharts.ordersChart.update();
                }

                if (window.dashboardCharts.revenueChart && stats.revenueData) {
                    window.dashboardCharts.revenueChart.data = stats.revenueData;
                    window.dashboardCharts.revenueChart.update();
                }

                if (window.dashboardCharts.statusChart && stats.statusData) {
                    window.dashboardCharts.statusChart.data = stats.statusData;
                    window.dashboardCharts.statusChart.update();
                }
            }

            updateOrdersInterface(orders) {
                if (!orders) return;

                // Update orders list if on orders page
                const ordersContainer = document.querySelector('.orders-list');
                if (ordersContainer) {
                    // Re-render orders list
                    this.renderOrdersList(orders, ordersContainer);
                }

                // Update order count badge
                const orderCountBadge = document.querySelector('[data-order-count]');
                if (orderCountBadge) {
                    orderCountBadge.textContent = orders.length;
                }
            }

            updateReviewsInterface(reviews) {
                if (!reviews) return;

                // Update reviews list if on reviews page
                const reviewsContainer = document.querySelector('.reviews-list');
                if (reviewsContainer) {
                    this.renderReviewsList(reviews, reviewsContainer);
                }

                // Update review count badge
                const reviewCountBadge = document.querySelector('[data-review-count]');
                if (reviewCountBadge) {
                    reviewCountBadge.textContent = reviews.length;
                }
            }

            renderOrdersList(orders, container) {
                // Implementation would depend on specific UI structure
                console.log('Rendering orders list:', orders);
            }

            renderReviewsList(reviews, container) {
                // Implementation would depend on specific UI structure
                console.log('Rendering reviews list:', reviews);
            }
        }

        // Initialize state integration when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            window.dashboardStateIntegration = new DashboardStateIntegration();
            
            // Load initial data
            window.lmpState.loadUserData();
            
            console.log('Dashboard state integration initialized');
        });
    </script>
</div>
