<!-- Theme Toggle and Language Controls Fragment -->
<div th:fragment="theme-language-controls" class="flex items-center gap-2 notranslate">
    

    
    <!-- Theme Toggle (DaisyUI Swap) -->
    <label class="swap swap-rotate btn btn-ghost btn-circle btn-sm items-center justify-center">
        <input type="checkbox" class="bg-base-100 opacity-0 border-0 absolute w-0 h-0" id="theme-toggle-check" onchange="toggleThemeFromCheckbox(this)" />
        
        <!-- Sun icon (shown when checkbox is checked = currently dark, click to go light) -->
        <span class="material-symbols-outlined swap-on text-lg leading-none">light_mode</span>
        
        <!-- Moon icon (shown when checkbox is unchecked = currently light, click to go dark) -->
        <span class="material-symbols-outlined swap-off text-lg leading-none">dark_mode</span>
    </label>

    <!-- Language Dropdown (DaisyUI) -->
    <details class="dropdown dropdown-end">
        <summary class="btn btn-ghost btn-sm gap-2 px-2 font-normal language-btn m-0 list-none [&::-webkit-details-marker]:hidden">
            <img id="nav-current-flag" src="https://flagcdn.com/w40/fr.png" alt="" class="w-5 h-3.5 rounded-sm object-cover shadow-sm">
            <span id="nav-current-lang" class="hidden sm:inline text-base-content">FR</span>
            <i class="fas fa-chevron-down text-[10px] opacity-70 text-base-content"></i>
        </summary>
        <ul class="dropdown-content z-[2] menu p-2 shadow-lg bg-base-100 rounded-box w-48 mt-2 border border-base-200 text-base-content">
            <li><a onclick="changeNavGTranslateLang('fr')"><img src="https://flagcdn.com/w40/fr.png" class="w-5 h-3.5 rounded-sm"> Français</a></li>
            <li><a onclick="changeNavGTranslateLang('en')"><img src="https://flagcdn.com/w40/us.png" class="w-5 h-3.5 rounded-sm"> English</a></li>
            <li><a onclick="changeNavGTranslateLang('es')"><img src="https://flagcdn.com/w40/es.png" class="w-5 h-3.5 rounded-sm"> Español</a></li>
            <li><a onclick="changeNavGTranslateLang('de')"><img src="https://flagcdn.com/w40/de.png" class="w-5 h-3.5 rounded-sm"> Deutsch</a></li>
            <li><a onclick="changeNavGTranslateLang('it')"><img src="https://flagcdn.com/w40/it.png" class="w-5 h-3.5 rounded-sm"> Italiano</a></li>
            <li><a onclick="changeNavGTranslateLang('nl')"><img src="https://flagcdn.com/w40/nl.png" class="w-5 h-3.5 rounded-sm"> Nederlands</a></li>
            <li><a onclick="changeNavGTranslateLang('pt')"><img src="https://flagcdn.com/w40/br.png" class="w-5 h-3.5 rounded-sm"> Português</a></li>
            <li><a onclick="changeNavGTranslateLang('lb')"><img src="https://flagcdn.com/w40/lu.png" class="w-5 h-3.5 rounded-sm"> Lëtzebuergesch</a></li>
        </ul>
    </details>

    <!-- Hidden GTranslate wrapper -->
    <div class="gtranslate_wrapper" style="display: none;"></div>

    <script>
        // Language configuration
        const navLangConfig = {
            fr: { name: 'FR', flag: 'https://flagcdn.com/w40/fr.png' },
            en: { name: 'EN', flag: 'https://flagcdn.com/w40/us.png' },
            es: { name: 'ES', flag: 'https://flagcdn.com/w40/es.png' },
            de: { name: 'DE', flag: 'https://flagcdn.com/w40/de.png' },
            it: { name: 'IT', flag: 'https://flagcdn.com/w40/it.png' },
            nl: { name: 'NL', flag: 'https://flagcdn.com/w40/nl.png' },
            pt: { name: 'PT', flag: 'https://flagcdn.com/w40/br.png' },
            lb: { name: 'LB', flag: 'https://flagcdn.com/w40/lu.png' }
        };
        const navSupportedLangs = ['fr', 'en', 'es', 'de', 'it', 'nl', 'pt', 'lb'];

        // Theme Toggle via Checkbox (DaisyUI Swap)
        // swap-on (sun) shows when checked, swap-off (moon) shows when unchecked
        // checked = dark mode active (sun icon visible = "click to switch to light")
        // unchecked = light mode active (moon icon visible = "click to switch to dark")
        function toggleThemeFromCheckbox(checkbox) {
            const body = document.body;
            const html = document.documentElement;
            
            // checked => switch to dark, unchecked => switch to light
            const newTheme = checkbox.checked ? 'dark' : 'light';
            
            if (newTheme === 'dark') {
                body.classList.add('dark');
                html.classList.add('dark');
                html.dataset.theme = 'dark';
            } else {
                body.classList.remove('dark');
                html.classList.remove('dark');
                html.dataset.theme = 'light';
            }
            
            body.style.backgroundColor = '';
            body.style.color = '';
            localStorage.setItem('lmp-theme', newTheme);
        }

        // Change Language
        function changeNavGTranslateLang(lang) {
            var config = navLangConfig[lang];
            if (!config) return;
            
            document.getElementById('nav-current-lang').textContent = config.name;
            document.getElementById('nav-current-flag').src = config.flag;
            
            // Save to localStorage for reliable persistence
            localStorage.setItem('lmp-lang', lang);
            
            // Set GTranslate cookie
            var date = new Date();
            date.setTime(date.getTime() + (365 * 24 * 60 * 60 * 1000));
            document.cookie = "googtrans=/fr/" + lang + "; expires=" + date.toUTCString() + "; path=/";
            document.cookie = "googtrans=/fr/" + lang + "; expires=" + date.toUTCString() + "; path=/; domain=." + window.location.hostname;
            
            window.location.reload();
        }

        // Helper to get lang (localStorage first, then cookie fallback)
        function getNavCurrentLang() {
            // Check localStorage first (most reliable)
            var saved = localStorage.getItem('lmp-lang');
            if (saved && navSupportedLangs.includes(saved)) {
                return saved;
            }
            // Fallback to GTranslate cookie
            var match = document.cookie.match(/googtrans=\/fr\/(\w+)/);
            if (match && navSupportedLangs.includes(match[1])) {
                return match[1];
            }
            return 'fr'; // Default to French
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Initialize Theme
            // checked = dark (shows sun icon), unchecked = light (shows moon icon)
            const savedTheme = localStorage.getItem('lmp-theme') || 'dark';
            const checkbox = document.getElementById('theme-toggle-check');
            
            if (savedTheme === 'dark') {
                checkbox.checked = true;  // show sun icon (swap-on)
            } else {
                checkbox.checked = false; // show moon icon (swap-off)
            }
            
            // Initialize Language
            var currentLang = getNavCurrentLang();
            var config = navLangConfig[currentLang] || navLangConfig['fr'];
            
            var flagEl = document.getElementById('nav-current-flag');
            var langEl = document.getElementById('nav-current-lang');
            if (flagEl) flagEl.src = config.flag;
            if (langEl) langEl.textContent = config.name;
        });
    </script>
</div>

<!-- GTranslate Config -->
<div th:fragment="gtranslate-config">
    <script>
        window.gtranslateSettings = {
            "default_language": "fr",
            "detect_browser_language": false,
            "languages": ["fr", "en", "es", "de", "it", "nl", "pt", "lb"],
            "wrapper_selector": ".gtranslate_wrapper",
            "flag_style": "3d",
            "alt_flags": {"en": "usa", "pt": "brazil", "es": "spain"}
        };
    </script>
    <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>
</div>
