<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <!-- Navigation Header Fragment -->
    <header th:fragment="navigation" class="bg-white border-b border-gray-100 sticky top-0 z-50 py-3 shadow-sm">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <!-- Zone GAUCHE : Logo + Navigation -->
                <div class="flex items-center space-x-8">
                    <!-- Logo -->
                    <div class="flex items-center">
                        <a href="/">
                            <img src="/images/Logo LMP.png" alt="LMP Logo" class="h-14 w-28 hover:opacity-80 transition-opacity">
                        </a>
                    </div>

                    <!-- Navigation Links -->
                    <nav class="hidden md:flex items-center space-x-6">
                        <a href="/" th:class="${currentPage == 'home' ? 'text-primary border-b-2 border-primary font-semibold pb-1 transition-colors' : 'text-gray-700 hover:text-primary font-medium transition-colors'}">
                            Accueil
                        </a>
                        <a href="/services" th:class="${currentPage == 'services' ? 'text-primary border-b-2 border-primary font-semibold pb-1 transition-colors' : 'text-gray-700 hover:text-primary font-medium transition-colors'}">
                            Services
                        </a>
                        <a href="/map" th:class="${currentPage == 'map' ? 'text-primary border-b-2 border-primary font-semibold pb-1 transition-colors' : 'text-gray-700 hover:text-primary font-medium transition-colors'}">
                            Carte
                        </a>
                        <a href="/about" th:class="${currentPage == 'about' ? 'text-primary border-b-2 border-primary font-semibold pb-1 transition-colors' : 'text-gray-700 hover:text-primary font-medium transition-colors'}">
                            À propos
                        </a>
                        <a href="/contact" th:class="${currentPage == 'contact' ? 'text-primary border-b-2 border-primary font-semibold pb-1 transition-colors' : 'text-gray-700 hover:text-primary font-medium transition-colors'}">
                            Contact
                        </a>
                    </nav>
                </div>

                <!-- Zone DROITE : Connexion + Langue -->
                <div class="hidden md:flex items-center space-x-4">
                    <!-- Authentification - Utilisateur non connecté -->
                    <div sec:authorize="!isAuthenticated()" class="flex items-center space-x-4">
                        <a href="/login" class="text-gray-700 hover:text-primary font-medium transition-colors">
                            Connexion
                        </a>
                    </div>

                    <!-- Authentification - Utilisateur connecté -->
                    <div sec:authorize="isAuthenticated()" class="flex items-center space-x-4">
                        <span class="text-gray-700 font-medium">
                            Bonjour, <span sec:authentication="name" th:text="${#strings.substringBefore(#authentication.principal.username, '@')}">User</span>
                        </span>
                        
                        <!-- Dashboard pour tous les utilisateurs connectés -->
                        <a href="/dashboard" class="text-gray-700 hover:text-primary font-medium transition-colors">
                            <i class="fas fa-tachometer-alt me-1"></i>
                            Dashboard
                        </a>
                        
                        <!-- Admin Panel - visible uniquement pour les ADMIN -->
                        <a sec:authorize="hasRole('ADMIN')" href="/admin/dashboard" class="text-red-600 hover:text-red-800 font-medium transition-colors">
                            <i class="fas fa-shield-alt me-1"></i>
                            Admin Panel
                        </a>
                        
                        <form action="/logout" method="post" class="inline">
                            <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                            <button type="submit" class="text-gray-700 hover:text-red-600 font-medium transition-colors">
                                <i class="fas fa-sign-out-alt me-1"></i>
                                Déconnexion
                            </button>
                        </form>
                    </div>
                    
                    <select class="px-3 py-1 border border-gray-200 rounded-md bg-white text-sm font-medium">
                        <option value="fr">FR</option>
                        <option value="en">EN</option>
                    </select>
                </div>

                <!-- Mobile Menu Button (caché sur dashboard) -->
                <div class="md:hidden dashboard-hide-mobile">
                    <button onclick="toggleMobileMenu()" class="text-gray-700 hover:text-primary transition-colors">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                </div>
            </div>

            <!-- Mobile Menu (caché sur dashboard) -->
            <div id="mobileMenu" class="md:hidden hidden mt-4 pb-4 border-t border-gray-100 pt-4 dashboard-hide-mobile">
                <div class="flex flex-col space-y-4">
                    <a href="/" th:class="${currentPage == 'home' ? 'text-primary bg-blue-50 px-3 py-2 rounded-lg font-semibold transition-colors' : 'text-left text-gray-700 hover:text-primary font-medium transition-colors'}">
                        Accueil
                    </a>
                    <a href="/services" th:class="${currentPage == 'services' ? 'text-primary bg-blue-50 px-3 py-2 rounded-lg font-semibold transition-colors' : 'text-left text-gray-700 hover:text-primary font-medium transition-colors'}">
                        Services
                    </a>
                    <a href="/map" th:class="${currentPage == 'map' ? 'text-primary bg-blue-50 px-3 py-2 rounded-lg font-semibold transition-colors' : 'text-left text-gray-700 hover:text-primary font-medium transition-colors'}">
                        Carte
                    </a>
                    <a href="/about" th:class="${currentPage == 'about' ? 'text-primary bg-blue-50 px-3 py-2 rounded-lg font-semibold transition-colors' : 'text-left text-gray-700 hover:text-primary font-medium transition-colors'}">
                        À propos
                    </a>
                    <a href="/contact" th:class="${currentPage == 'contact' ? 'text-primary bg-blue-50 px-3 py-2 rounded-lg font-semibold transition-colors' : 'text-left text-gray-700 hover:text-primary font-medium transition-colors'}">
                        Contact
                    </a>
                    
                    <!-- Mobile - Utilisateur non connecté -->
                    <div sec:authorize="!isAuthenticated()" class="space-y-2 pt-2 border-t border-gray-100">
                        <a href="/login" class="block w-full text-center border border-gray-200 text-gray-700 px-6 py-2 rounded-lg font-medium hover:bg-gray-50 transition-all duration-200">
                            Connexion
                        </a>
                    </div>

                    <!-- Mobile - Utilisateur connecté -->
                    <div sec:authorize="isAuthenticated()" class="space-y-2 pt-2 border-t border-gray-100">
                        <div class="text-center text-gray-700 font-medium">
                            Bonjour, <span sec:authentication="name" th:text="${#strings.substringBefore(#authentication.principal.username, '@')}">User</span>
                        </div>
                        
                        <!-- Dashboard pour tous les utilisateurs connectés -->
                        <a href="/dashboard" class="block w-full text-center bg-primary text-white px-6 py-2 rounded-lg font-medium hover:bg-primary/90 transition-all duration-200">
                            <i class="fas fa-tachometer-alt me-1"></i>
                            Dashboard
                        </a>
                        
                        <!-- Admin Panel Mobile - visible uniquement pour les ADMIN -->
                        <a sec:authorize="hasRole('ADMIN')" href="/admin/dashboard" class="block w-full text-center bg-red-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-red-700 transition-all duration-200">
                            <i class="fas fa-shield-alt me-1"></i>
                            Admin Panel
                        </a>
                        
                        <form action="/logout" method="post" class="w-full">
                            <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                            <button type="submit" class="w-full text-center border border-gray-200 text-gray-700 px-6 py-2 rounded-lg font-medium hover:bg-gray-50 transition-all duration-200">
                                <i class="fas fa-sign-out-alt me-1"></i>
                                Déconnexion
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </header>
    
</body>
</html>
