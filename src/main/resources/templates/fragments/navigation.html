<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <header th:fragment="navigation" class="sticky top-0 z-50 bg-base-100/90 backdrop-blur shadow-sm transition-all duration-300">
        <!-- Phase 1: min-h-[64px] reserves layout space and prevents CLS from logo overflow -->
        <div class="navbar container mx-auto min-h-[64px]">

            <!-- Navbar Start: Logo -->
            <div class="navbar-start relative">
                <a href="/" class="flex items-center px-2 group h-10 w-32 relative z-[60]">
                    <img id="nav-main-logo" src="/images/Logo LMP.webp" alt="LMP Logo"
                         class="absolute -top-3 left-2 h-20 lg:h-28 w-auto origin-left
                                transition-[height,top,filter,transform] duration-300 ease-out
                                drop-shadow-lg will-change-transform
                                group-hover:scale-110 group-hover:drop-shadow-xl
                                group-active:scale-95 group-active:drop-shadow-md">
                </a>
            </div>

            <!-- Navbar Center: Desktop Menu -->
            <!-- Phase 4: Active = text-primary + bg-primary/10 (unified with mobile) -->
            <div class="navbar-center hidden lg:flex">
                <ul class="menu menu-horizontal px-1 gap-1 text-base-content">
                    <li><a href="/"
                           th:classappend="${currentPage == 'home' ? 'text-primary font-semibold bg-primary/10' : 'text-base-content/80 hover:text-base-content hover:bg-base-200/50'}"
                           class="rounded-full px-5 py-2 transition-all duration-200">Accueil</a></li>
                    <li><a href="/services"
                           th:classappend="${currentPage == 'services' ? 'text-primary font-semibold bg-primary/10' : 'text-base-content/80 hover:text-base-content hover:bg-base-200/50'}"
                           class="rounded-full px-5 py-2 transition-all duration-200">Services</a></li>
                    <li><a href="/map"
                           th:classappend="${currentPage == 'map' ? 'text-primary font-semibold bg-primary/10' : 'text-base-content/80 hover:text-base-content hover:bg-base-200/50'}"
                           class="rounded-full px-5 py-2 transition-all duration-200">Carte</a></li>
                    <li><a href="/about"
                           th:classappend="${currentPage == 'about' ? 'text-primary font-semibold bg-primary/10' : 'text-base-content/80 hover:text-base-content hover:bg-base-200/50'}"
                           class="rounded-full px-5 py-2 transition-all duration-200">À propos</a></li>
                    <li><a href="/contact"
                           th:classappend="${currentPage == 'contact' ? 'text-primary font-semibold bg-primary/10' : 'text-base-content/80 hover:text-base-content hover:bg-base-200/50'}"
                           class="rounded-full px-5 py-2 transition-all duration-200">Contact</a></li>
                </ul>
            </div>

            <!-- Navbar End: Controls, Auth & Mobile Menu -->
            <div class="navbar-end gap-2">

                <!-- Phase 2 & 5: Mobile Dropdown — animated hamburger, aria, z-[200] -->
                <div class="flex items-center lg:hidden">
                    <div class="dropdown dropdown-end" id="mobile-nav-dropdown"
                         onfocusout="setTimeout(function(){ if(!document.getElementById('mobile-nav-dropdown').contains(document.activeElement)) closeMobileNav(); }, 150)">

                        <!-- Hamburger button with aria -->
                        <div tabindex="0" role="button" id="mobile-menu-btn"
                             class="btn btn-ghost p-2"
                             aria-expanded="false"
                             aria-label="Ouvrir le menu de navigation"
                             aria-controls="mobile-menu-list"
                             onclick="toggleMobileNav()">
                            <!-- Animated 3-bar → X icon -->
                            <div id="nav-hamburger" class="w-5 h-4 flex flex-col justify-between pointer-events-none" aria-hidden="true">
                                <span class="block h-0.5 w-full bg-current rounded-full transition-all duration-300 origin-center"></span>
                                <span class="block h-0.5 w-full bg-current rounded-full transition-all duration-300 origin-center"></span>
                                <span class="block h-0.5 w-full bg-current rounded-full transition-all duration-300 origin-center"></span>
                            </div>
                        </div>

                        <!-- Phase 5: z-[200] to always appear above other elements -->
                        <ul tabindex="0" id="mobile-menu-list"
                            class="menu menu-sm dropdown-content mt-3 z-[200] p-2 shadow-lg bg-base-100 rounded-box w-52 border border-base-200 text-base-content">

                            <!-- Phase 4: Active = font-semibold text-primary bg-primary/10 (unified) -->
                            <li><a href="/"        th:classappend="${currentPage == 'home'     ? 'font-semibold text-primary bg-primary/10' : 'text-base-content hover:bg-base-200'}">Accueil</a></li>
                            <li><a href="/services" th:classappend="${currentPage == 'services' ? 'font-semibold text-primary bg-primary/10' : 'text-base-content hover:bg-base-200'}">Services</a></li>
                            <li><a href="/map"      th:classappend="${currentPage == 'map'      ? 'font-semibold text-primary bg-primary/10' : 'text-base-content hover:bg-base-200'}">Carte</a></li>
                            <li><a href="/about"    th:classappend="${currentPage == 'about'    ? 'font-semibold text-primary bg-primary/10' : 'text-base-content hover:bg-base-200'}">À propos</a></li>
                            <li><a href="/contact"  th:classappend="${currentPage == 'contact'  ? 'font-semibold text-primary bg-primary/10' : 'text-base-content hover:bg-base-200'}">Contact</a></li>

                            <div class="divider my-1"></div>
                            <li class="px-2 py-1 flex flex-row items-center justify-between text-base-content">
                                <span class="opacity-70">Thème</span>
                                <th:block th:replace="~{fragments/theme-language-controls :: theme-language-controls}"></th:block>
                            </li>
                            <div class="divider my-1"></div>
                            <li sec:authorize="!isAuthenticated()">
                                <a href="/login" class="text-primary font-bold">
                                    <i class="fas fa-sign-in-alt mr-2"></i>Connexion
                                </a>
                            </li>
                            <li sec:authorize="isAuthenticated()">
                                <a href="/dashboard" class="text-primary font-bold">
                                    <i class="fas fa-columns mr-2"></i>Tableau de bord
                                </a>
                            </li>
                            <li sec:authorize="isAuthenticated()">
                                <form action="/logout" method="post" class="w-full">
                                    <input type="hidden" name="_csrf" th:value="${_csrf?.token}"/>
                                    <button type="submit" class="w-full text-left text-error hover:bg-error/10 flex items-center">
                                        <i class="fas fa-sign-out-alt mr-2"></i>Déconnexion
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Desktop: Theme & Language Controls -->
                <div class="hidden lg:flex items-center gap-2">
                    <th:block th:replace="~{fragments/theme-language-controls :: theme-language-controls}"></th:block>

                    <a sec:authorize="!isAuthenticated()" href="/login"
                       class="btn btn-primary btn-sm rounded-full px-6 ml-2">
                        Connexion
                    </a>

                    <!-- User Dropdown (Authenticated) -->
                    <div sec:authorize="isAuthenticated()" class="dropdown dropdown-end ml-2">
                        <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar placeholder online">
                            <div class="bg-neutral text-neutral-content rounded-full w-9">
                                <span class="text-xs font-bold"
                                      th:text="${currentUserInitials != null ? currentUserInitials : #strings.substring(#authentication.name,0,2).toUpperCase()}">UI</span>
                            </div>
                        </div>
                        <ul tabindex="0" class="mt-3 z-[200] p-2 shadow menu menu-sm dropdown-content bg-base-100 rounded-box w-52">
                            <li class="menu-title px-4 py-2 text-base-content/70">
                                <span th:text="${currentUserDisplayName != null ? currentUserDisplayName : #authentication.name}">User</span>
                            </li>
                            <li><a href="/dashboard" class="justify-between text-base-content hover:bg-base-200">
                                Dashboard <span class="badge badge-primary badge-xs">New</span>
                            </a></li>
                            <li sec:authorize="hasRole('ADMIN')">
                                <a href="/admin/dashboard" class="text-error hover:bg-base-200">Admin Panel</a>
                            </li>
                            <div class="divider my-1"></div>
                            <li>
                                <form action="/logout" method="post" class="w-full">
                                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                                    <button type="submit" class="w-full text-left text-error">Déconnexion</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- Phase 2: CSS for hamburger → X animation driven by aria-expanded -->
        <style>
            /* Bars animate into X when menu is open */
            #mobile-menu-btn[aria-expanded="true"] #nav-hamburger span:nth-child(1) {
                transform: translateY(7px) rotate(45deg);
            }
            #mobile-menu-btn[aria-expanded="true"] #nav-hamburger span:nth-child(2) {
                opacity: 0;
                transform: scaleX(0);
            }
            #mobile-menu-btn[aria-expanded="true"] #nav-hamburger span:nth-child(3) {
                transform: translateY(-7px) rotate(-45deg);
            }
        </style>

        <script>
            /* ════════════════════════════════════════════
               Phase 2 & 5 — Mobile nav open / close
               ════════════════════════════════════════════ */
            function openMobileNav() {
                var dropdown = document.getElementById('mobile-nav-dropdown');
                var btn      = document.getElementById('mobile-menu-btn');
                if (!dropdown || !btn) return;
                dropdown.setAttribute('data-open', '');
                btn.setAttribute('aria-expanded', 'true');
                btn.setAttribute('aria-label', 'Fermer le menu de navigation');
                // Auto-close on next scroll (Phase 5)
                window.addEventListener('scroll', closeMobileNav, { once: true, passive: true });
            }

            function closeMobileNav() {
                var dropdown = document.getElementById('mobile-nav-dropdown');
                var btn      = document.getElementById('mobile-menu-btn');
                if (!dropdown || !btn) return;
                dropdown.removeAttribute('data-open');
                btn.setAttribute('aria-expanded', 'false');
                btn.setAttribute('aria-label', 'Ouvrir le menu de navigation');
                btn.blur();
            }

            function toggleMobileNav() {
                var btn = document.getElementById('mobile-menu-btn');
                if (!btn) return;
                btn.getAttribute('aria-expanded') === 'true' ? closeMobileNav() : openMobileNav();
            }

            document.addEventListener('DOMContentLoaded', function () {

                /* Phase 5 — Close menu on any menu link click */
                var menuLinks = document.querySelectorAll('#mobile-menu-list a');
                menuLinks.forEach(function (link) {
                    link.addEventListener('click', closeMobileNav);
                });

                /* Phase 2 — Close on Escape key */
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') closeMobileNav();
                });

                /* ════════════════════════════════════════════
                   Phase 1 & 3 — Logo shrink + Navbar shadow on scroll
                   ════════════════════════════════════════════ */
                var logo   = document.getElementById('nav-main-logo');
                var header = document.querySelector('header');

                var rafPending = false;
                var isScrolled = false;

                function applyScrollState() {
                    var scrolled = window.scrollY > 60;
                    if (scrolled === isScrolled) return; // no DOM change needed
                    isScrolled = scrolled;

                    if (scrolled) {
                        /* Logo: shrink into navbar */
                        if (logo) {
                            logo.classList.remove('h-20', 'lg:h-28', '-top-3', 'drop-shadow-lg');
                            logo.classList.add('h-10', 'top-0', 'drop-shadow-sm');
                        }
                        /* Phase 3: Navbar — stronger shadow when content scrolls under it */
                        if (header) {
                            header.classList.remove('shadow-sm');
                            header.classList.add('shadow-lg', 'border-b', 'border-base-200/50');
                        }
                    } else {
                        /* Logo: expand and overhang */
                        if (logo) {
                            logo.classList.add('h-20', 'lg:h-28', '-top-3', 'drop-shadow-lg');
                            logo.classList.remove('h-10', 'top-0', 'drop-shadow-sm');
                        }
                        /* Phase 3: Navbar — subtle shadow at top */
                        if (header) {
                            header.classList.add('shadow-sm');
                            header.classList.remove('shadow-lg', 'border-b', 'border-base-200/50');
                        }
                    }
                }

                function onScroll() {
                    if (rafPending) return;
                    rafPending = true;
                    requestAnimationFrame(function () {
                        applyScrollState();
                        rafPending = false;
                    });
                }

                window.addEventListener('scroll', onScroll, { passive: true });
                applyScrollState(); // Initialize on load
            });
        </script>
    </header>
</body>
</html>
