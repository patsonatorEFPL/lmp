<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <header th:fragment="navigation" class="sticky top-0 z-50 bg-base-100/90 backdrop-blur shadow-sm transition-all duration-300">
        <div class="navbar container mx-auto">
            <!-- Navbar Start: Logo -->
            <div class="navbar-start">
                <a href="/" class="btn btn-ghost text-xl px-2 group">
                    <img src="/images/Logo LMP.webp" alt="LMP Logo" class="h-10 w-auto group-hover:scale-105 transition-transform duration-300">
                </a>
            </div>

            <!-- Navbar Center: Desktop Menu -->
            <div class="navbar-center hidden lg:flex">
                <ul class="menu menu-horizontal px-1 gap-2 text-base-content">
                    <li><a href="/" th:classappend="${currentPage == 'home' ? 'bg-base-200 font-bold' : 'hover:bg-base-200'}" class="rounded-full px-6 py-2 transition-all">Accueil</a></li>
                    <li><a href="/services" th:classappend="${currentPage == 'services' ? 'bg-base-200 font-bold' : 'hover:bg-base-200'}" class="rounded-full px-6 py-2 transition-all">Services</a></li>
                    <li><a href="/map" th:classappend="${currentPage == 'map' ? 'bg-base-200 font-bold' : 'hover:bg-base-200'}" class="rounded-full px-6 py-2 transition-all">Carte</a></li>
                    <li><a href="/about" th:classappend="${currentPage == 'about' ? 'bg-base-200 font-bold' : 'hover:bg-base-200'}" class="rounded-full px-6 py-2 transition-all">À propos</a></li>
                    <li><a href="/contact" th:classappend="${currentPage == 'contact' ? 'bg-base-200 font-bold' : 'hover:bg-base-200'}" class="rounded-full px-6 py-2 transition-all">Contact</a></li>
                </ul>
            </div>

            <!-- Navbar End: Controls, Auth & Mobile Menu -->
            <div class="navbar-end gap-2">
                <!-- Desktop: Theme & Language Controls -->
                <div class="hidden lg:flex items-center gap-2">
                    <th:block th:replace="~{fragments/theme-language-controls :: theme-language-controls}"></th:block>
                    
                    <!-- Auth Buttons -->
                    <a sec:authorize="!isAuthenticated()" href="/login" class="btn btn-primary btn-sm rounded-full px-6 ml-2">
                        Connexion
                    </a>

                    <!-- User Dropdown (Authenticated) -->
                    <div sec:authorize="isAuthenticated()" class="dropdown dropdown-end ml-2">
                        <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar placeholder online">
                            <div class="bg-neutral text-neutral-content rounded-full w-9">
                                <span class="text-xs font-bold" sec:authentication="name" th:text="${#strings.substring(#authentication.principal.username,0,2).toUpperCase()}">UI</span>
                            </div>
                        </div>
                        <ul tabindex="0" class="mt-3 z-[1] p-2 shadow menu menu-sm dropdown-content bg-base-100 rounded-box w-52">
                            <li class="menu-title px-4 py-2">
                                <span sec:authentication="name">User</span>
                            </li>
                            <li><a href="/dashboard" class="justify-between">Dashboard <span class="badge badge-primary badge-xs">New</span></a></li>
                            <li sec:authorize="hasRole('ADMIN')"><a href="/admin/dashboard" class="text-error">Admin Panel</a></li>
                            <div class="divider my-1"></div>
                            <li>
                                <form action="/logout" method="post" class="w-full">
                                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                                    <button type="submit" class="w-full text-left text-error">Déconnexion</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>


            </div>
        </div>
    </header>
</body>
</html>
