<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Bannière de vérification d'email -->
<div th:fragment="email-verification-banner"
     sec:authorize="isAuthenticated()"
     th:if="${emailVerified != null and !emailVerified}">

    <!-- Bannière jaune : temps restant > 0 -->
    <div th:if="${!isAccountSuspended}"
         class="bg-yellow-50 border-b border-yellow-300" 
         style="padding:12px 16px;">
        <div class="container mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
            <div class="flex items-center gap-2 text-yellow-800">
                <i class="fas fa-exclamation-triangle"></i>
                <span class="text-sm font-medium">
                    Votre email n'est pas encore vérifié.
                    <span th:if="${timeRemainingMinutes != null and timeRemainingMinutes > 60}">
                        Il vous reste <strong th:text="${timeRemainingMinutes / 60}">X</strong>h
                        <strong th:text="${timeRemainingMinutes % 60}">Y</strong>min pour vérifier.
                    </span>
                    <span th:if="${timeRemainingMinutes != null and timeRemainingMinutes <= 60 and timeRemainingMinutes > 0}">
                        Il vous reste <strong th:text="${timeRemainingMinutes}">Y</strong> minutes pour vérifier.
                    </span>
                </span>
            </div>
            <form th:action="@{/resend-verification}" method="post" class="flex-shrink-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" 
                        class="bg-yellow-600 hover:bg-yellow-700 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition-colors">
                    <i class="fas fa-paper-plane mr-1"></i> Renvoyer le lien
                </button>
            </form>
        </div>
    </div>

    <!-- Bannière rouge : compte suspendu (deadline dépassée) -->
    <div th:if="${isAccountSuspended}"
         class="bg-red-50 border-b border-red-300"
         style="padding:12px 16px;">
        <div class="container mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
            <div class="flex items-center gap-2 text-red-800">
                <i class="fas fa-ban"></i>
                <span class="text-sm font-medium">
                    Votre compte est suspendu. Vérifiez votre email pour le réactiver.
                </span>
            </div>
            <form th:action="@{/resend-verification}" method="post" class="flex-shrink-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit"
                        class="bg-red-600 hover:bg-red-700 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition-colors">
                    <i class="fas fa-paper-plane mr-1"></i> Renvoyer le lien de vérification
                </button>
            </form>
        </div>
    </div>

</div>

</body>
</html>
