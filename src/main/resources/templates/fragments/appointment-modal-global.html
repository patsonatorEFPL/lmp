<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Fragment du Modal de Rendez-vous Global - Version Premium -->
    <div th:fragment="appointment-modal-global" id="appointmentModal" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
            
            <!-- Overlay Backdrop -->
            <div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity" aria-hidden="true" onclick="AppointmentModal.close()"></div>

            <!-- Centre le modal -->
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

            <!-- Contenu du modal Glassmorphism -->
            <div class="inline-block align-bottom bg-white/95 backdrop-blur-xl border border-white/50 rounded-3xl text-left overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.15)] transform transition-all sm:my-8 sm:align-middle sm:max-w-6xl sm:w-full animate-fade-in-up relative">
                
                <!-- Decorative Top Gradient Line -->
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary via-purple-600 to-primary"></div>

                <!-- Header -->
                <div class="px-6 py-5 border-b border-gray-100 flex justify-between items-center bg-white/50">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center text-primary">
                            <i class="far fa-calendar-check text-xl"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-gray-900" id="modal-title" th:text="#{appointment.modal.title}">Prendre rendez-vous</h3>
                            <p class="text-xs text-gray-500" th:text="#{appointment.modal.subtitle}">Sélectionnez une date et un horaire</p>
                        </div>
                    </div>
                    <button type="button" class="w-8 h-8 rounded-full bg-gray-50 hover:bg-red-50 text-gray-400 hover:text-red-500 transition-colors flex items-center justify-center" onclick="AppointmentModal.close()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <!-- Body -->
                <div class="px-4 py-6 md:px-8">
                    <div class="grid grid-cols-1 lg:grid-cols-[1fr_1.8fr] gap-6 lg:gap-8">
                        
                        <!-- Col 1: Formulaire -->
                        <div class="space-y-5">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="w-6 h-6 rounded-full bg-primary/10 text-primary text-xs font-bold flex items-center justify-center">1</span>
                                <h4 class="text-sm font-semibold text-gray-700 uppercase tracking-wide" th:text="#{appointment.modal.step1}">Vos informations</h4>
                            </div>

                            <!-- Zone de message (Alert) -->
                            <div id="appointmentMessage" class="hidden mb-4 p-4 rounded-xl text-sm font-medium"></div>
                            
                            <form id="appointmentForm" class="space-y-4">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <!-- Nom -->
                                    <div class="col-span-1 md:col-span-2">
                                        <label for="appointmentName" class="block text-xs font-medium text-gray-500 mb-1 ml-1" th:text="#{appointment.modal.name}">Nom complet *</label>
                                        <input type="text" id="appointmentName" name="name" required th:placeholder="#{appointment.modal.name.placeholder}"
                                            class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-sm">
                                        <div id="appointmentNameError" class="text-red-500 text-xs mt-1 hidden font-medium"></div>
                                    </div>

                                    <!-- Email -->
                                    <div class="col-span-1 md:col-span-2">
                                        <label for="appointmentEmail" class="block text-xs font-medium text-gray-500 mb-1 ml-1" th:text="#{appointment.modal.email}">Email *</label>
                                        <input type="email" id="appointmentEmail" name="email" required th:placeholder="#{appointment.modal.email.placeholder}"
                                            class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-sm">
                                        <div id="appointmentEmailError" class="text-red-500 text-xs mt-1 hidden font-medium"></div>
                                    </div>

                                    <!-- Téléphone -->
                                    <div class="col-span-1 md:col-span-2">
                                        <label for="appointmentPhone" class="block text-xs font-medium text-gray-500 mb-1 ml-1" th:text="#{appointment.modal.phone}">Téléphone *</label>
                                        <input type="tel" id="appointmentPhone" name="phone" required th:placeholder="#{appointment.modal.phone.placeholder}"
                                            class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-sm">
                                        <div id="appointmentPhoneError" class="text-red-500 text-xs mt-1 hidden font-medium"></div>
                                    </div>

                                    <!-- Service -->
                                    <div class="col-span-1 md:col-span-2">
                                        <label for="appointmentService" class="block text-xs font-medium text-gray-500 mb-1 ml-1" th:text="#{appointment.modal.service}">Service *</label>
                                        <select id="appointmentService" name="service" required
                                            class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-sm cursor-pointer">
                                            <option value="" th:text="#{appointment.modal.service.select}">Sélectionnez un service...</option>
                                            <option value="Consultation" th:text="#{appointment.modal.service.consultation}">Consultation générale</option>
                                            <option value="Développement Web" th:text="#{appointment.modal.service.webdev}">Développement Web</option>
                                            <option value="Référencement SEO" th:text="#{appointment.modal.service.seo}">Référencement SEO</option>
                                            <option value="Formation" th:text="#{appointment.modal.service.training}">Formation</option>
                                            <option value="Audit" th:text="#{appointment.modal.service.audit}">Audit technique</option>
                                            <option value="Marketing Digital" th:text="#{appointment.modal.service.marketing}">Marketing Digital</option>
                                            <option value="Sécurité Web" th:text="#{appointment.modal.service.security}">Sécurité Web</option>
                                            <option value="Autre" th:text="#{appointment.modal.service.other}">Autre</option>
                                        </select>
                                        <div id="appointmentServiceError" class="text-red-500 text-xs mt-1 hidden font-medium"></div>
                                    </div>

                                    <!-- Message -->
                                    <div class="col-span-1 md:col-span-2">
                                        <label for="appointmentMessageField" class="block text-xs font-medium text-gray-500 mb-1 ml-1" th:text="#{appointment.modal.message}">Message (optionnel)</label>
                                        <textarea id="appointmentMessageField" name="message" rows="2"
                                            class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-sm resize-none"
                                            th:placeholder="#{appointment.modal.message.placeholder}"></textarea>
                                    </div>
                                </div>

                                <!-- Hidden fields -->
                                <input type="hidden" id="appointmentDate" name="date">
                                <input type="hidden" id="appointmentTime" name="time">
                            </form>
                        </div>

                        <!-- Col 2: Calendrier & Slots -->
                        <div class="bg-gray-50/80 rounded-2xl p-5 border border-gray-100 flex flex-col h-full">
                            <div class="flex items-center gap-2 mb-4">
                                <span class="w-6 h-6 rounded-full bg-purple-100 text-purple-600 text-xs font-bold flex items-center justify-center">2</span>
                                <h4 class="text-sm font-semibold text-gray-700 uppercase tracking-wide" th:text="#{appointment.modal.step2}">Disponibilités</h4>
                            </div>

                            <!-- Calendrier -->
                            <div id="calendar" class="mb-4 bg-white rounded-xl shadow-sm border border-gray-100 p-2">
                                <div class="flex items-center justify-between mb-2 px-1">
                                    <button type="button" id="prevMonth" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-600 transition-colors">
                                        <i class="fas fa-chevron-left text-xs"></i>
                                    </button>
                                    <h4 id="currentMonth" class="text-sm font-bold text-gray-800 capitalize"></h4>
                                    <button type="button" id="nextMonth" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-600 transition-colors">
                                        <i class="fas fa-chevron-right text-xs"></i>
                                    </button>
                                </div>
                                
                                <div class="grid grid-cols-7 gap-1 mb-1 text-center">
                                    <div class="text-[0.65rem] font-bold text-gray-400 uppercase" th:text="#{appointment.modal.day.sun}">Dim</div>
                                    <div class="text-[0.65rem] font-bold text-gray-400 uppercase" th:text="#{appointment.modal.day.mon}">Lun</div>
                                    <div class="text-[0.65rem] font-bold text-gray-400 uppercase" th:text="#{appointment.modal.day.tue}">Mar</div>
                                    <div class="text-[0.65rem] font-bold text-gray-400 uppercase" th:text="#{appointment.modal.day.wed}">Mer</div>
                                    <div class="text-[0.65rem] font-bold text-gray-400 uppercase" th:text="#{appointment.modal.day.thu}">Jeu</div>
                                    <div class="text-[0.65rem] font-bold text-gray-400 uppercase" th:text="#{appointment.modal.day.fri}">Ven</div>
                                    <div class="text-[0.65rem] font-bold text-gray-400 uppercase" th:text="#{appointment.modal.day.sat}">Sam</div>
                                </div>
                                <div id="calendarDays" class="grid grid-cols-7 gap-1">
                                    <!-- Jours générés dynamiquement avec style propre -->
                                </div>
                            </div>

                            <!-- Créneaux -->
                            <div class="flex-1 overflow-y-auto min-h-[100px] mb-4 custom-scrollbar">
                                <h5 class="text-xs font-medium text-gray-400 mb-2 uppercase tracking-wider" th:text="#{appointment.modal.slots.title}">Créneaux disponibles</h5>
                                <div id="timeSlotsContainer">
                                    <div class="col-span-full text-center py-6 text-gray-400 text-sm bg-white rounded-xl border border-dashed border-gray-200">
                                        <i class="far fa-calendar-alt mb-2 block text-2xl opacity-30"></i>
                                        <span th:text="#{appointment.modal.slots.select_date}">Sélectionnez une date</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Résumé Sélection -->
                            <div id="appointmentSummary" class="mt-auto p-3 bg-blue-50/80 border border-blue-100 rounded-xl hidden flex items-center gap-3 animate-fade-in">
                                <div class="w-10 h-10 rounded-full bg-white flex-shrink-0 flex items-center justify-center text-blue-600 shadow-sm text-lg">
                                    ✨
                                </div>
                                <div>
                                    <h5 class="text-xs font-bold text-blue-800 uppercase" th:text="#{appointment.modal.summary.title}">Votre sélection</h5>
                                    <div id="summaryContent" class="text-sm font-medium text-blue-900"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <div class="bg-gray-50/80 px-6 py-4 flex flex-col-reverse sm:flex-row justify-end gap-3 border-t border-gray-100">
                    <button type="button" onclick="AppointmentModal.close()"
                        class="px-6 py-2.5 rounded-xl border border-gray-200 text-gray-600 font-medium hover:bg-white hover:border-gray-300 transition-all text-sm" th:text="#{appointment.modal.cancel}">
                        Annuler
                    </button>
                    <button type="button" id="appointmentSubmitBtn" onclick="AppointmentModal.submitAppointment()"
                        class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-primary to-purple-600 text-white font-semibold text-sm shadow-lg shadow-primary/30 hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none flex items-center justify-center gap-2" disabled>
                        <span id="appointmentSubmitText" th:text="#{appointment.modal.submit}">Confirmer le rendez-vous</span>
                        <span id="appointmentSubmitLoader" class="hidden flex items-center gap-2">
                             <i class="fas fa-circle-notch fa-spin"></i>
                            <span th:text="#{appointment.modal.sending}">Envoi...</span>
                        </span>
                    </button>
                </div>
            </div>
        </div>
        
        <style>
            /* Custom styles for calendar interactivity that Tailwind handles best with @apply but here inline to avoid build steps for css */
            .day-cell {
                aspect-ratio: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 9999px;
                cursor: pointer;
                transition: all 0.2s;
                font-size: 0.85rem;
                font-weight: 500;
                color: #374151;
            }
            .day-cell:hover:not(.disabled):not(.selected) {
                 background-color: #f3f4f6;
                 color: var(--primary-color);
            }
            .day-cell.selected {
                background: linear-gradient(135deg, var(--primary-color) 0%, #8b5cf6 100%);
                color: white;
                box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
            }
            .day-cell.disabled {
                opacity: 0.3;
                cursor: not-allowed;
            }
            .day-cell.today {
                font-weight: 800;
                color: var(--primary-color);
                background-color: #eff6ff;
            }

            .time-slot-btn {
                padding: 0.65rem;
                text-align: center;
                border-radius: 0.75rem;
                font-size: 0.8rem;
                font-weight: 600;
                color: #4b5563;
                background-color: white;
                border: 1px solid #e5e7eb;
                cursor: pointer;
                transition: all 0.2s;
            }
            .time-slot-btn:hover {
                border-color: var(--primary-color);
                color: var(--primary-color);
                transform: translateY(-1px);
                background-color: #f9fafb;
                box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            }
            .time-slot-btn.selected {
                background: linear-gradient(135deg, var(--primary-color) 0%, #8b5cf6 100%);
                color: white;
                border-color: transparent;
                box-shadow: 0 3px 10px rgba(79, 70, 229, 0.2);
            }
        </style>
    </div>
</body>
</html>
