<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="websocket-scripts">
        <!-- SockJS et STOMP pour WebSocket -->
        <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
        
        <script th:inline="javascript">
            // Configuration WebSocket
            class WebSocketManager {
                constructor() {
                    this.stompClient = null;
                    this.connected = false;
                    this.subscriptions = new Map();
                    this.reconnectAttempts = 0;
                    this.maxReconnectAttempts = 5;
                    this.reconnectDelay = 3000;
                }
                
                // Connexion WebSocket
                connect() {
                    const socket = new SockJS('/ws/admin');
                    this.stompClient = Stomp.over(socket);
                    
                    // Configuration de debug
                    this.stompClient.debug = (str) => {
                        console.log('STOMP:', str);
                    };
                    
                    this.stompClient.connect({}, 
                        (frame) => this.onConnected(frame),
                        (error) => this.onError(error)
                    );
                }
                
                // Connexion réussie
                onConnected(frame) {
                    console.log('WebSocket connecté:', frame);
                    this.connected = true;
                    this.reconnectAttempts = 0;
                    
                    // Afficher indicateur de connexion
                    this.updateConnectionStatus(true);
                    
                    // S'abonner aux notifications d'admin
                    this.subscribeToOrders();
                    this.subscribeToStats();
                    this.subscribeToDashboard();
                }
                
                // Erreur de connexion
                onError(error) {
                    console.error('Erreur WebSocket:', error);
                    this.connected = false;
                    this.updateConnectionStatus(false);
                    
                    // Tentative de reconnexion
                    if (this.reconnectAttempts < this.maxReconnectAttempts) {
                        this.reconnectAttempts++;
                        console.log(`Tentative de reconnexion ${this.reconnectAttempts}/${this.maxReconnectAttempts}...`);
                        setTimeout(() => this.connect(), this.reconnectDelay);
                    }
                }
                
                // S'abonner aux notifications de commandes
                subscribeToOrders() {
                    const subscription = this.stompClient.subscribe('/topic/admin/orders', (message) => {
                        const notification = JSON.parse(message.body);
                        this.handleOrderNotification(notification);
                    });
                    this.subscriptions.set('orders', subscription);
                }
                
                // S'abonner aux statistiques
                subscribeToStats() {
                    const subscription = this.stompClient.subscribe('/topic/admin/stats', (message) => {
                        const notification = JSON.parse(message.body);
                        this.handleStatsNotification(notification);
                    });
                    this.subscriptions.set('stats', subscription);
                }
                
                // S'abonner aux mises à jour du dashboard
                subscribeToDashboard() {
                    const subscription = this.stompClient.subscribe('/topic/admin/dashboard', (message) => {
                        const notification = JSON.parse(message.body);
                        this.handleDashboardNotification(notification);
                    });
                    this.subscriptions.set('dashboard', subscription);
                }
                
                // Traiter les notifications de commandes
                handleOrderNotification(notification) {
                    console.log('Notification commande:', notification);
                    
                    // Afficher notification toast
                    this.showToast(notification);
                    
                    // Mettre à jour l'interface selon le type
                    switch(notification.type) {
                        case 'NEW_ORDER':
                            this.handleNewOrder(notification);
                            break;
                        case 'STATUS_CHANGED':
                            this.handleStatusChange(notification);
                            break;
                        case 'PAYMENT_SUCCESS':
                            this.handlePaymentSuccess(notification);
                            break;
                        case 'REFUND':
                            this.handleRefund(notification);
                            break;
                        case 'PAYMENT_ERROR':
                            this.handlePaymentError(notification);
                            break;
                    }
                    
                    // Rafraîchir les statistiques
                    this.refreshDashboardStats();
                }
                
                // Traiter nouvelle commande
                handleNewOrder(notification) {
                    // Incrémenter compteur de nouvelles commandes
                    const badge = document.querySelector('.new-orders-badge');
                    if (badge) {
                        const current = parseInt(badge.textContent) || 0;
                        badge.textContent = current + 1;
                        badge.style.display = 'inline-block';
                    }
                    
                    // Ajouter à la liste si on est sur la page des commandes
                    if (window.location.pathname.includes('/admin/orders')) {
                        this.addOrderToList(notification);
                    }
                }
                
                // Traiter changement de statut
                handleStatusChange(notification) {
                    // Mettre à jour le statut dans la liste
                    const orderRow = document.querySelector(`[data-order-id="${notification.orderId}"]`);
                    if (orderRow) {
                        const statusCell = orderRow.querySelector('.order-status');
                        if (statusCell) {
                            statusCell.textContent = notification.newStatus;
                            statusCell.className = `order-status badge bg-${this.getStatusColor(notification.newStatus)}`;
                        }
                    }
                }
                
                // Traiter les statistiques
                handleStatsNotification(notification) {
                    console.log('Notification stats:', notification);
                    this.updateDashboardStats(notification.stats);
                }
                
                // Traiter les mises à jour du dashboard
                handleDashboardNotification(notification) {
                    console.log('Notification dashboard:', notification);
                    this.refreshDashboardStats();
                }
                
                // Afficher notification toast
                showToast(notification) {
                    // Créer ou mettre à jour le container de toasts
                    let toastContainer = document.querySelector('.toast-container');
                    if (!toastContainer) {
                        toastContainer = document.createElement('div');
                        toastContainer.className = 'toast-container position-fixed top-0 end-0 p-3';
                        toastContainer.style.zIndex = '9999';
                        document.body.appendChild(toastContainer);
                    }
                    
                    // Créer le toast
                    const toastId = 'toast-' + Date.now();
                    const toastHtml = `
                        <div id="${toastId}" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                            <div class="toast-header">
                                <i class="bi bi-bell-fill text-primary me-2"></i>
                                <strong class="me-auto">Notification Admin</strong>
                                <small class="text-muted">À l'instant</small>
                                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
                            </div>
                            <div class="toast-body">
                                ${notification.message}
                            </div>
                        </div>
                    `;
                    
                    toastContainer.insertAdjacentHTML('beforeend', toastHtml);
                    
                    // Afficher le toast
                    const toastElement = document.getElementById(toastId);
                    const toast = new bootstrap.Toast(toastElement, {
                        autohide: true,
                        delay: 5000
                    });
                    toast.show();
                    
                    // Supprimer après fermeture
                    toastElement.addEventListener('hidden.bs.toast', () => {
                        toastElement.remove();
                    });
                }
                
                // Mettre à jour l'indicateur de connexion
                updateConnectionStatus(connected) {
                    const indicator = document.querySelector('.websocket-status');
                    if (indicator) {
                        if (connected) {
                            indicator.className = 'websocket-status badge bg-success';
                            indicator.textContent = 'En ligne';
                        } else {
                            indicator.className = 'websocket-status badge bg-danger';
                            indicator.textContent = 'Hors ligne';
                        }
                    }
                }
                
                // Rafraîchir les statistiques du dashboard
                refreshDashboardStats() {
                    // Déclencher un rafraîchissement des données
                    if (typeof refreshDashboardData === 'function') {
                        refreshDashboardData();
                    }
                }
                
                // Obtenir la couleur du statut
                getStatusColor(status) {
                    const statusColors = {
                        'PENDING': 'warning',
                        'CONFIRMED': 'info',
                        'IN_PROGRESS': 'primary',
                        'COMPLETED': 'success',
                        'CANCELLED': 'danger',
                        'REFUNDED': 'secondary'
                    };
                    return statusColors[status] || 'secondary';
                }
                
                // Déconnexion
                disconnect() {
                    if (this.stompClient && this.connected) {
                        // Désabonnement de tous les topics
                        this.subscriptions.forEach(subscription => {
                            subscription.unsubscribe();
                        });
                        this.subscriptions.clear();
                        
                        // Déconnexion
                        this.stompClient.disconnect();
                        this.connected = false;
                        console.log('WebSocket déconnecté');
                    }
                }
            }
            
            // Instance globale
            window.wsManager = new WebSocketManager();
            
            // Auto-connexion si on est sur une page admin
            if (window.location.pathname.startsWith('/admin')) {
                window.wsManager.connect();
            }
            
            // Déconnexion automatique à la fermeture de la page
            window.addEventListener('beforeunload', () => {
                if (window.wsManager) {
                    window.wsManager.disconnect();
                }
            });
        </script>
    </th:block>
</head>
</html>
