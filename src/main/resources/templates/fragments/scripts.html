<!-- JavaScript Functions Fragment -->
<script th:fragment="navigation-scripts">
    // Variables globales d'authentification disponibles pour tous les scripts
    window.AUTH_INFO = {
        isAuthenticated: [[${#authentication != null}]],
        currentUser: "[[${currentUserDisplayName != null ? currentUserDisplayName : (#authentication != null and #authentication.name != 'anonymousUser' ? #authentication.name.split('@')[0] : '')}]]",
        userEmail: "[[${#authentication != null and #authentication.name != 'anonymousUser' ? #authentication.name : ''}]]"
    };
    
    // DEBUG: Ajouter des informations d'authentification pour diagnostiquer
    console.log('DEBUG: Navigation scripts chargés');
    console.log('DEBUG: État d\'authentification côté template:', window.AUTH_INFO);
    
    // Mobile menu toggle
    function toggleMobileMenu() {
        const menu = document.getElementById('mobileMenu');
        menu.classList.toggle('hidden');
    }
    
    // Fermer le menu mobile en cliquant à l'extérieur
    document.addEventListener('click', function(event) {
        const mobileMenu = document.getElementById('mobileMenu');
        
        if (mobileMenu && !event.target.closest('.md\\:hidden')) {
            mobileMenu.classList.add('hidden');
        }
    });
</script>

<!-- Script inline pour compatibilité et fonctions d'aide -->
<script th:fragment="booking-helpers">
    /**
     * Fonctions d'exemple pour différents services
     * À utiliser dans les boutons des pages de services
     * Note: openServiceModal est défini dans register-checkout.js
     */
