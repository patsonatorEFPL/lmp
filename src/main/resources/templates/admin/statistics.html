<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Statistiques - LMP Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <script>
        (function () {
            var t = localStorage.getItem('lmp-dashboard-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    </style>
</head>
<body>

<div class="db-overlay" id="db-overlay" onclick="closeSidebar()"></div>

<div class="db-root db-admin-root" id="db-root">

    <!-- SIDEBAR -->
    <div th:replace="~{admin/fragments/admin-sidebar :: sidebar(activeNav='statistics')}"></div>

    <!-- MAIN -->
    <div class="db-main">

        <div th:replace="~{admin/fragments/admin-header :: header(title='Statistiques', subtitle='Analyses et tendances')}"></div>

        <div class="db-content">

            <!-- Stat Cards -->
            <div class="db-stat-grid-4">
                <div class="db-stat-card">
                    <div class="db-stat-header">
                        <span class="db-stat-label"><i class="fas fa-users"></i> Utilisateurs</span>
                        <span class="db-stat-icon-badge" style="background:var(--db-accent-light);color:var(--db-accent);">
                            <i class="fas fa-users"></i>
                        </span>
                    </div>
                    <div class="db-stat-value" th:text="${totalUsers ?: 0}">0</div>
                    <span class="db-stat-badge db-badge-up"><i class="fas fa-user-check"></i> Total enregistrés</span>
                </div>
                <div class="db-stat-card">
                    <div class="db-stat-header">
                        <span class="db-stat-label"><i class="fas fa-user-check"></i> Actifs</span>
                        <span class="db-stat-icon-badge" style="background:var(--db-success-light);color:var(--db-success);">
                            <i class="fas fa-user-check"></i>
                        </span>
                    </div>
                    <div class="db-stat-value" th:text="${statusDistribution != null and #lists.size(statusDistribution) > 0 ? statusDistribution[0] : 0}">0</div>
                    <span class="db-stat-badge db-badge-up"><i class="fas fa-check"></i> Comptes actifs</span>
                </div>
                <div class="db-stat-card">
                    <div class="db-stat-header">
                        <span class="db-stat-label"><i class="fas fa-user-times"></i> Inactifs</span>
                        <span class="db-stat-icon-badge" style="background:var(--db-warning-light);color:var(--db-warning);">
                            <i class="fas fa-user-times"></i>
                        </span>
                    </div>
                    <div class="db-stat-value" th:text="${statusDistribution != null and #lists.size(statusDistribution) > 1 ? statusDistribution[1] : 0}">0</div>
                    <span class="db-stat-badge db-badge-down"><i class="fas fa-pause"></i> Comptes inactifs</span>
                </div>
                <div class="db-stat-card">
                    <div class="db-stat-header">
                        <span class="db-stat-label"><i class="fas fa-chart-line"></i> Tendance</span>
                        <span class="db-stat-icon-badge" style="background:rgba(76,201,240,0.12);color:var(--db-accent-cyan);">
                            <i class="fas fa-chart-line"></i>
                        </span>
                    </div>
                    <div class="db-stat-value" style="font-size:22px;">↗ Croissance</div>
                    <span class="db-stat-badge db-badge-up"><i class="fas fa-arrow-up"></i> Ce mois</span>
                </div>
            </div>

            <!-- Charts Row -->
            <div class="db-chart-row">
                <!-- Registrations Chart -->
                <div class="db-card">
                    <div class="db-card-header">
                        <span class="db-card-title"><i class="fas fa-user-plus"></i> Inscriptions mensuelles</span>
                        <div class="db-card-actions">
                            <select class="db-period-select" id="regPeriod">
                                <option value="6">6 mois</option>
                                <option value="12">12 mois</option>
                            </select>
                        </div>
                    </div>
                    <div class="db-chart-canvas-wrap" style="margin-top:12px;">
                        <canvas id="registrationsChart"></canvas>
                    </div>
                </div>

                <!-- Status Distribution -->
                <div class="db-card">
                    <div class="db-card-header">
                        <span class="db-card-title"><i class="fas fa-chart-pie"></i> Répartition par statut</span>
                    </div>
                    <div class="db-chart-canvas-wrap" style="margin-top:12px;max-height:260px;display:flex;align-items:center;justify-content:center;">
                        <canvas id="statusChart"></canvas>
                    </div>
                    <div class="db-donut-channels" style="margin-top:12px;">
                        <div class="db-donut-channel">
                            <span class="db-donut-channel-label">
                                <span class="db-donut-channel-dot" style="background:var(--db-success);"></span> Actifs
                            </span>
                            <span class="db-donut-channel-value" th:text="${statusDistribution != null ? statusDistribution[0] : 0}">0</span>
                        </div>
                        <div class="db-donut-channel">
                            <span class="db-donut-channel-label">
                                <span class="db-donut-channel-dot" style="background:var(--db-warning);"></span> Inactifs
                            </span>
                            <span class="db-donut-channel-value" th:text="${statusDistribution != null ? statusDistribution[1] : 0}">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Activity Chart -->
            <div class="db-card">
                <div class="db-card-header">
                    <span class="db-card-title"><i class="fas fa-activity"></i> Activité mensuelle (%)</span>
                </div>
                <div class="db-chart-canvas-wrap" style="margin-top:12px;min-height:240px;">
                    <canvas id="activityChart"></canvas>
                </div>
            </div>

        </div><!-- /db-content -->
    </div><!-- /db-main -->
</div><!-- /db-root -->

<!-- Toast -->
<div class="db-toast" id="db-toast">
    <i class="fas fa-info-circle"></i>
    <span id="db-toast-message"></span>
</div>

<th:block th:replace="~{admin/fragments/admin-scripts :: scripts}"></th:block>

<script th:inline="javascript">
    var monthlyRegistrations = /*[[${monthlyRegistrations}]]*/ [0,0,0,0,0,0];
    var monthlyActivity = /*[[${monthlyActivity}]]*/ [0,0,0,0,0,0];
    var statusDistribution = /*[[${statusDistribution}]]*/ [0,0,0];

    // Theme-aware colors
    function getChartColors() {
        var style = getComputedStyle(document.documentElement);
        return {
            accent: style.getPropertyValue('--db-accent').trim() || '#7c3aed',
            accentCyan: style.getPropertyValue('--db-accent-cyan').trim() || '#a78bfa',
            success: style.getPropertyValue('--db-success').trim() || '#22c55e',
            warning: style.getPropertyValue('--db-warning').trim() || '#f59e0b',
            danger: style.getPropertyValue('--db-danger').trim() || '#ef4444',
            textMuted: style.getPropertyValue('--db-text-muted').trim() || '#9ca3af',
            border: style.getPropertyValue('--db-border').trim() || '#e8eaf0'
        };
    }

    var months = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin'];

    document.addEventListener('DOMContentLoaded', function () {
        var c = getChartColors();

        // Registrations bar chart
        new Chart(document.getElementById('registrationsChart'), {
            type: 'bar',
            data: {
                labels: months,
                datasets: [{
                    label: 'Inscriptions',
                    data: monthlyRegistrations,
                    backgroundColor: c.accent + '80',
                    borderColor: c.accent,
                    borderWidth: 1,
                    borderRadius: 6,
                    barPercentage: 0.6
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: c.border }, ticks: { color: c.textMuted, font: { size: 11 } } },
                    x: { grid: { display: false }, ticks: { color: c.textMuted, font: { size: 11 } } }
                }
            }
        });

        // Status doughnut chart
        new Chart(document.getElementById('statusChart'), {
            type: 'doughnut',
            data: {
                labels: ['Actifs', 'Inactifs'],
                datasets: [{
                    data: [statusDistribution[0], statusDistribution[1]],
                    backgroundColor: [c.success, c.warning],
                    borderWidth: 0,
                    cutout: '70%'
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } }
            }
        });

        // Activity line chart
        new Chart(document.getElementById('activityChart'), {
            type: 'line',
            data: {
                labels: months,
                datasets: [{
                    label: 'Activité %',
                    data: monthlyActivity,
                    borderColor: c.accentCyan,
                    backgroundColor: c.accentCyan + '20',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 4,
                    pointBackgroundColor: c.accentCyan
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, max: 100, grid: { color: c.border }, ticks: { color: c.textMuted, font: { size: 11 }, callback: function (v) { return v + '%'; } } },
                    x: { grid: { display: false }, ticks: { color: c.textMuted, font: { size: 11 } } }
                }
            }
        });
    });
</script>

</body>
</html>
