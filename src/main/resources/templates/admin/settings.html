<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Paramètres - LMP Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">

    <script>
        (function () {
            var t = localStorage.getItem('lmp-dashboard-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    </style>
</head>
<body>

<div class="db-overlay" id="db-overlay" onclick="closeSidebar()"></div>

<div class="db-root db-admin-root" id="db-root">

    <!-- SIDEBAR -->
    <div th:replace="~{admin/fragments/admin-sidebar :: sidebar(activeNav='settings')}"></div>

    <!-- MAIN -->
    <div class="db-main">

        <div th:replace="~{admin/fragments/admin-header :: header(title='Paramètres', subtitle='Configuration système')}"></div>

        <div class="db-content">

            <!-- Success / Error Messages -->
            <div th:if="${successMessage}" class="db-alert db-alert-success">
                <i class="fas fa-check-circle" style="flex-shrink:0;margin-top:2px;"></i>
                <span th:text="${successMessage}">Succès</span>
                <button class="db-alert-close" onclick="this.parentElement.remove()">&times;</button>
            </div>
            <div th:if="${errorMessage}" class="db-alert db-alert-danger">
                <i class="fas fa-exclamation-triangle" style="flex-shrink:0;margin-top:2px;"></i>
                <span th:text="${errorMessage}">Erreur</span>
                <button class="db-alert-close" onclick="this.parentElement.remove()">&times;</button>
            </div>

            <div style="display:grid;grid-template-columns:280px 1fr;gap:20px;">

                <!-- Left Panel: Config Overview -->
                <div class="db-card" style="align-self:start;">
                    <div class="db-card-header">
                        <span class="db-card-title"><i class="fas fa-chart-pie"></i> État configuration</span>
                    </div>

                    <!-- Progress -->
                    <div style="margin:12px 0;">
                        <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
                            <span style="font-size:11px;color:var(--db-text-muted);">Complétude</span>
                            <span style="font-size:12px;font-weight:600;" th:text="${configStats?.configurationPercentage ?: 0} + '%'">0%</span>
                        </div>
                        <div class="db-config-progress">
                            <div class="db-config-progress-fill" th:style="'width:' + ${configStats?.configurationPercentage ?: 0} + '%'"></div>
                        </div>
                    </div>

                    <!-- Stats Grid -->
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">
                        <div class="db-config-stat-card">
                            <div class="db-config-stat-icon" style="color:#3b82f6;"><i class="fas fa-laptop-code"></i></div>
                            <div class="db-config-stat-label">Application</div>
                            <i th:class="${configStats?.appConfigured} ? 'fas fa-check' : 'fas fa-times'"
                               th:style="${configStats?.appConfigured} ? 'color:var(--db-success)' : 'color:var(--db-danger)'"></i>
                        </div>
                        <div class="db-config-stat-card">
                            <div class="db-config-stat-icon" style="color:#06b6d4;"><i class="fas fa-building"></i></div>
                            <div class="db-config-stat-label">Entreprise</div>
                            <i th:class="${configStats?.companyConfigured} ? 'fas fa-check' : 'fas fa-times'"
                               th:style="${configStats?.companyConfigured} ? 'color:var(--db-success)' : 'color:var(--db-danger)'"></i>
                        </div>
                        <div class="db-config-stat-card">
                            <div class="db-config-stat-icon" style="color:var(--db-warning);"><i class="fas fa-envelope"></i></div>
                            <div class="db-config-stat-label">Email</div>
                            <i th:class="${configStats?.emailConfigured} ? 'fas fa-check' : 'fas fa-times'"
                               th:style="${configStats?.emailConfigured} ? 'color:var(--db-success)' : 'color:var(--db-danger)'"></i>
                        </div>
                        <div class="db-config-stat-card">
                            <div class="db-config-stat-icon" style="color:var(--db-success);"><i class="fas fa-credit-card"></i></div>
                            <div class="db-config-stat-label">Stripe</div>
                            <i th:class="${configStats?.stripeConfigured} ? 'fas fa-check' : 'fas fa-times'"
                               th:style="${configStats?.stripeConfigured} ? 'color:var(--db-success)' : 'color:var(--db-danger)'"></i>
                        </div>
                    </div>

                    <!-- Quick Actions -->
                    <div style="display:flex;flex-direction:column;gap:6px;">
                        <button type="button" class="db-btn db-btn-sm" onclick="testEmailConfig()" style="width:100%;justify-content:center;">
                            <i class="fas fa-envelope"></i> Tester Email
                        </button>
                        <button type="button" class="db-btn db-btn-sm db-btn-warning" onclick="resetToDefaults()" style="width:100%;justify-content:center;">
                            <i class="fas fa-undo"></i> Réinitialiser
                        </button>
                        <button type="button" class="db-btn db-btn-sm" onclick="exportConfig()" style="width:100%;justify-content:center;">
                            <i class="fas fa-download"></i> Exporter
                        </button>
                    </div>
                </div>

                <!-- Right Panel: Settings Form -->
                <div class="db-card">
                    <form th:action="@{/admin/settings/save}" th:object="${settings}" method="post">

                        <!-- Tabs -->
                        <div class="db-tabs" id="settingsTabs">
                            <button type="button" class="db-tab active" data-tab="app">
                                <i class="fas fa-laptop-code"></i> Application
                            </button>
                            <button type="button" class="db-tab" data-tab="company">
                                <i class="fas fa-building"></i> Entreprise
                            </button>
                            <button type="button" class="db-tab" data-tab="email">
                                <i class="fas fa-envelope"></i> Email
                            </button>
                            <button type="button" class="db-tab" data-tab="security">
                                <i class="fas fa-shield-alt"></i> Sécurité
                            </button>
                            <button type="button" class="db-tab" data-tab="payment">
                                <i class="fas fa-credit-card"></i> Paiements
                            </button>
                        </div>

                        <!-- Tab: Application -->
                        <div class="db-tab-content active" id="tab-app">
                            <div class="db-form-section">
                                <div class="db-form-section-title"><i class="fas fa-laptop-code"></i> Configuration Application</div>
                                <div class="db-form-row">
                                    <div class="db-form-group">
                                        <label class="db-form-label">Nom de l'application *</label>
                                        <input type="text" class="db-input" th:field="*{appName}" required>
                                    </div>
                                    <div class="db-form-group">
                                        <label class="db-form-label">Version *</label>
                                        <input type="text" class="db-input" th:field="*{appVersion}" placeholder="1.0.0" required>
                                    </div>
                                    <div class="db-form-group">
                                        <label class="db-form-label">URL de base *</label>
                                        <input type="url" class="db-input" th:field="*{appBaseUrl}" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Tab: Company -->
                        <div class="db-tab-content" id="tab-company">
                            <div class="db-form-section">
                                <div class="db-form-section-title"><i class="fas fa-building"></i> Informations Entreprise</div>
                                <div class="db-form-row">
                                    <div class="db-form-group">
                                        <label class="db-form-label">Nom *</label>
                                        <input type="text" class="db-input" th:field="*{companyName}" required>
                                    </div>
                                    <div class="db-form-group">
                                        <label class="db-form-label">Email de contact</label>
                                        <input type="email" class="db-input" th:field="*{companyEmail}">
                                    </div>
                                </div>
                                <div class="db-form-row" style="margin-top:12px;">
                                    <div class="db-form-group">
                                        <label class="db-form-label">Téléphone</label>
                                        <input type="tel" class="db-input" th:field="*{companyPhone}">
                                    </div>
                                    <div class="db-form-group">
                                        <label class="db-form-label">Site web</label>
                                        <input type="url" class="db-input" th:field="*{companyWebsite}">
                                    </div>
                                </div>
                                <div class="db-form-group" style="margin-top:12px;">
                                    <label class="db-form-label">Adresse</label>
                                    <textarea class="db-textarea" th:field="*{companyAddress}" rows="3"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Tab: Email -->
                        <div class="db-tab-content" id="tab-email">
                            <div class="db-form-section">
                                <div class="db-form-section-title"><i class="fas fa-envelope"></i> Configuration Email SMTP</div>
                                <div class="db-form-row">
                                    <div class="db-form-group" style="flex:2;">
                                        <label class="db-form-label">Serveur SMTP *</label>
                                        <input type="text" class="db-input" id="mailHost" th:field="*{mailHost}" required>
                                    </div>
                                    <div class="db-form-group">
                                        <label class="db-form-label">Port *</label>
                                        <input type="number" class="db-input" id="mailPort" th:field="*{mailPort}" required>
                                    </div>
                                </div>
                                <div class="db-form-row" style="margin-top:12px;">
                                    <div class="db-form-group" style="flex:2;">
                                        <label class="db-form-label">Nom d'utilisateur</label>
                                        <input type="text" class="db-input" id="mailUsername" th:field="*{mailUsername}">
                                    </div>
                                    <div class="db-form-group" style="display:flex;align-items:flex-end;">
                                        <div class="db-checkbox-group">
                                            <input type="checkbox" id="mailAuthEnabled" th:field="*{mailAuthEnabled}">
                                            <label for="mailAuthEnabled">Auth. requise</label>
                                        </div>
                                    </div>
                                </div>
                                <div style="margin-top:16px;display:flex;align-items:center;gap:12px;">
                                    <button type="button" class="db-btn db-btn-sm" onclick="testEmailConfig()">
                                        <i class="fas fa-paper-plane"></i> Tester
                                    </button>
                                    <span id="emailTestResult" style="font-size:12px;"></span>
                                </div>
                            </div>
                        </div>

                        <!-- Tab: Security -->
                        <div class="db-tab-content" id="tab-security">
                            <div class="db-form-section">
                                <div class="db-form-section-title"><i class="fas fa-shield-alt"></i> Paramètres de Sécurité</div>
                                <div class="db-form-row">
                                    <div class="db-form-group">
                                        <label class="db-form-label">Longueur min. mot de passe</label>
                                        <input type="number" class="db-input" th:field="*{passwordMinLength}" min="6" max="50">
                                    </div>
                                    <div class="db-form-group">
                                        <label class="db-form-label">Tentatives max</label>
                                        <input type="number" class="db-input" th:field="*{maxLoginAttempts}" min="1" max="10">
                                    </div>
                                    <div class="db-form-group">
                                        <label class="db-form-label">Durée verrouillage (ms)</label>
                                        <input type="number" class="db-input" th:field="*{accountLockoutDuration}" min="60000">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Tab: Payment -->
                        <div class="db-tab-content" id="tab-payment">
                            <div class="db-form-section">
                                <div class="db-form-section-title"><i class="fas fa-credit-card"></i> Configuration Paiements</div>
                                <div class="db-form-row">
                                    <div class="db-form-group">
                                        <label class="db-form-label">Devise par défaut *</label>
                                        <select class="db-select" th:field="*{defaultCurrency}" required>
                                            <option value="CAD">CAD - Dollar Canadien</option>
                                            <option value="USD">USD - Dollar Américain</option>
                                            <option value="EUR">EUR - Euro</option>
                                        </select>
                                    </div>
                                    <div class="db-form-group">
                                        <label class="db-form-label">Montant minimum</label>
                                        <input type="number" class="db-input" th:field="*{minAmount}" min="0.01" step="0.01">
                                    </div>
                                    <div class="db-form-group">
                                        <label class="db-form-label">Montant maximum</label>
                                        <input type="number" class="db-input" th:field="*{maxAmount}" min="1.00" step="0.01">
                                    </div>
                                </div>
                            </div>
                            <div class="db-form-section">
                                <div class="db-form-section-title"><i class="fab fa-stripe"></i> Configuration Stripe</div>
                                <div class="db-form-row">
                                    <div class="db-form-group" style="flex:2;">
                                        <label class="db-form-label">Clé publique Stripe</label>
                                        <input type="text" class="db-input" th:field="*{stripePublishableKey}" placeholder="pk_test_...">
                                    </div>
                                    <div class="db-form-group" style="display:flex;align-items:flex-end;">
                                        <div class="db-checkbox-group">
                                            <input type="checkbox" th:field="*{stripeTestMode}">
                                            <label>Mode test</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Form Actions -->
                        <div class="db-form-actions">
                            <button type="submit" class="db-btn db-btn-accent db-btn-lg">
                                <i class="fas fa-save"></i> Sauvegarder
                            </button>
                            <button type="button" class="db-btn db-btn-lg" onclick="validateForm()">
                                <i class="fas fa-check"></i> Valider
                            </button>
                            <a th:href="@{/admin/settings}" class="db-btn db-btn-lg" style="color:var(--db-danger);">
                                <i class="fas fa-times"></i> Annuler
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Responsive: stack panels on mobile -->
            <style>
                @media (max-width: 900px) {
                    .db-content > div:last-child { grid-template-columns: 1fr !important; }
                }
            </style>

        </div><!-- /db-content -->
    </div><!-- /db-main -->
</div><!-- /db-root -->

<!-- Toast -->
<div class="db-toast" id="db-toast">
    <i class="fas fa-info-circle"></i>
    <span id="db-toast-message"></span>
</div>

<th:block th:replace="~{admin/fragments/admin-scripts :: scripts}"></th:block>

<script>
    // ── Tabs logic ──
    document.querySelectorAll('.db-tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
            document.querySelectorAll('.db-tab').forEach(function (t) { t.classList.remove('active'); });
            document.querySelectorAll('.db-tab-content').forEach(function (c) { c.classList.remove('active'); });
            this.classList.add('active');
            document.getElementById('tab-' + this.getAttribute('data-tab')).classList.add('active');
        });
    });

    // ── Test email ──
    function testEmailConfig() {
        var hostEl = document.getElementById('mailHost');
        var portEl = document.getElementById('mailPort');
        var userEl = document.getElementById('mailUsername');
        var authEl = document.getElementById('mailAuthEnabled');
        if (!hostEl) { showToast('Ouvrez l\'onglet Email d\'abord', 'warning'); return; }

        adminFetch('/admin/settings/test-email', {
            method: 'POST',
            body: JSON.stringify({
                mailHost: hostEl.value,
                mailPort: portEl ? parseInt(portEl.value) : 587,
                mailUsername: userEl ? userEl.value : '',
                mailAuthEnabled: authEl ? authEl.checked : false
            })
        })
        .then(function (r) { return r.json(); })
        .then(function (d) {
            var el = document.getElementById('emailTestResult');
            if (el) {
                el.textContent = d.message || (d.success ? '✓ OK' : '✗ Erreur');
                el.style.color = d.success ? 'var(--db-success)' : 'var(--db-danger)';
            }
            showToast(d.message || 'Test effectué', d.success ? 'success' : 'error');
        })
        .catch(function () { showToast('Erreur lors du test', 'error'); });
    }

    // ── Validate ──
    function validateForm() {
        var form = document.querySelector('form');
        var formData = new FormData(form);
        var data = {};
        formData.forEach(function (v, k) { data[k] = v; });
        adminFetch('/admin/settings/validate', {
            method: 'POST',
            body: JSON.stringify(data)
        })
        .then(function (r) { return r.json(); })
        .then(function (d) { showToast(d.message, d.success ? 'success' : 'error'); })
        .catch(function () { showToast('Erreur de validation', 'error'); });
    }

    // ── Reset ──
    function resetToDefaults() {
        if (!confirmAction('Réinitialiser tous les paramètres aux valeurs par défaut ?')) return;
        adminFetch('/admin/settings/reset', { method: 'POST' })
            .then(function (r) {
                if (r.ok) { showToast('Réinitialisé avec succès', 'success'); setTimeout(function () { location.reload(); }, 1000); }
                else showToast('Erreur', 'error');
            })
            .catch(function () { showToast('Erreur', 'error'); });
    }

    // ── Export ──
    function exportConfig() {
        fetch('/admin/settings/export')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url; a.download = 'lmp-settings-' + new Date().toISOString().split('T')[0] + '.json';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('Configuration exportée', 'success');
            })
            .catch(function () { showToast('Erreur export', 'error'); });
    }
</script>

</body>
</html>
