<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
  Admin Common Scripts Fragment
  Usage: <div th:replace="~{admin/fragments/admin-scripts :: scripts}"></div>
-->
<th:block th:fragment="scripts">
<script>
    /* ── Date ── */
    (function () {
        var now = new Date();
        var opts = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
        var el = document.getElementById('current-date');
        if (el) el.textContent = now.toLocaleDateString('fr-FR', opts);
    })();

    /* ── Theme toggle ── */
    function toggleTheme() {
        var root = document.documentElement;
        var current = root.getAttribute('data-theme') || 'light';
        var next = current === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem('lmp-dashboard-theme', next);
        var icon = document.getElementById('theme-icon');
        if (icon) icon.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }
    (function () {
        var t = localStorage.getItem('lmp-dashboard-theme') || 'light';
        var icon = document.getElementById('theme-icon');
        if (icon) icon.className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    })();

    /* ── Mobile sidebar ── */
    function openSidebar() {
        document.getElementById('db-sidebar').classList.add('open');
        document.getElementById('db-overlay').classList.add('open');
    }
    function closeSidebar() {
        document.getElementById('db-sidebar').classList.remove('open');
        document.getElementById('db-overlay').classList.remove('open');
    }

    /* ── CSRF helper ── */
    var csrfMeta = document.querySelector('meta[name="_csrf"]');
    var csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
    var csrfToken = csrfMeta ? csrfMeta.getAttribute('content') : null;
    var csrfHeader = csrfHeaderMeta ? csrfHeaderMeta.getAttribute('content') : null;

    /* ── Toast notifications ── */
    function showToast(message, type) {
        var t = document.getElementById('db-toast');
        var m = document.getElementById('db-toast-message');
        if (!t || !m) return;
        m.textContent = message;
        t.className = 'db-toast show db-toast-' + (type || 'info');
        setTimeout(function () { t.classList.remove('show'); }, 4000);
    }

    /* ── Confirm dialog helper ── */
    function confirmAction(message) {
        return confirm(message);
    }

    /* ── Fetch helper with CSRF ── */
    function adminFetch(url, options) {
        options = options || {};
        options.headers = options.headers || {};
        options.headers['Content-Type'] = options.headers['Content-Type'] || 'application/json';
        if (csrfToken && csrfHeader) {
            options.headers[csrfHeader] = csrfToken;
        }
        return fetch(url, options);
    }
</script>
</th:block>

</html>
