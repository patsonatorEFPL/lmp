<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Commandes - LMP Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">

    <script>
        (function () {
            var t = localStorage.getItem('lmp-dashboard-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    </style>
</head>
<body>

<div class="db-overlay" id="db-overlay" onclick="closeSidebar()"></div>

<div class="db-root db-admin-root" id="db-root">

    <!-- SIDEBAR -->
    <div th:replace="~{admin/fragments/admin-sidebar :: sidebar(activeNav='orders')}"></div>

    <!-- MAIN -->
    <div class="db-main">

        <div th:replace="~{admin/fragments/admin-header :: header(title='Commandes', subtitle='Gestion des commandes clients')}"></div>

        <div class="db-content">

            <!-- Stat Cards -->
            <div class="db-stat-grid-4">
                <div class="db-stat-card">
                    <div class="db-stat-header">
                        <span class="db-stat-label"><i class="fas fa-shopping-cart"></i> Total</span>
                        <span class="db-stat-icon-badge" style="background:var(--db-accent-light);color:var(--db-accent);">
                            <i class="fas fa-shopping-cart"></i>
                        </span>
                    </div>
                    <div class="db-stat-value" id="totalOrdersCount" th:text="${totalOrders ?: 0}">0</div>
                </div>
                <div class="db-stat-card">
                    <div class="db-stat-header">
                        <span class="db-stat-label"><i class="fas fa-exclamation-triangle"></i> Attention requise</span>
                        <span class="db-stat-icon-badge" style="background:var(--db-warning-light);color:var(--db-warning);">
                            <i class="fas fa-exclamation-triangle"></i>
                        </span>
                    </div>
                    <div class="db-stat-value" id="needsAttentionCount" th:text="${#lists.size(needsAttention) ?: 0}">0</div>
                </div>
                <div class="db-stat-card">
                    <div class="db-stat-header">
                        <span class="db-stat-label"><i class="fas fa-calendar-day"></i> Aujourd'hui</span>
                        <span class="db-stat-icon-badge" style="background:var(--db-success-light);color:var(--db-success);">
                            <i class="fas fa-calendar-day"></i>
                        </span>
                    </div>
                    <div class="db-stat-value" id="todayOrdersCount">0</div>
                </div>
                <div class="db-stat-card">
                    <div class="db-stat-header">
                        <span class="db-stat-label"><i class="fas fa-dollar-sign"></i> CA du mois</span>
                        <span class="db-stat-icon-badge" style="background:var(--db-warning-light);color:var(--db-warning);">
                            <i class="fas fa-dollar-sign"></i>
                        </span>
                    </div>
                    <div class="db-stat-value" id="monthlyRevenue">0 $</div>
                </div>
            </div>

            <!-- Attention Alert -->
            <div class="db-alert db-alert-warning" th:if="${needsAttention != null and #lists.size(needsAttention) > 0}">
                <i class="fas fa-exclamation-triangle" style="flex-shrink:0;margin-top:2px;"></i>
                <div style="flex:1;">
                    <strong th:text="${#lists.size(needsAttention)}">0</strong> commande(s) nécessitent votre attention.
                    <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;">
                        <a th:each="order : ${needsAttention}"
                           th:href="@{/admin/orders/{id}(id=${order.id})}"
                           class="db-btn db-btn-sm" style="font-size:11px;">
                            #<span th:text="${order.id}">0</span> — <span th:text="${order.customerEmail}">email</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Search Filters -->
            <div class="db-card">
                <div class="db-card-header" style="margin-bottom:12px;">
                    <span class="db-card-title"><i class="fas fa-filter"></i> Filtres de recherche</span>
                    <div class="db-card-actions">
                        <button class="db-btn db-btn-sm" id="refreshBtn" onclick="loadOrdersData()">
                            <i class="fas fa-sync"></i> Actualiser
                        </button>
                        <button class="db-btn db-btn-sm db-btn-accent" onclick="openModal('exportModal')">
                            <i class="fas fa-download"></i> Exporter
                        </button>
                    </div>
                </div>
                <form id="searchForm">
                    <div class="db-filter-bar">
                        <div class="db-filter-group" style="flex:1;min-width:180px;">
                            <label>Recherche</label>
                            <input type="text" class="db-filter-input" id="searchTerm" name="searchTerm" placeholder="ID, email, service…">
                        </div>
                        <div class="db-filter-group">
                            <label>Statut</label>
                            <select class="db-filter-select" id="statusFilter" name="status">
                                <option value="">Tous</option>
                                <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}">PENDING</option>
                            </select>
                        </div>
                        <div class="db-filter-group">
                            <label>Date début</label>
                            <input type="date" class="db-filter-input" id="dateStart" name="startDate">
                        </div>
                        <div class="db-filter-group">
                            <label>Date fin</label>
                            <input type="date" class="db-filter-input" id="dateEnd" name="endDate">
                        </div>
                        <div class="db-filter-group">
                            <label>Email client</label>
                            <input type="email" class="db-filter-input" id="customerEmail" name="customerEmail" placeholder="client@example.com">
                        </div>
                    </div>
                    <div class="db-filter-bar" style="margin-top:10px;">
                        <div class="db-filter-group">
                            <label>Montant min</label>
                            <input type="number" class="db-filter-input" id="minAmount" name="minAmount" placeholder="0" step="0.01" style="width:100px;">
                        </div>
                        <div class="db-filter-group">
                            <label>Montant max</label>
                            <input type="number" class="db-filter-input" id="maxAmount" name="maxAmount" placeholder="1000" step="0.01" style="width:100px;">
                        </div>
                        <div class="db-filter-group">
                            <label>Paiement</label>
                            <select class="db-filter-select" id="paymentStatus" name="paymentStatus">
                                <option value="">Tous</option>
                                <option value="succeeded">Réussi</option>
                                <option value="pending">En attente</option>
                                <option value="failed">Échoué</option>
                            </select>
                        </div>
                        <div class="db-filter-group">
                            <label>Remboursement</label>
                            <select class="db-filter-select" id="hasRefunds" name="hasRefunds">
                                <option value="">Tous</option>
                                <option value="true">Avec</option>
                                <option value="false">Sans</option>
                            </select>
                        </div>
                        <div class="db-filter-group" style="justify-content:flex-end;">
                            <label>&nbsp;</label>
                            <div style="display:flex;gap:6px;">
                                <button type="submit" class="db-btn db-btn-accent"><i class="fas fa-search"></i> Rechercher</button>
                                <button type="button" class="db-btn" id="clearFilters" onclick="clearFilters()"><i class="fas fa-times"></i></button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Bulk Actions + Table -->
            <div class="db-card" style="padding:0;overflow:hidden;">
                <div style="padding:14px 20px;border-bottom:1px solid var(--db-border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
                    <span class="db-card-title"><i class="fas fa-list"></i> Liste des commandes</span>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span style="font-size:12px;color:var(--db-text-muted);" id="selectedCount">0 sélectionnée(s)</span>
                        <div id="bulkActions" style="display:none;gap:4px;" class="db-table-actions">
                            <button class="db-action-btn db-action-btn-warning" data-action="change-status" title="Changer statut"><i class="fas fa-edit"></i></button>
                            <button class="db-action-btn" data-action="sync-stripe" title="Sync Stripe"><i class="fab fa-stripe-s"></i></button>
                            <button class="db-action-btn db-action-btn-danger" data-action="cancel" title="Annuler"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                </div>

                <!-- Loading -->
                <div class="db-empty" id="loadingSpinner" style="display:none;">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Chargement des commandes…</p>
                </div>

                <!-- No Results -->
                <div class="db-empty" id="noResults" style="display:none;">
                    <i class="fas fa-search"></i>
                    <p>Aucune commande trouvée</p>
                </div>

                <!-- Table -->
                <div id="ordersTableWrapper" style="overflow-x:auto;">
                    <table class="db-table" id="ordersTable">
                        <thead>
                            <tr>
                                <th style="width:36px;">
                                    <input type="checkbox" class="db-table-check" id="selectAllCheckbox">
                                </th>
                                <th>ID</th>
                                <th>Date</th>
                                <th>Client</th>
                                <th class="db-hide-tablet">Service</th>
                                <th>Montant</th>
                                <th>Statut</th>
                                <th class="db-hide-tablet">Paiement</th>
                                <th style="text-align:center;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="db-pagination" id="pagination" style="padding:12px;"></div>
            </div>

        </div><!-- /db-content -->
    </div><!-- /db-main -->
</div><!-- /db-root -->

<!-- Export Modal -->
<div class="db-modal-overlay" id="exportModal">
    <div class="db-modal">
        <div class="db-modal-header">
            <span class="db-modal-title"><i class="fas fa-download"></i> Exporter les données</span>
            <button class="db-modal-close" onclick="closeModal('exportModal')">&times;</button>
        </div>
        <div class="db-modal-body">
            <div class="db-form-row">
                <div class="db-form-group">
                    <label class="db-form-label">Date de début</label>
                    <input type="date" class="db-input" id="exportStartDate" required>
                </div>
                <div class="db-form-group">
                    <label class="db-form-label">Date de fin</label>
                    <input type="date" class="db-input" id="exportEndDate" required>
                </div>
            </div>
            <div class="db-form-group" style="margin-top:12px;">
                <label class="db-form-label">Format</label>
                <select class="db-select" id="exportFormat">
                    <option value="csv">CSV</option>
                    <option value="excel">Excel</option>
                </select>
            </div>
        </div>
        <div class="db-modal-footer">
            <button class="db-btn" onclick="closeModal('exportModal')">Annuler</button>
            <button class="db-btn db-btn-accent" id="startExport" onclick="performExport()">
                <i class="fas fa-download"></i> Exporter
            </button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="db-toast" id="db-toast">
    <i class="fas fa-info-circle"></i>
    <span id="db-toast-message"></span>
</div>

<th:block th:replace="~{admin/fragments/admin-scripts :: scripts}"></th:block>

<script th:inline="javascript">
    // ── Configuration ──
    var config = {
        apiBaseUrl: '/admin/orders/api',
        currentPage: 0,
        pageSize: 20,
        sortBy: 'createdAt',
        sortDir: 'desc',
        selectedOrders: new Set(),
        searchParams: {}
    };

    // ── Init ──
    document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('searchForm').addEventListener('submit', function (e) { e.preventDefault(); performSearch(); });
        document.getElementById('selectAllCheckbox').addEventListener('change', toggleSelectAll);
        document.querySelectorAll('[data-action]').forEach(function (btn) {
            btn.addEventListener('click', function () { performBulkAction(this.getAttribute('data-action')); });
        });
        loadOrdersData();
    });

    // ── Load Data ──
    function loadOrdersData() {
        document.getElementById('loadingSpinner').style.display = '';
        document.getElementById('ordersTableWrapper').style.display = 'none';
        document.getElementById('noResults').style.display = 'none';

        var params = new URLSearchParams({
            page: config.currentPage,
            size: config.pageSize,
            sortBy: config.sortBy,
            sortDir: config.sortDir
        });
        Object.keys(config.searchParams).forEach(function (k) {
            if (config.searchParams[k]) params.append(k, config.searchParams[k]);
        });

        fetch(config.apiBaseUrl + '/search?' + params.toString())
            .then(function (r) { return r.json(); })
            .then(function (data) {
                populateTable(data.content || []);
                updatePagination(data);
                document.getElementById('loadingSpinner').style.display = 'none';
                if (!data.content || data.content.length === 0) {
                    document.getElementById('noResults').style.display = '';
                } else {
                    document.getElementById('ordersTableWrapper').style.display = '';
                }
            })
            .catch(function () {
                document.getElementById('loadingSpinner').style.display = 'none';
                showToast('Erreur lors du chargement', 'error');
            });
    }

    // ── Table population ──
    function populateTable(orders) {
        var tbody = document.getElementById('ordersTableBody');
        tbody.innerHTML = '';
        orders.forEach(function (order) {
            var tr = document.createElement('tr');
            tr.setAttribute('data-order-id', order.id);
            tr.innerHTML =
                '<td><input type="checkbox" class="db-table-check order-checkbox" value="' + order.id + '"></td>' +
                '<td><a href="/admin/orders/' + order.id + '" style="color:var(--db-accent);font-weight:600;text-decoration:none;">#' + order.id + '</a></td>' +
                '<td style="font-size:12px;color:var(--db-text-muted);">' + formatDate(order.createdAt) + '</td>' +
                '<td><div style="font-weight:500;color:var(--db-text-primary);">' + (order.customerEmail || '') + '</div>' +
                    (order.customerName ? '<div style="font-size:11px;color:var(--db-text-muted);">' + order.customerName + '</div>' : '') + '</td>' +
                '<td class="db-hide-tablet"><span class="db-status-badge db-status-progress" style="font-size:11px;">' + (order.serviceName || '') + '</span></td>' +
                '<td style="font-weight:600;">' + (order.amount || '0') + ' ' + (order.currency || 'CAD') + '</td>' +
                '<td>' + getStatusBadge(order.status) + '</td>' +
                '<td class="db-hide-tablet">' + getPaymentBadge(order.paymentStatus) + '</td>' +
                '<td><div class="db-table-actions" style="justify-content:center;">' +
                    '<a href="/admin/orders/' + order.id + '" class="db-action-btn" title="Voir"><i class="fas fa-eye"></i></a>' +
                    '<button class="db-action-btn db-action-btn-warning" onclick="syncWithStripe(' + order.id + ')" title="Sync Stripe"><i class="fab fa-stripe-s"></i></button>' +
                '</div></td>';
            tbody.appendChild(tr);
        });
        // Re-attach checkbox events
        document.querySelectorAll('.order-checkbox').forEach(function (cb) {
            cb.addEventListener('change', function () {
                var id = parseInt(this.value);
                if (this.checked) config.selectedOrders.add(id);
                else config.selectedOrders.delete(id);
                updateSelectionUI();
            });
        });
    }

    // ── Status badges ──
    function getStatusBadge(status) {
        var map = { PENDING: 'db-status-pending', CONFIRMED: 'db-status-progress', PROCESSING: 'db-status-progress', SHIPPED: 'db-status-done', DELIVERED: 'db-status-done', CANCELLED: 'db-status-cancel', REFUNDED: 'db-status-cancel' };
        var labels = { PENDING: 'En attente', CONFIRMED: 'Confirmée', PROCESSING: 'En préparation', SHIPPED: 'Expédiée', DELIVERED: 'Livrée', CANCELLED: 'Annulée', REFUNDED: 'Remboursée' };
        return '<span class="db-status-badge ' + (map[status] || '') + '">' + (labels[status] || status || 'N/A') + '</span>';
    }
    function getPaymentBadge(ps) {
        var map = { succeeded: 'db-status-done', pending: 'db-status-pending', failed: 'db-status-cancel' };
        return '<span class="db-status-badge ' + (map[ps] || '') + '">' + (ps || 'N/A') + '</span>';
    }
    function formatDate(d) {
        if (!d) return '';
        var dt = new Date(d);
        return dt.toLocaleDateString('fr-FR') + ' ' + dt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    }

    // ── Search ──
    function performSearch() {
        config.searchParams = {};
        ['searchTerm', 'statusFilter', 'dateStart', 'dateEnd', 'customerEmail', 'minAmount', 'maxAmount', 'paymentStatus', 'hasRefunds'].forEach(function (id) {
            var el = document.getElementById(id);
            var key = el.getAttribute('name') || id;
            if (el.value) {
                if (id === 'dateStart') config.searchParams.startDate = el.value + 'T00:00:00';
                else if (id === 'dateEnd') config.searchParams.endDate = el.value + 'T23:59:59';
                else config.searchParams[key] = el.value;
            }
        });
        config.currentPage = 0;
        loadOrdersData();
    }
    function clearFilters() {
        document.getElementById('searchForm').reset();
        config.searchParams = {};
        config.currentPage = 0;
        loadOrdersData();
    }

    // ── Selection ──
    function toggleSelectAll() {
        var checked = document.getElementById('selectAllCheckbox').checked;
        config.selectedOrders.clear();
        document.querySelectorAll('.order-checkbox').forEach(function (cb) {
            cb.checked = checked;
            if (checked) config.selectedOrders.add(parseInt(cb.value));
        });
        updateSelectionUI();
    }
    function updateSelectionUI() {
        var c = config.selectedOrders.size;
        document.getElementById('selectedCount').textContent = c + ' sélectionnée(s)';
        document.getElementById('bulkActions').style.display = c > 0 ? 'flex' : 'none';
    }

    // ── Bulk actions ──
    function performBulkAction(action) {
        if (config.selectedOrders.size === 0) { showToast('Aucune commande sélectionnée', 'warning'); return; }
        showToast('Action en lot: ' + action, 'info');
    }

    // ── Individual actions ──
    function syncWithStripe(orderId) {
        if (!confirmAction('Synchroniser cette commande avec Stripe ?')) return;
        adminFetch(config.apiBaseUrl + '/' + orderId + '/sync-stripe', { method: 'POST' })
            .then(function (r) { return r.json(); })
            .then(function (d) {
                if (d.success) { showToast('Synchronisation réussie', 'success'); loadOrdersData(); }
                else showToast(d.message, 'error');
            })
            .catch(function () { showToast('Erreur lors de la synchronisation', 'error'); });
    }

    // ── Pagination ──
    function updatePagination(data) {
        var el = document.getElementById('pagination');
        el.innerHTML = '';
        if (!data || data.totalPages <= 1) return;
        // Prev
        el.innerHTML += '<a class="db-page-btn ' + (data.first ? 'disabled' : '') + '" onclick="goToPage(' + (data.number - 1) + ')"><i class="fas fa-chevron-left"></i></a>';
        var start = Math.max(0, data.number - 2), end = Math.min(data.totalPages, data.number + 3);
        for (var i = start; i < end; i++) {
            el.innerHTML += '<a class="db-page-btn ' + (i === data.number ? 'active' : '') + '" onclick="goToPage(' + i + ')">' + (i + 1) + '</a>';
        }
        el.innerHTML += '<a class="db-page-btn ' + (data.last ? 'disabled' : '') + '" onclick="goToPage(' + (data.number + 1) + ')"><i class="fas fa-chevron-right"></i></a>';
    }
    function goToPage(p) { config.currentPage = p; loadOrdersData(); }

    // ── Export ──
    function performExport() {
        var s = document.getElementById('exportStartDate').value;
        var e = document.getElementById('exportEndDate').value;
        var f = document.getElementById('exportFormat').value;
        if (!s || !e) { showToast('Sélectionnez les dates', 'error'); return; }
        window.location.href = config.apiBaseUrl + '/export/' + f + '?startDate=' + s + 'T00:00:00&endDate=' + e + 'T23:59:59';
        closeModal('exportModal');
        showToast('Export en cours…', 'info');
    }

    // ── Modal helpers ──
    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
</script>

</body>
</html>
