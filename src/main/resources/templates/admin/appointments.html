<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Rendez-vous - LMP Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">

    <script>
        (function () {
            var t = localStorage.getItem('lmp-dashboard-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    </style>
</head>
<body>

<div class="db-overlay" id="db-overlay" onclick="closeSidebar()"></div>

<div class="db-root db-admin-root" id="db-root">

    <!-- SIDEBAR -->
    <div th:replace="~{admin/fragments/admin-sidebar :: sidebar(activeNav='appointments')}"></div>

    <!-- MAIN -->
    <div class="db-main">

        <div th:replace="~{admin/fragments/admin-header :: header(title='Rendez-vous', subtitle='Gestion des rendez-vous clients')}"></div>

        <div class="db-content">

            <!-- Success / Error Messages -->
            <div th:if="${successMessage}" class="db-alert db-alert-success">
                <i class="fas fa-check-circle" style="flex-shrink:0;margin-top:2px;"></i>
                <span th:text="${successMessage}">Succès</span>
                <button class="db-alert-close" onclick="this.parentElement.remove()">&times;</button>
            </div>
            <div th:if="${errorMessage}" class="db-alert db-alert-danger">
                <i class="fas fa-exclamation-triangle" style="flex-shrink:0;margin-top:2px;"></i>
                <span th:text="${errorMessage}">Erreur</span>
                <button class="db-alert-close" onclick="this.parentElement.remove()">&times;</button>
            </div>

            <!-- Stat Cards -->
            <div class="db-stat-grid-4">
                <div class="db-stat-card">
                    <div class="db-stat-header">
                        <span class="db-stat-label"><i class="fas fa-calendar-alt"></i> Total</span>
                        <span class="db-stat-icon-badge" style="background:var(--db-accent-light);color:var(--db-accent);">
                            <i class="fas fa-calendar-alt"></i>
                        </span>
                    </div>
                    <div class="db-stat-value" th:text="${totalAppointments ?: 0}">0</div>
                </div>
                <div class="db-stat-card">
                    <div class="db-stat-header">
                        <span class="db-stat-label"><i class="fas fa-check-circle"></i> Confirmés</span>
                        <span class="db-stat-icon-badge" style="background:var(--db-success-light);color:var(--db-success);">
                            <i class="fas fa-check-circle"></i>
                        </span>
                    </div>
                    <div class="db-stat-value" th:text="${confirmedCount ?: 0}">0</div>
                </div>
                <div class="db-stat-card">
                    <div class="db-stat-header">
                        <span class="db-stat-label"><i class="fas fa-clock"></i> En attente</span>
                        <span class="db-stat-icon-badge" style="background:var(--db-warning-light);color:var(--db-warning);">
                            <i class="fas fa-clock"></i>
                        </span>
                    </div>
                    <div class="db-stat-value" th:text="${pendingCount ?: 0}">0</div>
                </div>
                <div class="db-stat-card">
                    <div class="db-stat-header">
                        <span class="db-stat-label"><i class="fas fa-times-circle"></i> Annulés</span>
                        <span class="db-stat-icon-badge" style="background:var(--db-danger-light);color:var(--db-danger);">
                            <i class="fas fa-times-circle"></i>
                        </span>
                    </div>
                    <div class="db-stat-value" th:text="${cancelledCount ?: 0}">0</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="db-card">
                <div class="db-card-header" style="margin-bottom:12px;">
                    <span class="db-card-title"><i class="fas fa-filter"></i> Filtres</span>
                    <div class="db-card-actions">
                        <a th:href="@{/admin/appointments/new}" class="db-btn db-btn-accent db-btn-sm">
                            <i class="fas fa-plus"></i> Nouveau
                        </a>
                        <a th:href="@{/admin/appointments/export}" class="db-btn db-btn-sm db-btn-success">
                            <i class="fas fa-download"></i> Export CSV
                        </a>
                    </div>
                </div>
                <form method="get" th:action="@{/admin/appointments}">
                    <div class="db-filter-bar">
                        <div class="db-filter-group">
                            <label>Statut</label>
                            <select name="status" class="db-filter-select" th:value="${status}">
                                <option value="">Tous les statuts</option>
                                <option th:each="s : ${allStatuses}"
                                        th:value="${s}"
                                        th:text="${s.displayName}"
                                        th:selected="${status == s}">Statut</option>
                            </select>
                        </div>
                        <div class="db-filter-group" style="flex:1;min-width:180px;">
                            <label>Recherche</label>
                            <input type="text" name="search" class="db-filter-input"
                                   placeholder="Rechercher par email…" th:value="${search}">
                        </div>
                        <div class="db-filter-group">
                            <label>Trier par</label>
                            <select name="sortBy" class="db-filter-select">
                                <option value="appointmentDate">Date RDV</option>
                                <option value="createdAt">Date création</option>
                                <option value="status">Statut</option>
                            </select>
                        </div>
                        <div class="db-filter-group">
                            <label>Ordre</label>
                            <select name="sortDirection" class="db-filter-select">
                                <option value="desc">Décroissant</option>
                                <option value="asc">Croissant</option>
                            </select>
                        </div>
                        <div class="db-filter-group" style="justify-content:flex-end;">
                            <label>&nbsp;</label>
                            <button type="submit" class="db-btn db-btn-accent"><i class="fas fa-search"></i> Filtrer</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Appointments Table -->
            <div class="db-card" style="padding:0;overflow:hidden;">
                <div style="padding:14px 20px;border-bottom:1px solid var(--db-border);display:flex;align-items:center;justify-content:space-between;">
                    <span class="db-card-title">
                        <i class="fas fa-calendar-check"></i> Rendez-vous
                        <span style="font-weight:400;color:var(--db-text-muted);margin-left:6px;" th:text="'(' + ${totalAppointments ?: 0} + ')'"></span>
                    </span>
                    <span style="font-size:12px;color:var(--db-text-muted);"
                          th:text="'Page ' + (${currentPage} + 1) + ' / ' + ${totalPages}">Page 1 / 1</span>
                </div>

                <div th:if="${appointments.empty}" class="db-empty">
                    <i class="fas fa-calendar-times"></i>
                    <p>Aucun rendez-vous trouvé</p>
                </div>

                <div th:unless="${appointments.empty}" style="overflow-x:auto;">
                    <table class="db-table">
                        <thead>
                            <tr>
                                <th>Client</th>
                                <th>Sujet</th>
                                <th>Statut</th>
                                <th class="db-hide-tablet">Date RDV</th>
                                <th class="db-hide-mobile">Créé le</th>
                                <th style="text-align:center;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="appointment : ${appointments}">
                                <td>
                                    <div class="db-table-app">
                                        <div class="db-user-avatar" style="width:32px;height:32px;font-size:12px;">
                                            <span th:text="${appointment.effectiveClientName?.substring(0,1)?.toUpperCase()}">A</span>
                                        </div>
                                        <div>
                                            <div class="db-table-app-name" th:text="${appointment.effectiveClientName}">Client</div>
                                            <div class="db-table-type" th:text="${appointment.effectiveClientEmail}">email</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span style="font-weight:500;color:var(--db-text-primary);" th:text="${appointment.subject}">Sujet</span>
                                </td>
                                <td>
                                    <span class="db-status-badge"
                                          th:classappend="${appointment.status.name() == 'PENDING'} ? 'db-status-pending' :
                                              (${appointment.status.name() == 'CONFIRMED'} ? 'db-status-progress' :
                                              (${appointment.status.name() == 'IN_PROGRESS'} ? 'db-status-progress' :
                                              (${appointment.status.name() == 'COMPLETED'} ? 'db-status-done' :
                                              (${appointment.status.name() == 'CANCELLED'} ? 'db-status-cancel' : 'db-status-cancel'))))"
                                          th:text="${appointment.status.displayName}">Statut</span>
                                </td>
                                <td class="db-hide-tablet">
                                    <span style="font-size:12px;" th:text="${#temporals.format(appointment.appointmentDate, 'dd/MM/yyyy HH:mm')}">01/01/2024</span>
                                </td>
                                <td class="db-hide-mobile">
                                    <span style="font-size:12px;color:var(--db-text-muted);" th:text="${#temporals.format(appointment.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2024</span>
                                </td>
                                <td>
                                    <div class="db-table-actions" style="justify-content:center;">
                                        <a th:href="@{'/admin/appointments/' + ${appointment.id}}"
                                           class="db-action-btn" title="Voir détails">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <a th:href="@{'/admin/appointments/' + ${appointment.id} + '/edit'}"
                                           class="db-action-btn db-action-btn-warning" title="Modifier">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <button th:if="${appointment.status.name() == 'PENDING'}"
                                                class="db-action-btn db-action-btn-success"
                                                th:onclick="'confirmAppointment(' + ${appointment.id} + ')'"
                                                title="Confirmer">
                                            <i class="fas fa-check"></i>
                                        </button>
                                        <button th:if="${appointment.status.name() == 'CONFIRMED'}"
                                                class="db-action-btn"
                                                th:onclick="'startAppointment(' + ${appointment.id} + ')'"
                                                title="Démarrer">
                                            <i class="fas fa-play"></i>
                                        </button>
                                        <button class="db-action-btn db-action-btn-danger"
                                                th:onclick="'cancelAppointment(' + ${appointment.id} + ')'"
                                                title="Annuler">
                                            <i class="fas fa-times"></i>
                                        </button>
                                        <button class="db-action-btn db-action-btn-danger"
                                                th:onclick="'deleteAppointmentPermanent(' + ${appointment.id} + ')'"
                                                title="Supprimer">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="db-pagination" th:if="${totalPages > 1}" style="padding:12px;">
                    <a class="db-page-btn" th:classappend="${currentPage == 0} ? 'disabled'"
                       th:href="@{/admin/appointments(page=${currentPage - 1}, size=${pageSize}, status=${status}, search=${search})}">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                    <a th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}"
                       class="db-page-btn" th:classappend="${pageNum == currentPage} ? 'active'"
                       th:href="@{/admin/appointments(page=${pageNum}, size=${pageSize}, status=${status}, search=${search})}"
                       th:text="${pageNum + 1}">1</a>
                    <a class="db-page-btn" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'"
                       th:href="@{/admin/appointments(page=${currentPage + 1}, size=${pageSize}, status=${status}, search=${search})}">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                </div>
            </div>

        </div><!-- /db-content -->
    </div><!-- /db-main -->
</div><!-- /db-root -->

<!-- Toast -->
<div class="db-toast" id="db-toast">
    <i class="fas fa-info-circle"></i>
    <span id="db-toast-message"></span>
</div>

<th:block th:replace="~{admin/fragments/admin-scripts :: scripts}"></th:block>

<script>
    // ── Appointment actions ──
    function confirmAppointment(id) {
        if (!confirmAction('Confirmer ce rendez-vous ?')) return;
        performAppointmentAction('confirm', id);
    }
    function startAppointment(id) {
        if (!confirmAction('Démarrer ce rendez-vous ?')) return;
        performAppointmentAction('start', id);
    }
    function cancelAppointment(id) {
        if (!confirmAction('Annuler ce rendez-vous ?')) return;
        performAppointmentAction('cancel', id);
    }
    function deleteAppointmentPermanent(id) {
        if (!confirmAction('⚠️ ATTENTION: Suppression DÉFINITIVE et IRRÉVERSIBLE !\n\nContinuer ?')) return;
        if (!confirmAction('🔴 DERNIÈRE CONFIRMATION — Êtes-vous ABSOLUMENT sûr ?')) return;
        performAppointmentAction('delete-permanent', id);
    }

    function performAppointmentAction(action, id) {
        adminFetch('/admin/appointments/' + id + '/' + action, { method: 'POST' })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (data.success) {
                    showToast(data.message, 'success');
                    setTimeout(function () { location.reload(); }, 1000);
                } else {
                    showToast(data.message || 'Erreur', 'error');
                }
            })
            .catch(function (e) {
                showToast('Erreur: ' + e.message, 'error');
            });
    }
</script>

</body>
</html>
