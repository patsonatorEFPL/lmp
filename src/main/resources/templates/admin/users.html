<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Gestion des utilisateurs - LMP Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <!-- Bootstrap CSS for modals only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        (function () {
            var t = localStorage.getItem('lmp-dashboard-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

        /* Additional users-specific styles */
        .db-filter-bar {
            display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
        }
        .db-filter-group { display: flex; flex-direction: column; gap: 4px; }
        .db-filter-group label {
            font-size: 11px; font-weight: 600; color: var(--db-text-muted);
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .db-filter-select, .db-filter-input {
            padding: 7px 12px; border-radius: 8px; border: 1px solid var(--db-border);
            background: var(--db-input-bg); color: var(--db-text-primary);
            font-size: 13px; font-family: inherit; outline: none;
            transition: border-color 0.15s;
        }
        /* Modal overrides for dark mode */
        [data-theme="dark"] .modal-content {
            background: var(--db-card-bg); color: var(--db-text-primary);
            border: 1px solid var(--db-border);
        }
        [data-theme="dark"] .modal-header { border-color: var(--db-border); }
        [data-theme="dark"] .modal-body { color: var(--db-text-secondary); }
        [data-theme="dark"] .form-control, [data-theme="dark"] .form-select {
            background: var(--db-input-bg); color: var(--db-text-primary);
            border-color: var(--db-border);
        }

        @media (max-width: 900px) {
            .db-col-company, .db-col-login { display: none; }
        }
        @media (max-width: 600px) {
            .db-col-date { display: none; }
        }
    </style>
</head>
<body>

<div class="db-overlay" id="db-overlay" onclick="closeSidebar()"></div>

<div class="db-root db-admin-root" id="db-root">

    <!-- SIDEBAR -->
    <div th:replace="~{admin/fragments/admin-sidebar :: sidebar(activeNav='users')}"></div>

    <!-- ═══════════════ MAIN ═══════════════ -->
    <div class="db-main">

        <div th:replace="~{admin/fragments/admin-header :: header(title='Utilisateurs', subtitle='Gestion des comptes utilisateurs')}"></div>

        <div class="db-content">

            <!-- Error/Success Messages -->
            <div th:if="${errorMessage}" class="db-alert db-alert-warning">
                <i class="fas fa-exclamation-triangle" style="flex-shrink:0;margin-top:2px;"></i>
                <span th:text="${errorMessage}">Message d'erreur</span>
                <button class="db-alert-close" onclick="this.parentElement.remove()">&times;</button>
            </div>

            <!-- Stat Cards -->
            <div class="db-stat-grid-4">
                <div class="db-stat-card">
                    <div class="db-stat-header">
                        <span class="db-stat-label"><i class="fas fa-users"></i> Total</span>
                    </div>
                    <div class="db-stat-value" th:text="${totalUsers}">0</div>
                </div>
                <div class="db-stat-card">
                    <div class="db-stat-header">
                        <span class="db-stat-label"><i class="fas fa-user-check"></i> Actifs</span>
                    </div>
                    <div class="db-stat-value" th:text="${activeUsers}">0</div>
                </div>
                <div class="db-stat-card">
                    <div class="db-stat-header">
                        <span class="db-stat-label"><i class="fas fa-user-times"></i> Inactifs</span>
                    </div>
                    <div class="db-stat-value" th:text="${inactiveUsers}">0</div>
                </div>
                <div class="db-stat-card">
                    <div class="db-stat-header">
                        <span class="db-stat-label"><i class="fas fa-user-lock"></i> Verrouillés</span>
                    </div>
                    <div class="db-stat-value" th:text="${lockedUsers}">0</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="db-card">
                <form method="get" th:action="@{/admin/users}">
                    <div class="db-filter-bar">
                        <div class="db-filter-group">
                            <label>Statut</label>
                            <select class="db-filter-select" name="status">
                                <option value="">Tous</option>
                                <option value="ACTIVE" th:selected="${currentStatus == 'ACTIVE'}">Actif</option>
                                <option value="INACTIVE" th:selected="${currentStatus == 'INACTIVE'}">Inactif</option>
                            </select>
                        </div>
                        <div class="db-filter-group" style="flex:1;min-width:180px;">
                            <label>Recherche</label>
                            <input type="text" class="db-filter-input" name="search"
                                   th:value="${currentSearch}" placeholder="Rechercher par email…">
                        </div>
                        <div class="db-filter-group">
                            <label>Trier par</label>
                            <select class="db-filter-select" name="sortBy">
                                <option value="registrationDate" th:selected="${currentSort == 'registrationDate'}">Date</option>
                                <option value="email" th:selected="${currentSort == 'email'}">Email</option>
                                <option value="lastLoginDate" th:selected="${currentSort == 'lastLoginDate'}">Connexion</option>
                            </select>
                        </div>
                        <div class="db-filter-group">
                            <label>Ordre</label>
                            <select class="db-filter-select" name="sortDir">
                                <option value="desc" th:selected="${currentSortDir == 'desc'}">Desc</option>
                                <option value="asc" th:selected="${currentSortDir == 'asc'}">Asc</option>
                            </select>
                        </div>
                        <div class="db-filter-group" style="justify-content:flex-end;">
                            <label>&nbsp;</label>
                            <button type="submit" class="db-btn db-btn-accent"><i class="fas fa-search"></i> Filtrer</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Users Table -->
            <div class="db-card" style="padding:0;overflow:hidden;">
                <div style="padding:14px 20px;border-bottom:1px solid var(--db-border);display:flex;align-items:center;justify-content:space-between;">
                    <span class="db-card-title"><i class="fas fa-users"></i> Utilisateurs <span style="font-weight:400;color:var(--db-text-muted);margin-left:6px;" th:text="'(' + ${totalElements} + ')'"></span></span>
                    <span style="font-size:12px;color:var(--db-text-muted);">
                        Page <span th:text="${currentPage + 1}">1</span> / <span th:text="${totalPages}">1</span>
                    </span>
                </div>

                <div th:if="${#lists.isEmpty(usersPage.content)}" class="db-empty">
                    <i class="fas fa-users"></i>
                    <p>Aucun utilisateur trouvé</p>
                </div>

                <div th:unless="${#lists.isEmpty(usersPage.content)}" style="overflow-x:auto;">
                    <table class="db-table">
                        <thead>
                            <tr>
                                <th>Utilisateur</th>
                                <th>Email</th>
                                <th>Statut</th>
                                <th class="db-col-date">Inscription</th>
                                <th class="db-col-login">Dernière connexion</th>
                                <th style="text-align:center;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${usersPage.content}">
                                <td>
                                    <div class="db-table-app">
                                        <div class="db-user-avatar" style="width:32px;height:32px;font-size:12px;">
                                            <span th:text="${user.getDisplayName().substring(0,1).toUpperCase()}">U</span>
                                        </div>
                                        <div>
                                            <div class="db-table-app-name" th:text="${user.getDisplayName()}">Utilisateur</div>
                                            <div class="db-table-type" th:text="${user.companyName ?: 'Particulier'}">Entreprise</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span th:text="${user.email}">email@example.com</span>
                                    <i th:if="${user.emailVerified}" class="fas fa-check-circle" style="color:var(--db-success);margin-left:4px;font-size:11px;" title="Vérifié"></i>
                                    <i th:unless="${user.emailVerified}" class="fas fa-exclamation-circle" style="color:var(--db-warning);margin-left:4px;font-size:11px;" title="Non vérifié"></i>
                                </td>
                                <td>
                                    <span class="db-status-badge"
                                          th:classappend="${user.status.name() == 'ACTIVE'} ? 'db-status-done' : 'db-status-pending'"
                                          th:text="${user.status.name()}">ACTIVE</span>
                                    <span th:if="${user.accountLocked}" class="db-status-badge db-status-cancel" style="margin-left:4px;">
                                        <i class="fas fa-lock" style="font-size:9px;"></i>
                                    </span>
                                </td>
                                <td class="db-col-date">
                                    <span th:text="${user.registrationDate != null ? #temporals.format(user.registrationDate, 'dd/MM/yyyy') : 'N/A'}">01/01/2024</span>
                                </td>
                                <td class="db-col-login">
                                    <span th:text="${user.lastLoginDate != null ? #temporals.format(user.lastLoginDate, 'dd/MM/yyyy HH:mm') : 'Jamais'}">Jamais</span>
                                </td>
                                <td style="text-align:center;">
                                    <div class="db-table-actions" style="justify-content:center;">
                                        <button class="db-action-btn" th:onclick="'showUserDetails(' + ${user.id} + ')'" title="Détails">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                        <button class="db-action-btn" th:onclick="'editUser(' + ${user.id} + ')'" title="Éditer">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <button th:if="${user.status.name() == 'ACTIVE'}" class="db-action-btn" th:onclick="'deactivateUser(' + ${user.id} + ')'" title="Désactiver">
                                            <i class="fas fa-user-times"></i>
                                        </button>
                                        <button th:if="${user.status.name() != 'ACTIVE'}" class="db-action-btn" th:onclick="'activateUser(' + ${user.id} + ')'" title="Activer">
                                            <i class="fas fa-user-check"></i>
                                        </button>
                                        <button th:if="${user.accountLocked}" class="db-action-btn" th:onclick="'unlockUser(' + ${user.id} + ')'" title="Déverrouiller">
                                            <i class="fas fa-unlock"></i>
                                        </button>
                                        <button th:unless="${user.accountLocked}" class="db-action-btn db-action-btn-danger" th:onclick="'lockUser(' + ${user.id} + ')'" title="Verrouiller">
                                            <i class="fas fa-lock"></i>
                                        </button>
                                        <button class="db-action-btn db-action-btn-danger" th:onclick="'deleteUser(' + ${user.id} + ')'" title="Supprimer">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="db-pagination" th:if="${totalPages > 1}" style="padding:12px;">
                    <a class="db-page-btn" th:classappend="${currentPage == 0} ? 'disabled'"
                       th:href="@{/admin/users(page=${currentPage - 1}, size=20, status=${currentStatus}, search=${currentSearch}, sortBy=${currentSort}, sortDir=${currentSortDir})}">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                    <a th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}"
                       class="db-page-btn" th:classappend="${pageNum == currentPage} ? 'active'"
                       th:href="@{/admin/users(page=${pageNum}, size=20, status=${currentStatus}, search=${currentSearch}, sortBy=${currentSort}, sortDir=${currentSortDir})}"
                       th:text="${pageNum + 1}">1</a>
                    <a class="db-page-btn" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'"
                       th:href="@{/admin/users(page=${currentPage + 1}, size=20, status=${currentStatus}, search=${currentSearch}, sortBy=${currentSort}, sortDir=${currentSortDir})}">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                </div>
            </div>

        </div><!-- /db-content -->
    </div><!-- /db-main -->
</div><!-- /db-root -->

<!-- User Details Modal (Bootstrap) -->
<div class="modal fade" id="userDetailsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header" style="background:var(--db-accent);color:#fff;border:none;">
                <h5 class="modal-title"><i class="fas fa-user me-2"></i> Détails de l'utilisateur</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="userDetailsContent">
                <div class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Chargement…</span></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="db-toast" id="db-toast">
    <i class="fas fa-info-circle"></i>
    <span id="db-toast-message"></span>
</div>

<!-- Bootstrap JS for modals -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<th:block th:replace="~{admin/fragments/admin-scripts :: scripts}"></th:block>

<script>
    /* ── Admin AJAX helpers ── */
    function adminAction(url, confirmMsg) {
        if (confirmMsg && !confirm(confirmMsg)) return;
        adminFetch(url, { method: 'POST' })
            .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(function (d) { if (d.success) { showToast(d.message, 'success'); setTimeout(function () { location.reload(); }, 1000); } else { showToast(d.message, 'error'); } })
            .catch(function (e) { showToast('Erreur: ' + e.message, 'error'); });
    }

    function activateUser(id) { adminAction('/admin/users/' + id + '/activate', 'Activer cet utilisateur ?'); }
    function deactivateUser(id) { adminAction('/admin/users/' + id + '/deactivate', 'Désactiver cet utilisateur ?'); }
    function lockUser(id) { adminAction('/admin/users/' + id + '/lock', 'Verrouiller ce compte ?'); }
    function unlockUser(id) { adminAction('/admin/users/' + id + '/unlock', 'Déverrouiller ce compte ?'); }

    function deleteUser(id) {
        if (!confirm('⚠️ ATTENTION: Suppression DÉFINITIVE et IRRÉVERSIBLE !\n\nContinuer ?')) return;
        if (!confirm('🔴 DERNIÈRE CONFIRMATION\n\nÊtes-vous ABSOLUMENT sûr ?')) return;
        adminAction('/admin/users/' + id + '/delete', '');
        // Force run since confirmMsg is empty
        var h = { 'Content-Type': 'application/json' };
        if (csrfToken && csrfHeader) h[csrfHeader] = csrfToken;
        fetch('/admin/users/' + id + '/delete', { method: 'POST', headers: h })
            .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(function (d) { if (d.success) { showToast(d.message, 'success'); setTimeout(function () { location.reload(); }, 2000); } else { showToast(d.message, 'error'); } })
            .catch(function (e) { showToast('Erreur: ' + e.message, 'error'); });
    }

    function showUserDetails(userId) {
        var modal = new bootstrap.Modal(document.getElementById('userDetailsModal'));
        var content = document.getElementById('userDetailsContent');
        content.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
        modal.show();
        fetch('/admin/users/' + userId + '/details')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                content.innerHTML =
                    '<div class="row"><div class="col-md-6">' +
                    '<h6 class="text-muted text-uppercase mb-3">Informations personnelles</h6>' +
                    '<p><strong>Nom:</strong> ' + (data.displayName || 'N/A') + '</p>' +
                    '<p><strong>Email:</strong> ' + data.email + '</p>' +
                    '<p><strong>Téléphone:</strong> ' + (data.phone || 'N/A') + '</p>' +
                    '<p><strong>Entreprise:</strong> ' + (data.companyName || 'N/A') + '</p>' +
                    '</div><div class="col-md-6">' +
                    '<h6 class="text-muted text-uppercase mb-3">Compte</h6>' +
                    '<p><strong>Statut:</strong> <span class="db-status-badge ' + (data.status === 'ACTIVE' ? 'db-status-done' : 'db-status-pending') + '">' + data.status + '</span></p>' +
                    '<p><strong>Verrouillé:</strong> ' + (data.accountLocked ? 'Oui' : 'Non') + '</p>' +
                    '<p><strong>Email vérifié:</strong> ' + (data.emailVerified ? 'Oui' : 'Non') + '</p>' +
                    '<p><strong>Inscription:</strong> ' + (data.registrationDate ? new Date(data.registrationDate).toLocaleString('fr-FR') : 'N/A') + '</p>' +
                    '<p><strong>Dernière connexion:</strong> ' + (data.lastLoginDate ? new Date(data.lastLoginDate).toLocaleString('fr-FR') : 'Jamais') + '</p>' +
                    '</div></div>';
            })
            .catch(function () {
                content.innerHTML = '<div class="db-alert db-alert-warning"><i class="fas fa-exclamation-triangle"></i> Erreur lors du chargement</div>';
            });
    }

    function editUser(userId) {
        fetch('/admin/users/' + userId + '/details')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var modal = new bootstrap.Modal(document.getElementById('userDetailsModal'));
                var content = document.getElementById('userDetailsContent');
                content.innerHTML =
                    '<form id="editUserForm">' +
                    '<div class="row"><div class="col-md-6">' +
                    '<div class="mb-3"><label class="form-label">Prénom</label><input type="text" class="form-control" id="firstName" value="' + (data.displayName ? data.displayName.split(' ')[0] : '') + '"></div>' +
                    '<div class="mb-3"><label class="form-label">Nom</label><input type="text" class="form-control" id="lastName" value="' + (data.displayName ? data.displayName.split(' ').slice(1).join(' ') : '') + '"></div>' +
                    '<div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="editEmail" value="' + data.email + '"></div>' +
                    '</div><div class="col-md-6">' +
                    '<div class="mb-3"><label class="form-label">Téléphone</label><input type="tel" class="form-control" id="phone" value="' + (data.phone || '') + '"></div>' +
                    '<div class="mb-3"><label class="form-label">Entreprise</label><input type="text" class="form-control" id="companyName" value="' + (data.companyName || '') + '"></div>' +
                    '</div></div>' +
                    '<hr><div class="d-flex justify-content-end gap-2">' +
                    '<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>' +
                    '<button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> Sauvegarder</button>' +
                    '</div></form>';

                document.getElementById('editUserForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    var h = { 'Content-Type': 'application/json' };
                    if (csrfToken && csrfHeader) h[csrfHeader] = csrfToken;
                    fetch('/admin/users/' + userId + '/update', {
                        method: 'POST', headers: h,
                        body: JSON.stringify({
                            firstName: document.getElementById('firstName').value,
                            lastName: document.getElementById('lastName').value,
                            email: document.getElementById('editEmail').value,
                            phone: document.getElementById('phone').value,
                            companyName: document.getElementById('companyName').value
                        })
                    })
                    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                    .then(function (d) { if (d.success) { showToast(d.message, 'success'); modal.hide(); setTimeout(function () { location.reload(); }, 1000); } else { showToast(d.message, 'error'); } })
                    .catch(function (e) { showToast('Erreur: ' + e.message, 'error'); });
                });
                modal.show();
            })
            .catch(function (e) { showToast('Erreur: ' + e.message, 'error'); });
    }
</script>

</body>
</html>
