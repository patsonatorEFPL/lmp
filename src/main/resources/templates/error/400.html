<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{error/_layout :: head('Requête invalide', 82)}"></head>
<body>
<div class="err-shell">
    <div class="err-aurora"></div>
    <div class="err-grid"></div>

    <div class="err-card">
        <a th:replace="~{error/_layout :: brand}"></a>

        <div class="err-badge">
            <span class="err-badge-dot"></span>
            <span>Erreur 400 — Requête invalide</span>
        </div>

        <div class="err-code">400</div>

        <h1 class="err-title" th:text="${errorTitle} ?: 'Requête invalide'">Requête invalide</h1>
        <p class="err-desc" th:text="${errorMessage} ?: 'Les données fournies ne sont pas valides ou la requête est mal formée. Vérifiez les informations puis réessayez.'">
            Les données fournies ne sont pas valides ou la requête est mal formée.
        </p>

        <div class="err-actions">
            <a th:href="${returnUrl} ?: '/'" class="err-btn err-btn-primary">
                <svg class="err-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Retour à l'accueil
            </a>
            <button type="button" class="err-btn err-btn-outline" onclick="history.back()">
                <svg class="err-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                Page précédente
            </button>
        </div>

        <div class="err-foot">
            Besoin d'aide&nbsp;?
            <a href="mailto:lmp.assistance@gmail.com">lmp.assistance&#64;gmail.com</a>
        </div>
    </div>
</div>
<script th:replace="~{error/_layout :: cursor-script}"></script>
</body>
</html>
