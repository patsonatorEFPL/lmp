<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{error/_layout :: head('Accès refusé', 40)}"></head>
<body>
<div class="err-shell">
    <div class="err-aurora"></div>
    <div class="err-grid"></div>

    <div class="err-card">
        <a th:replace="~{error/_layout :: brand}"></a>

        <div class="err-badge">
            <span class="err-badge-dot"></span>
            <span>Erreur 403 — Accès refusé</span>
        </div>

        <div class="err-code">403</div>

        <h1 class="err-title" th:text="${errorTitle} ?: 'Accès refusé'">Accès refusé</h1>
        <p class="err-desc" th:text="${errorMessage} ?: 'Vous n\'avez pas les permissions nécessaires pour accéder à cette page. Si vous pensez qu\'il s\'agit d\'une erreur, contactez un administrateur.'">
            Vous n'avez pas les permissions nécessaires pour accéder à cette page.
        </p>

        <div class="err-actions">
            <a th:href="${returnUrl} ?: '/'" class="err-btn err-btn-primary">
                <svg class="err-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Retour à l'accueil
            </a>
            <a href="/login" class="err-btn err-btn-outline">
                <svg class="err-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
                Se connecter
            </a>
        </div>

        <div class="err-foot">
            Si vous pensez que c'est une erreur, contactez l'administrateur à
            <a th:href="|mailto:${companyEmail}|" th:text="${companyEmail}">support@localhost</a>.
        </div>
    </div>
</div>
<script th:replace="~{error/_layout :: cursor-script}"></script>
</body>
</html>
