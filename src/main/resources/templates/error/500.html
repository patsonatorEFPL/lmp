<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{error/_layout :: head('Erreur serveur', 20)}"></head>
<body>
<div class="err-shell">
    <div class="err-aurora"></div>
    <div class="err-grid"></div>

    <div class="err-card">
        <a th:replace="~{error/_layout :: brand}"></a>

        <div class="err-badge">
            <span class="err-badge-dot"></span>
            <span>Erreur 500 — Erreur interne</span>
        </div>

        <div class="err-code">500</div>

        <h1 class="err-title" th:text="${errorTitle} ?: 'Erreur interne du serveur'">Erreur interne du serveur</h1>
        <p class="err-desc" th:text="${errorMessage} ?: 'Une erreur inattendue s\'est produite. Notre équipe a été notifiée. Veuillez réessayer dans un instant.'">
            Une erreur inattendue s'est produite. Veuillez réessayer plus tard.
        </p>

        <div class="err-actions">
            <a th:href="${returnUrl} ?: '/'" class="err-btn err-btn-primary">
                <svg class="err-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Retour à l'accueil
            </a>
            <button type="button" class="err-btn err-btn-outline" onclick="location.reload()">
                <svg class="err-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                Réessayer
            </button>
            <button type="button" class="err-btn err-btn-outline" onclick="history.back()">
                <svg class="err-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                Précédent
            </button>
        </div>

        <div th:if="${technicalDetails}">
            <button type="button" class="err-tech-toggle"
                    onclick="(function(el){var d=document.getElementById('errTech');d.style.display=d.style.display==='block'?'none':'block';el.textContent=d.style.display==='block'?'Masquer les détails techniques':'Afficher les détails techniques';})(this)">
                Afficher les détails techniques
            </button>
            <pre id="errTech" class="err-tech" style="display:none" th:text="${technicalDetails}">Détails…</pre>
        </div>

        <div class="err-foot">
            Si le problème persiste, contactez l'assistance technique à
            <a th:href="|mailto:${companyEmail}|" th:text="${companyEmail}">support@localhost</a>.
        </div>
    </div>
</div>
<script th:replace="~{error/_layout :: cursor-script}"></script>
</body>
</html>
