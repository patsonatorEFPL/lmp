<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur serveur - LMP</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #6f42c1 0%, #dc3545 100%);
        }
        
        .error-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .error-icon {
            font-size: 4rem;
            color: #6f42c1;
            margin-bottom: 1.5rem;
        }
        
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: #6f42c1;
            line-height: 1;
            margin-bottom: 1rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn-outline-secondary {
            border-color: #6c757d;
            color: #6c757d;
            transition: all 0.3s ease;
        }
        
        .btn-outline-secondary:hover {
            background-color: #6c757d;
            border-color: #6c757d;
        }
        
        .technical-details {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-10">
                    <div class="error-card">
                        <i class="fas fa-exclamation-triangle error-icon"></i>
                        <div class="error-code">500</div>
                        <h1 class="h3 mb-3" th:text="${errorTitle} ?: 'Erreur interne du serveur'">Erreur interne du serveur</h1>
                        <p class="text-muted mb-4" th:text="${errorMessage} ?: 'Une erreur inattendue s\'est produite. Veuillez réessayer plus tard.'">
                            Une erreur inattendue s'est produite. Veuillez réessayer plus tard.
                        </p>
                        
                        <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center mb-4">
                            <a th:href="${returnUrl} ?: '/'" class="btn btn-primary">
                                <i class="fas fa-home me-2"></i>
                                Retour à l'accueil
                            </a>
                            <button onclick="location.reload()" class="btn btn-outline-secondary">
                                <i class="fas fa-redo me-2"></i>
                                Réessayer
                            </button>
                            <button onclick="history.back()" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left me-2"></i>
                                Page précédente
                            </button>
                        </div>
                        
                        <!-- Détails techniques (affichés seulement si disponibles) -->
                        <div th:if="${technicalDetails}" class="mt-4 pt-4 border-top">
                            <button class="btn btn-link btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#technicalDetails">
                                <i class="fas fa-code me-1"></i>
                                Détails techniques
                            </button>
                            <div class="collapse mt-3" id="technicalDetails">
                                <div class="technical-details text-start" th:text="${technicalDetails}">
                                    Détails de l'erreur...
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-4 pt-4 border-top">
                            <small class="text-muted">
                                Si le problème persiste, contactez l'assistance technique à
                                <a href="mailto:lmp.assistance@gmail.com">lmp.assistance@gmail.com</a>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
