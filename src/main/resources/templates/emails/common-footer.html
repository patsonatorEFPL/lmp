<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<!--
    Fragment de pied-de-page commun pour tous les emails LMP
    Utilise le routing Cloudflare : support@domaine-configuré.com → lmp.assistance@gmail.com
-->
<body>
    <!-- Fragment commun du pied de page email -->
    <div th:fragment="email-footer" style="background-color:#1a1f36;padding:32px 24px;text-align:center;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
                <td align="center" style="padding-bottom:16px;">
                    <span style="font-family:Inter,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700;color:#ffffff;letter-spacing:0.5px;"
                          th:text="${companyName ?: 'LMP Services'}">LMP Services</span>
                </td>
            </tr>
            <tr>
                <td align="center" style="padding-bottom:16px;">
                    <span style="font-family:Inter,'Segoe UI',Roboto,sans-serif;font-size:13px;color:#8b92a5;line-height:1.6;">
                        Votre partenaire de confiance<br>
                        <a th:href="'mailto:' + (${companyEmail} ?: 'support@localhost')" th:text="${companyEmail} ?: 'support@localhost'" href="mailto:support@localhost" style="color:#6c8aff;text-decoration:none;">support@localhost</a>
                        &nbsp;·&nbsp;
                        <a th:href="${companyWebsite ?: '#'}" href="#" style="color:#6c8aff;text-decoration:none;">Site web</a>
                    </span>
                </td>
            </tr>
            <tr>
                <td align="center" style="border-top:1px solid #2d3352;padding-top:16px;">
                    <span style="font-family:Inter,'Segoe UI',Roboto,sans-serif;font-size:11px;color:#5a6178;line-height:1.5;">
                        Cet email a été envoyé automatiquement. Pour toute question, contactez <strong style="color:#8b92a5;" th:text="${companyEmail} ?: 'support@localhost'">support@localhost</strong><br>
                        © <span th:text="${#temporals.year(#temporals.createNow())}">2025</span>
                        <span th:text="${companyName ?: 'LMP Services'}">LMP Services</span>. Tous droits réservés.
                    </span>
                </td>
            </tr>
        </table>
    </div>

    <!-- Fragment simplifié pour emails transactionnels -->
    <div th:fragment="simple-footer" style="background-color:#f4f5f7;padding:20px;text-align:center;border-top:1px solid #e5e7eb;">
        <span style="font-family:Inter,'Segoe UI',Roboto,sans-serif;font-size:12px;color:#6b7280;">
            <strong th:text="${companyName ?: 'LMP Services'}">LMP Services</strong> ·
            <a th:href="'mailto:' + (${companyEmail} ?: 'support@localhost')" th:text="${companyEmail} ?: 'support@localhost'" href="mailto:support@localhost" style="color:#4f6df5;text-decoration:none;">support@localhost</a>
        </span>
    </div>
</body>
</html>
