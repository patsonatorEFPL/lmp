<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{auth.login.page.title}">Connexion - LMP</title>
    
    <!-- Global Styles (Tailwind + FontAwesome + Custom) -->
    <div th:replace="fragments/styles :: global-styles"></div>

    <style>
        .login-mesh-bg {
            background-color: #f3f4f6;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
        }
    </style>
</head>
<body class="login-mesh-bg min-h-screen flex items-center justify-center p-4">

    <!-- Container Global -->
    <div class="w-full max-w-md animate-fade-in-up">
        
        <!-- Logo ou Titre -->
        <div class="text-center mb-8">
            <a href="/" class="inline-block group">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-primary to-purple-600 flex items-center justify-center text-white text-3xl shadow-lg shadow-primary/30 mx-auto mb-4 group-hover:scale-110 transition-transform duration-300">
                    <i class="fas fa-lock"></i>
                </div>
                <h1 class="text-3xl font-bold text-dark tracking-tight" th:text="#{auth.login.header.title}">Espace Client</h1>
                <p class="text-gray-500 mt-2" th:text="#{auth.login.header.subtitle}">Connectez-vous pour gérer votre visibilité</p>
            </a>
        </div>

        <!-- Carte Login Glassmorphism -->
        <div class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white/50 p-8 md:p-10 relative overflow-hidden">
             <!-- Decorative Top Border -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary via-purple-500 to-primary"></div>

            <!-- Messages d'alerte -->
            <div th:if="${errorMessage}" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-100 text-red-600 flex items-start gap-3 text-sm">
                <i class="fas fa-exclamation-circle mt-0.5"></i>
                <span th:text="${errorMessage}" th:remove="tag">Erreur de connexion</span>
            </div>
            
            <div th:if="${successMessage}" class="mb-6 p-4 rounded-xl bg-green-50 border border-green-100 text-green-600 flex items-start gap-3 text-sm">
                <i class="fas fa-check-circle mt-0.5"></i>
                <span th:text="${successMessage}" th:remove="tag">Succès</span>
            </div>
            
            <div th:if="${warningMessage}" class="mb-6 p-4 rounded-xl bg-yellow-50 border border-yellow-100 text-yellow-700 flex items-start gap-3 text-sm">
                <i class="fas fa-clock mt-0.5"></i>
                <span th:text="${warningMessage}" th:remove="tag">Attention</span>
            </div>

            <!-- Formulaire -->
            <form th:action="@{/perform-login}" method="post" class="space-y-6">
                
                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2" th:text="#{auth.login.email}">Adresse Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                            <i class="far fa-envelope"></i>
                        </div>
                        <input type="email" id="email" name="email" required
                               class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-dark placeholder-gray-400"
                               th:placeholder="#{auth.login.email.placeholder}">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="password" class="block text-sm font-medium text-gray-700" th:text="#{auth.login.password}">Mot de passe</label>
                        <a th:href="@{/forgot-password}" class="text-xs font-medium text-primary hover:text-purple-600 transition-colors" th:text="#{auth.login.forgot}">
                            Oublié ?
                        </a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-lock"></i>
                        </div>
                        <input type="password" id="password" name="password" required
                               class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-dark placeholder-gray-400"
                               placeholder="••••••••">
                    </div>
                </div>

                <!-- Remember Me -->
                <div class="flex items-center">
                    <input type="checkbox" id="rememberMe" name="rememberMe" 
                           class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary transition-colors cursor-pointer">
                    <label for="rememberMe" class="ml-2 block text-sm text-gray-600 cursor-pointer select-none" th:text="#{auth.login.remember}">
                        Se souvenir de moi
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-primary to-purple-600 text-white font-semibold text-sm shadow-lg shadow-primary/30 hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300 flex items-center justify-center gap-2 group">
                    <span th:text="#{auth.login.submit}">Se connecter</span>
                    <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-100"></div>
                </div>
                <div class="relative flex justify-center text-xs uppercase">
                    <span class="bg-white px-2 text-gray-400 tracking-wider" th:text="#{auth.login.new_user}">Nouveau sur LMP ?</span>
                </div>
            </div>

            <!-- Register Link -->
            <div class="text-center">
                <a th:href="@{/register}" class="inline-flex items-center justify-center w-full py-3 px-6 rounded-xl border-2 border-dashed border-gray-200 text-sm font-semibold text-gray-600 hover:border-primary hover:text-primary hover:bg-primary/5 transition-all duration-300" th:text="#{auth.login.create_account}">
                    Créer un compte
                </a>
            </div>
        </div>
        
        <!-- Footer Links -->
        <div class="text-center mt-8">
            <a th:href="@{/}" class="text-sm text-gray-500 hover:text-dark transition-colors inline-flex items-center gap-2">
                <i class="fas fa-arrow-left"></i> <span th:text="#{auth.login.back_home}">Retour à l'accueil</span>
            </a>
        </div>
    </div>

</body>
</html>
