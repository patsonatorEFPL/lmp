# ============================================================================
# LMP backend stack (Frappe-style : tout-en-un compose)
# ============================================================================
# Services dans 1 seul Dokploy Compose project :
#   - backend     : Spring Boot app (build local Dockerfile)
#   - redis-cache : Redis volatile (sessions, rate-limit, SSE pub/sub, caches)
#
# Postgres reste géré comme Dokploy app séparée (`lmp-staging-db`) car la donnée
# est durable et partagée potentiellement entre environnements. Frappe-CRM met
# son MariaDB dans le compose ; pour LMP la DB est plus pérenne et on évite de
# coupler son lifecycle au backend.
#
# Note: `redis-queue` container retiré 2026-05-10 — async work durable
# (email_queue, sync_event_log) tourne via Postgres claim atomique
# (UPDATE...RETURNING + FOR UPDATE SKIP LOCKED). Plus de Redis queue nécessaire.
# 320 MB RAM libérés pour backend replicas.
#
# Network : dokploy-network (overlay externe créé par Dokploy). Tous les services
# se résolvent par leur service name (redis-cache, backend) sur cette network.
# Backend lit ainsi REDIS_HOST=redis-cache directement.
# ============================================================================
version: "3.8"

services:
  redis-cache:
    image: redis:7-alpine
    command: >
      redis-server
        --maxmemory 200mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
        --tcp-keepalive 60
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # Dokploy injecte les env vars (DB_URL, STRIPE_*, OAUTH2_*, mail, etc.) dans
    # ./.env à la racine du compose. env_file le charge dans le container.
    env_file:
      - .env
    environment:
      # Redis : utilise les service names compose (résolus via dokploy-network)
      # Override l'éventuelle valeur dans .env pour pointer redis-cache.
      REDIS_HOST: redis-cache
      REDIS_PORT: "6379"
    depends_on:
      redis-cache:
        condition: service_healthy
    networks:
      - dokploy-network
    deploy:
      # Baseline = 2 (HA minimum). Autoscaler (Oracle host /opt/lmp-autoscaler/)
      # scale 2..5 selon CPU via `docker compose --scale`. À chaque redeploy
      # Dokploy, baseline revient ici — autoscaler reprend ensuite si charge.
      replicas: 2
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 384M
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        order: start-first
        failure_action: continue
        max_failure_ratio: 0.5
    healthcheck:
      test: ["CMD-SHELL", "curl -f -m 25 http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 90s

networks:
  dokploy-network:
    external: true
