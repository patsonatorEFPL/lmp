# ========================================
# Docker Compose pour Coolify Deployment
# Application Spring Boot LMP - Production
# Domaine: https://lmp-services.ca
#
# Architecture supportée:
# 1. Déploiement direct: Internet → Coolify (SSL) → Spring Boot
# 2. Avec reverse proxy: Internet → Nginx/Traefik → Coolify → Spring Boot
# ========================================

version: '3.8'

services:
  lmp-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lmp-spring-app
    restart: unless-stopped
    
    # Configuration des ports
    ports:
      - "${PORT:-8080}:8080"
    
    # Variables d'environnement pour Coolify
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - PORT=${PORT:-8080}
      
      # Configuration des headers pour reverse proxy (si nécessaire)
      - SERVER_FORWARD_HEADERS_STRATEGY=${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
      - SERVER_USE_FORWARD_HEADERS=${SERVER_USE_FORWARD_HEADERS:-true}
      
      # Configuration base de données (à adapter selon Coolify)
      - SPRING_DATASOURCE_URL=${DATABASE_URL}
      - SPRING_DATASOURCE_USERNAME=${DATABASE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD}
      
      # Configuration Stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      
      # Configuration application - Nouveau domaine
      - APP_BASE_URL=${APP_BASE_URL:-https://lmp-services.ca}
      
      # Configuration emails
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD}
      
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Limites de ressources
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    
    # Volumes pour persistance
    volumes:
      - app-logs:/app/logs
      - app-invoices:/app/invoices
    
    # Réseau pour communication interne
    networks:
      - lmp-network

# Volumes nommés pour persistance des données
volumes:
  app-logs:
    driver: local
    # Stockage des logs d'application
  app-invoices:
    driver: local
    # Stockage des factures générées

# Réseau pour communication entre services
# Utilisé pour isoler l'application si déployée avec reverse proxy
networks:
  lmp-network:
    driver: bridge
    # Réseau bridge pour communication interne