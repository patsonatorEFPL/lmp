# PostgreSQL local pour le développement — données persistantes (volume Docker).
# Usage : docker compose -f docker-compose.dev.yml up -d
# Puis lancer le backend : ./mvnw spring-boot:run  (ou LmpApplication / TestLmpApplication depuis l’IDE)
#
# Mot de passe par défaut aligné sur application-dev.properties (surcharge possible via DB_PASSWORD).

services:
  lmp-dev-db:
    image: postgres:18-alpine
    container_name: lmp-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lmp_db
      POSTGRES_USER: lmp_dev
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lmp_dev_local}
    # Port hôte 5433 par défaut : évite le conflit avec un PostgreSQL Windows sur 5432 (IPv4).
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - lmp-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmp_dev -d lmp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lmp-dev-pgdata:
    driver: local
