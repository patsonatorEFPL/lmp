# Configuration Nginx pour LMP Services - https://lmp-services.ca
# Optimisée pour Spring Boot avec SSL/TLS, sécurité et performance

# Rate limiting - Protection contre les attaques DDoS
limit_req_zone $binary_remote_addr zone=main:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Cache pour les ressources statiques
proxy_cache_path /var/cache/nginx/lmp levels=1:2 keys_zone=lmp_cache:10m max_size=100m inactive=60m use_temp_path=off;

# Configuration upstream pour Spring Boot
upstream lmp_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Redirection HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name lmp-services.ca www.lmp-services.ca;
    
    # Gestion des certificats Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    
    # Redirection permanente vers HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Configuration HTTPS principale
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lmp-services.ca www.lmp-services.ca;
    
    # Configuration SSL/TLS
    ssl_certificate /etc/letsencrypt/live/lmp-services.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lmp-services.ca/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/lmp-services.ca/chain.pem;
    
    # Protocoles et ciphers sécurisés
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # Configuration SSL avancée
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com;" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Configuration des logs
    access_log /var/log/nginx/lmp-services.ca.access.log;
    error_log /var/log/nginx/lmp-services.ca.error.log warn;
    
    # Taille maximale des uploads
    client_max_body_size 10M;
    
    # Timeouts optimisés pour Spring Boot
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Buffers optimisés
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    
    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # Rate limiting global
    limit_req zone=main burst=20 nodelay;
    
    # Gestion des ressources statiques avec cache
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://lmp_backend;
        proxy_cache lmp_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;
        expires 7d;
        add_header Cache-Control "public, immutable";
        
        # Headers X-Forwarded pour les ressources statiques
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
    
    # Protection spéciale pour les pages de connexion
    location ~ ^/(login|register|admin) {
        limit_req zone=login burst=10 nodelay;
        
        proxy_pass http://lmp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Headers X-Forwarded complets
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Server $host;
        
        # Headers additionnels pour Spring Security
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-Url-Scheme $scheme;
    }
    
    # Protection pour les APIs avec rate limiting plus élevé
    location ~ ^/(api|payment|webhook) {
        limit_req zone=api burst=50 nodelay;
        
        proxy_pass http://lmp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Headers X-Forwarded complets
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Server $host;
        
        # Headers spéciaux pour les webhooks Stripe
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-Url-Scheme $scheme;
    }
    
    # Configuration principale pour toutes les autres routes
    location / {
        proxy_pass http://lmp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Headers X-Forwarded complets requis par Spring Boot
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Server $host;
        
        # Headers additionnels pour Spring Security
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-Url-Scheme $scheme;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Cache control pour le contenu dynamique
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # Protection contre l'accès direct aux fichiers sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Blocage des bots malveillants
    location ~ /(wp-admin|wp-login|phpMyAdmin|phpmyadmin) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
    
    # Page d'erreur personnalisée
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/html;
        internal;
    }
    
    # Monitoring de santé Nginx
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# Configuration pour les métriques (optionnel)
server {
    listen 8081;
    server_name localhost;
    
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}