server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # === Compression GZIP ===
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        application/manifest+json;

    # === Security Headers ===
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # === SEO: Serve robots.txt ===
    location = /robots.txt {
        access_log off;
        add_header Content-Type "text/plain; charset=utf-8";
    }

    # === SEO: Serve sitemap.xml ===
    location = /sitemap.xml {
        access_log off;
        add_header Content-Type "application/xml; charset=utf-8";
    }

    # === SEO: Serve manifest ===
    location = /manifest.webmanifest {
        access_log off;
        add_header Content-Type "application/manifest+json; charset=utf-8";
    }

    # === Angular SPA routing (fallback to index.html) ===
    location / {
        try_files $uri $uri/ /index.html;

        # HTML files: no long-term cache (ensure fresh deploys are picked up)
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            # Re-add security headers (Nginx location block resets headers)
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }

    # === Cache for hashed static assets (JS, CSS, images, fonts) ===
    location ~* \.(?:css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # === Deny access to hidden files ===
    location ~ /\. {
        deny all;
    }

    # === Trailing slash redirect (SEO: avoid duplicate content) ===
    # Angular handles routing, but for direct access with trailing slash:
    rewrite ^/(.*)/$ /$1 permanent;
}
