    <!-- Prevent theme FOUC: apply saved theme before first paint -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('lmp-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var useDark;
          if (saved === 'light') useDark = false;
          else if (saved === 'dark') useDark = true;
          else useDark = prefersDark;
          document.documentElement.classList.toggle('dark', useDark);
        } catch(e) {}
      })();
    </script>
    <!-- Navbar auth slot : évite flash blanc (squelette --muted clair ou lien sans variables CSS) avant le bundle -->
    <style>

        background-color: rgba(255, 255, 255, 0.14) !important;
      }
      html:not(.dark) lmp-navbar .lmp-nav-auth-placeholder {
