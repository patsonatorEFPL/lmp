# ========================================
# CONFIGURATION MAILTRAP POUR LMP-SERVICES.CA
# ========================================
# À copier dans application.properties une fois les credentials obtenus

# SMTP Mailtrap (remplace Gmail pour authentification domaine)
spring.mail.host=send.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=YOUR_MAILTRAP_USERNAME_HERE
spring.mail.password=YOUR_MAILTRAP_API_TOKEN_HERE
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=send.smtp.mailtrap.io
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# Configuration d'envoi optimisée
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Logs pour debugging (à désactiver en prod)
spring.mail.properties.mail.debug=false

# ========================================
# ENREGISTREMENTS DNS À CONFIGURER DANS CLOUDFLARE
# ========================================

# 1. SPF Record (TXT)
# Name: lmp-services.ca
# Value: v=spf1 include:send.smtp.mailtrap.io ~all

# 2. DKIM Record (sera fourni par Mailtrap - format CNAME)
# Name: [selector]._domainkey.lmp-services.ca
# Value: [selector]._domainkey.send.smtp.mailtrap.io

# 3. DMARC Record (TXT) - Politique permissive au début
# Name: _dmarc.lmp-services.ca
# Value: v=DMARC1; p=none; rua=mailto:dmarc-reports@lmp-services.ca; sp=none; adkim=r; aspf=r;

# ========================================
# AVANTAGES MAILTRAP VS GMAIL
# ========================================
# ✅ Authentification native pour lmp-services.ca
# ✅ SPF/DKIM alignés automatiquement  
# ✅ Pas de "via gmail.com" dans l'affichage
# ✅ Meilleure délivrabilité
# ✅ Analytics d'envoi intégrées
# ✅ API REST disponible si besoin
# ✅ Support de DMARC natif

# ========================================
# INSTRUCTIONS DE DÉPLOIEMENT
# ========================================
# 1. Configurer le domaine dans Mailtrap
# 2. Ajouter les DNS dans Cloudflare
# 3. Attendre propagation DNS (24h max)
# 4. Copier username/password dans application.properties
# 5. Redémarrer l'application
# 6. Tester l'envoi d'email
